<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football AI — Multi-Market Viewer</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#111827;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#111827;color:#fff}header h1{margin:0 0 6px;font-size:22px}header p{margin:0;opacity:.8}main{max-width:1400px;margin:auto;padding:20px}.controls,.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,button{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}.card,.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;box-shadow:0 1px 2px #0001}.stat strong{display:block;font-size:22px}.top{display:flex;justify-content:space-between;gap:10px}.teams{font-size:18px;font-weight:750;margin:5px 0}.league,.meta{font-size:12px;color:#6b7280}.badge{font-size:12px;font-weight:700;background:#eef2ff;padding:5px 8px;border-radius:999px;height:max-content}.section{margin-top:12px;padding-top:10px;border-top:1px solid #eee}.section-title{font-size:13px;font-weight:800;margin-bottom:8px}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#f9fafb;border-radius:9px;padding:9px;text-align:center;font-size:12px}.box strong{display:block;font-size:18px;margin-top:3px}.na{padding:9px;background:#f9fafb;border-radius:9px;color:#9ca3af;font-size:12px}.note{background:#fff7ed;color:#9a3412;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:13px}.updated{margin-left:auto;color:#6b7280;font-size:12px}@media(max-width:640px){main{padding:12px}.grid{grid-template-columns:1fr}.updated{width:100%;margin-left:0}}
</style>
</head>
<body>
<header><h1>Football AI — Multi‑Market</h1><p>Исход · фора · тотал голов · угловые · индивидуальные угловые</p></header>
<main>
<div class="note">Дополнительные рынки — рыночные вероятности после удаления маржи (no‑vig). Если рынок не собран или букмекерского покрытия нет, показывается «Нет данных».</div>
<div class="controls"><select id="league"><option value="ALL">Все лиги</option></select><select id="status"><option value="UPCOMING" selected>Ближайшие</option><option value="ALL">Все статусы</option><option value="AWAITING_RESULT">Ожидаем результат</option><option value="SETTLED">Завершённые</option></select><button id="refresh">Обновить</button><span id="updated" class="updated"></span></div>
<div id="summary" class="summary"></div><div id="grid" class="grid"></div>
</main>
<script>
let payload=null;const $=x=>document.getElementById(x),pct=v=>v==null?'—':(100*Number(v)).toFixed(1)+'%',dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—',sign=v=>Number(v)>=0?'+'+Number(v):String(v);
function pair(title,a,b){return `<div class="section"><div class="section-title">${title}</div>${a&&b?`<div class="two"><div class="box">${a.label}<strong>${a.value}</strong></div><div class="box">${b.label}<strong>${b.value}</strong></div></div>`:'<div class="na">Нет данных</div>'}</div>`}
function render(){if(!payload)return;const league=$('league').value,status=$('status').value,rows=payload.matches.filter(x=>(league==='ALL'||x.league===league)&&(status==='ALL'||x.status===status));$('summary').innerHTML=[[payload.summary.upcoming,'Ближайшие'],[payload.summary.awaiting_result||0,'Ожидают'],[payload.summary.settled,'Завершённые']].map(x=>`<div class="stat"><strong>${x[0]}</strong>${x[1]}</div>`).join('');$('grid').innerHTML=rows.map(x=>{const m=x.multi_market||{},h=m.handicap,g=m.total_goals,c=m.total_corners,tc=m.team_corners||{};return `<article class="card"><div class="top"><div><div class="league">${x.league}</div><div class="teams">${x.home_team} — ${x.away_team}</div><div class="meta">${dt(x.kickoff_utc)} · ${x.prediction_mode}</div></div><span class="badge">${x.status}</span></div><div class="section"><div class="section-title">Исход матча · 1X2</div><div class="probs"><div class="box">П1<strong>${pct(x.market?.home)}</strong></div><div class="box">X<strong>${pct(x.market?.draw)}</strong></div><div class="box">П2<strong>${pct(x.market?.away)}</strong></div></div></div>${pair('Исход с форой',h?{label:x.home_team+' '+sign(h.home_handicap),value:pct(h.home_probability)}:null,h?{label:x.away_team+' '+sign(h.away_handicap),value:pct(h.away_probability)}:null)}${pair('Тотал голов',g?{label:'ТБ '+g.point,value:pct(g.over_probability)}:null,g?{label:'ТМ '+g.point,value:pct(g.under_probability)}:null)}${pair('Тотал угловых',c?{label:'ТБ '+c.point,value:pct(c.over_probability)}:null,c?{label:'ТМ '+c.point,value:pct(c.under_probability)}:null)}${pair('Индивидуальный тотал угловых · '+x.home_team,tc.home?{label:'ТБ '+tc.home.point,value:pct(tc.home.over_probability)}:null,tc.home?{label:'ТМ '+tc.home.point,value:pct(tc.home.under_probability)}:null)}${pair('Индивидуальный тотал угловых · '+x.away_team,tc.away?{label:'ТБ '+tc.away.point,value:pct(tc.away.over_probability)}:null,tc.away?{label:'ТМ '+tc.away.point,value:pct(tc.away.under_probability)}:null)}</article>`}).join('')||'<div class="na">Нет матчей для выбранного фильтра.</div>'}
async function load(){const r=await fetch('/api/research-viewer',{cache:'no-store'});payload=await r.json();const current=$('league').value,leagues=[...new Set(payload.matches.map(x=>x.league))].sort();$('league').innerHTML='<option value="ALL">Все лиги</option>'+leagues.map(x=>`<option value="${x}">${x}</option>`).join('');if(leagues.includes(current))$('league').value=current;$('updated').textContent='Обновлено: '+dt(payload.generated_at_utc);render()}
$('league').onchange=render;$('status').onchange=render;$('refresh').onclick=load;load();setInterval(load,60000);
</script>
</body></html>
