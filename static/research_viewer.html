<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Football AI — Research Viewer</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111827;background:#f5f6f8}
    body{margin:0}header{padding:20px 24px;background:#111827;color:white}header h1{margin:0 0 6px;font-size:22px}header p{margin:0;opacity:.8}
    main{max-width:1280px;margin:auto;padding:20px}.toolbar,.controls,.summary,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.toolbar{justify-content:space-between}
    select,button{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:white;cursor:pointer}button.active{background:#111827;color:white;border-color:#111827}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.panel{margin-bottom:16px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.league{font-size:12px;font-weight:700;letter-spacing:.04em;color:#4b5563}.teams{font-size:18px;font-weight:700;margin:6px 0}.meta,.muted{color:#6b7280;font-size:13px}
    .probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.prob,.stat-box{background:#f9fafb;border-radius:10px;padding:12px}.prob{text-align:center}.prob strong,.stat-box strong{display:block;font-size:22px;margin-top:4px}.section{margin-top:12px;padding-top:10px;border-top:1px solid #eee}
    .status-badge,.outcome{font-size:12px;font-weight:700;padding:4px 7px;border-radius:999px}.status-badge{background:#eef2ff}.outcome-win{background:#dcfce7;color:#166534}.outcome-loss{background:#fee2e2;color:#991b1b}.win strong{color:#166534}.loss strong{color:#991b1b}.hidden{display:none}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{font-size:12px;color:#6b7280}tr.total-row td{font-weight:800;border-top:2px solid #111827;background:#f9fafb}.error{padding:14px;background:#fee2e2;color:#991b1b;border-radius:10px}.empty{padding:24px;text-align:center;color:#6b7280}
    .note{padding:12px 14px;border-radius:10px;background:#eef2ff;color:#3730a3;margin-bottom:14px}.metric-good{color:#166534}.metric-warn{color:#92400e}
    @media(max-width:640px){main{padding:14px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="toolbar"><div><h1 id="title">Football AI — Исследовательский просмотр</h1><p id="subtitle">ТОЛЬКО ЧТЕНИЕ · канонические прогнозы · результаты</p></div><div><button id="langRu" class="active">RU</button><button id="langEn">EN</button></div></div></header>
<main>
  <div class="tabs"><button id="tabMatches" class="active">Матчи</button><button id="tabStats">Общая статистика</button></div>
  <section id="matchesView">
    <div class="controls">
      <select id="leagueSelect"><option value="ALL">Все лиги</option></select>
      <select id="statusSelect"><option value="ALL">Все статусы</option><option value="UPCOMING">Ближайшие</option><option value="AWAITING_RESULT">В игре / ожидаем результат</option><option value="SETTLED">Завершённые</option></select>
      <button id="refreshButton">Обновить</button>
    </div>
    <div id="summary" class="summary"></div><div id="error"></div><div id="grid" class="grid"></div>
  </section>
  <section id="statsView" class="hidden">
    <div id="statsError"></div><div id="statsSummary" class="stat-grid"></div>
    <div class="panel"><h2 id="leagueStatsTitle">По лигам</h2><div style="overflow-x:auto"><table><thead><tr id="leagueStatsHead"></tr></thead><tbody id="leagueStatsBody"></tbody></table></div></div>
    <div class="panel">
      <h2 id="oosTitle">OOS-аудит MARKET_ONLY</h2>
      <div id="oosNote" class="note"></div>
      <div id="oosSummary" class="stat-grid"></div>
      <h3 id="bucketTitle">Калибровка по уверенности</h3>
      <div style="overflow-x:auto"><table><thead><tr id="bucketHead"></tr></thead><tbody id="bucketBody"></tbody></table></div>
      <h3 id="oosLeagueTitle">OOS по лигам</h3>
      <div style="overflow-x:auto"><table><thead><tr id="oosLeagueHead"></tr></thead><tbody id="oosLeagueBody"></tbody></table></div>
    </div>
    <div class="panel"><h2 id="marketStatsTitle">Распределение рыночных выборов</h2><div id="marketStats" class="stat-grid"></div></div>
  </section>
</main>
<script>
let payload=null, lang='ru';
const els={
  title:document.getElementById('title'), subtitle:document.getElementById('subtitle'), langRu:document.getElementById('langRu'), langEn:document.getElementById('langEn'),
  tabMatches:document.getElementById('tabMatches'), tabStats:document.getElementById('tabStats'), matchesView:document.getElementById('matchesView'), statsView:document.getElementById('statsView'),
  leagueSelect:document.getElementById('leagueSelect'), statusSelect:document.getElementById('statusSelect'), refreshButton:document.getElementById('refreshButton'), summary:document.getElementById('summary'), error:document.getElementById('error'), grid:document.getElementById('grid'),
  statsError:document.getElementById('statsError'), statsSummary:document.getElementById('statsSummary'), leagueStatsTitle:document.getElementById('leagueStatsTitle'), leagueStatsHead:document.getElementById('leagueStatsHead'), leagueStatsBody:document.getElementById('leagueStatsBody'), marketStatsTitle:document.getElementById('marketStatsTitle'), marketStats:document.getElementById('marketStats'),
  oosTitle:document.getElementById('oosTitle'), oosNote:document.getElementById('oosNote'), oosSummary:document.getElementById('oosSummary'), bucketTitle:document.getElementById('bucketTitle'), bucketHead:document.getElementById('bucketHead'), bucketBody:document.getElementById('bucketBody'), oosLeagueTitle:document.getElementById('oosLeagueTitle'), oosLeagueHead:document.getElementById('oosLeagueHead'), oosLeagueBody:document.getElementById('oosLeagueBody')
};
const T={
  ru:{title:'Football AI — Исследовательский просмотр',subtitle:'ТОЛЬКО ЧТЕНИЕ · канонические прогнозы · результаты',matches:'Матчи',stats:'Общая статистика',allL:'Все лиги',allS:'Все статусы',up:'Ближайшие',await:'В игре / ожидаем результат',set:'Завершённые',refresh:'Обновить',pred:'Прогнозов',completed:'Завершено',won:'Выигрышные',lost:'Проигрышные',inplay:'В игре',accuracy:'Точность',league:'Лига',total:'Всего',result:'Результат',market:'Рыночный прогноз',kick:'Начало',snap:'Снимок',byLeague:'По лигам',dist:'Распределение рыночных выборов',home:'П1',draw:'X',away:'П2',updated:'Обновлено',struct:'Structural покрытие',avg:'Среднее расхождение',played:'Сыграл',miss:'Не сыграл',noMatches:'Нет матчей для выбранного фильтра.',totalRow:'ИТОГО',loadError:'Не удалось загрузить данные',oos:'OOS-аудит MARKET_ONLY',oosNote:'Только завершённые canonical прогнозы. Метрики пересчитываются автоматически; это диагностика, а не readiness threshold.',brier:'Brier',logloss:'Log loss',meanConf:'Средняя уверенность',calGap:'Calibration gap',majority:'Majority baseline',uniformBrier:'Uniform Brier',uniformLogloss:'Uniform log loss',bucket:'Диапазон',count:'N',bucketConf:'Средняя уверенность',bucketAcc:'Фактическая точность',gap:'Разрыв',calibration:'Калибровка по уверенности',oosByLeague:'OOS по лигам'},
  en:{title:'Football AI — Research Viewer',subtitle:'READ-ONLY · canonical predictions · results',matches:'Matches',stats:'Overall statistics',allL:'All leagues',allS:'All statuses',up:'Upcoming',await:'In play / awaiting result',set:'Settled',refresh:'Refresh',pred:'Predictions',completed:'Completed',won:'Won',lost:'Lost',inplay:'In play',accuracy:'Accuracy',league:'League',total:'Total',result:'Result',market:'Market prediction',kick:'Kickoff',snap:'Snapshot',byLeague:'By league',dist:'Market pick distribution',home:'Home',draw:'Draw',away:'Away',updated:'Updated',struct:'Structural coverage',avg:'Average disagreement',played:'Won',miss:'Lost',noMatches:'No matches for the selected filter.',totalRow:'TOTAL',loadError:'Failed to load data',oos:'MARKET_ONLY OOS audit',oosNote:'Settled canonical predictions only. Metrics update automatically; this is diagnostic, not a readiness threshold.',brier:'Brier',logloss:'Log loss',meanConf:'Mean confidence',calGap:'Calibration gap',majority:'Majority baseline',uniformBrier:'Uniform Brier',uniformLogloss:'Uniform log loss',bucket:'Bucket',count:'N',bucketConf:'Mean confidence',bucketAcc:'Observed accuracy',gap:'Gap',calibration:'Confidence calibration',oosByLeague:'OOS by league'}
};
const tr=k=>T[lang][k], pct=v=>v==null||Number.isNaN(Number(v))?'—':(100*Number(v)).toFixed(1)+'%', num=(v,d=3)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toFixed(d), dt=v=>v?new Date(v).toLocaleString(lang==='ru'?'ru-RU':'en-GB'):'—', lab=x=>({H:'1',D:'X',A:'2'})[x]||x||'—';
const isSettled=x=>x.status==='SETTLED'&&x.result&&x.market?.pick, isWin=x=>isSettled(x)&&x.market.pick===x.result.result;
function setLang(next){
  lang=next; document.documentElement.lang=lang; els.langRu.classList.toggle('active',lang==='ru'); els.langEn.classList.toggle('active',lang==='en');
  els.title.textContent=tr('title'); els.subtitle.textContent=tr('subtitle'); els.tabMatches.textContent=tr('matches'); els.tabStats.textContent=tr('stats');
  els.leagueSelect.options[0].text=tr('allL'); els.statusSelect.options[0].text=tr('allS'); els.statusSelect.options[1].text=tr('up'); els.statusSelect.options[2].text=tr('await'); els.statusSelect.options[3].text=tr('set'); els.refreshButton.textContent=tr('refresh'); els.leagueStatsTitle.textContent=tr('byLeague'); els.marketStatsTitle.textContent=tr('dist');
  els.oosTitle.textContent=tr('oos'); els.oosNote.textContent=tr('oosNote'); els.bucketTitle.textContent=tr('calibration'); els.oosLeagueTitle.textContent=tr('oosByLeague'); renderMatches(); renderStats();
}
function switchTab(name){const matches=name==='matches'; els.tabMatches.classList.toggle('active',matches); els.tabStats.classList.toggle('active',!matches); els.matchesView.classList.toggle('hidden',!matches); els.statsView.classList.toggle('hidden',matches)}
function statusText(status){return status==='UPCOMING'?tr('up'):status==='AWAITING_RESULT'?tr('await'):status==='SETTLED'?tr('set'):status}
function renderMatches(){
  if(!payload)return;
  const league=els.leagueSelect.value, status=els.statusSelect.value;
  const rows=payload.matches.filter(x=>(league==='ALL'||x.league===league)&&(status==='ALL'||x.status===status));
  els.summary.innerHTML=[[tr('pred'),payload.summary.predictions],[tr('up'),payload.summary.upcoming],[tr('await'),payload.summary.awaiting_result||0],[tr('set'),payload.summary.settled]].map(([a,b])=>`<div class="stat-box"><strong>${b}</strong>${a}</div>`).join('');
  els.grid.innerHTML=rows.length?rows.map(x=>{const o=isSettled(x)?`<span class="outcome ${isWin(x)?'outcome-win':'outcome-loss'}">${isWin(x)?'✓ '+tr('played'):'✕ '+tr('miss')}</span>`:''; return `<article class="card"><div class="top"><div><div class="league">${x.league}</div><div class="teams">${x.home_team} — ${x.away_team}</div></div><span class="status-badge">${statusText(x.status)}</span></div><div class="meta">${tr('kick')}: ${dt(x.kickoff_utc)}<br>${tr('snap')}: ${dt(x.snapshot_time_utc)} · ${x.prediction_mode}</div><div class="section"><strong>${tr('market')} · ${lab(x.market?.pick)}</strong><div class="probs"><div class="prob">1<strong>${pct(x.market?.home)}</strong></div><div class="prob">X<strong>${pct(x.market?.draw)}</strong></div><div class="prob">2<strong>${pct(x.market?.away)}</strong></div></div></div><div class="section"><strong>${tr('result')}:</strong> ${x.result?x.result.home_goals+':'+x.result.away_goals+' ('+x.result.result+')':'—'} ${o}</div></article>`}).join(''):`<div class="empty">${tr('noMatches')}</div>`;
}
function statsFor(rows){const completed=rows.filter(isSettled), wins=completed.filter(isWin).length, losses=completed.length-wins, inPlay=rows.filter(x=>x.status==='AWAITING_RESULT').length, upcoming=rows.filter(x=>x.status==='UPCOMING').length, structural=rows.filter(x=>x.structural), avg=structural.length?structural.reduce((s,x)=>s+Number(x.structural.max_abs_delta||0),0)/structural.length:null; return {completed,wins,losses,inPlay,upcoming,structural,avg,accuracy:completed.length?wins/completed.length:null,coverage:rows.length?structural.length/rows.length:null}}
function probsFor(x){return {H:Number(x.market?.home),D:Number(x.market?.draw),A:Number(x.market?.away)}}
function oosMetrics(rows){
  const settled=rows.filter(isSettled).filter(x=>['H','D','A'].includes(x.result.result));
  if(!settled.length)return {n:0,accuracy:null,brier:null,logloss:null,meanConfidence:null,calGap:null,majority:null};
  let wins=0,brier=0,logloss=0,conf=0; const actual={H:0,D:0,A:0};
  settled.forEach(x=>{const p=probsFor(x), y=x.result.result; actual[y]++; if(x.market.pick===y)wins++; const py=Math.min(1-1e-15,Math.max(1e-15,p[y])); logloss+=-Math.log(py); brier+=['H','D','A'].reduce((s,k)=>s+Math.pow(p[k]-(k===y?1:0),2),0); conf+=Number(x.market.pick_probability ?? Math.max(p.H,p.D,p.A));});
  const accuracy=wins/settled.length, meanConfidence=conf/settled.length;
  return {n:settled.length,accuracy,brier:brier/settled.length,logloss:logloss/settled.length,meanConfidence,calGap:Math.abs(meanConfidence-accuracy),majority:Math.max(actual.H,actual.D,actual.A)/settled.length};
}
function confidenceBuckets(rows){
  const defs=[[0,.4,'<40%'],[.4,.5,'40–50%'],[.5,.6,'50–60%'],[.6,.7,'60–70%'],[.7,1.000001,'≥70%']];
  const settled=rows.filter(isSettled);
  return defs.map(([lo,hi,label])=>{const r=settled.filter(x=>{const c=Number(x.market.pick_probability ?? Math.max(Number(x.market.home),Number(x.market.draw),Number(x.market.away)));return c>=lo&&c<hi}); if(!r.length)return {label,n:0,conf:null,acc:null,gap:null}; const conf=r.reduce((s,x)=>s+Number(x.market.pick_probability ?? Math.max(Number(x.market.home),Number(x.market.draw),Number(x.market.away))),0)/r.length; const acc=r.filter(isWin).length/r.length; return {label,n:r.length,conf,acc,gap:acc-conf};});
}
function renderOos(rows){
  const m=oosMetrics(rows);
  els.oosSummary.innerHTML=[[tr('completed'),m.n],[tr('accuracy'),pct(m.accuracy)],[tr('brier'),num(m.brier)],[tr('logloss'),num(m.logloss)],[tr('meanConf'),pct(m.meanConfidence)],[tr('calGap'),pct(m.calGap)],[tr('majority'),pct(m.majority)],[tr('uniformBrier'),num(2/3)],[tr('uniformLogloss'),num(Math.log(3))]].map(([a,b])=>`<div class="stat-box"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('');
  els.bucketHead.innerHTML=[tr('bucket'),tr('count'),tr('bucketConf'),tr('bucketAcc'),tr('gap')].map(x=>`<th>${x}</th>`).join('');
  els.bucketBody.innerHTML=confidenceBuckets(rows).map(b=>`<tr><td><strong>${b.label}</strong></td><td>${b.n}</td><td>${pct(b.conf)}</td><td>${pct(b.acc)}</td><td>${b.gap==null?'—':((b.gap>=0?'+':'')+(100*b.gap).toFixed(1)+' п.п.')}</td></tr>`).join('');
  els.oosLeagueHead.innerHTML=[tr('league'),tr('count'),tr('accuracy'),tr('brier'),tr('logloss'),tr('meanConf'),tr('calGap')].map(x=>`<th>${x}</th>`).join('');
  const leagues=[...new Set(rows.map(x=>x.league))].sort();
  const body=leagues.map(name=>{const m=oosMetrics(rows.filter(x=>x.league===name));return `<tr><td><strong>${name}</strong></td><td>${m.n}</td><td>${pct(m.accuracy)}</td><td>${num(m.brier)}</td><td>${num(m.logloss)}</td><td>${pct(m.meanConfidence)}</td><td>${pct(m.calGap)}</td></tr>`}).join('');
  els.oosLeagueBody.innerHTML=body+`<tr class="total-row"><td>${tr('totalRow')}</td><td>${m.n}</td><td>${pct(m.accuracy)}</td><td>${num(m.brier)}</td><td>${num(m.logloss)}</td><td>${pct(m.meanConfidence)}</td><td>${pct(m.calGap)}</td></tr>`;
}
function renderStats(){
  if(!payload)return; const rows=payload.matches, all=statsFor(rows);
  els.statsSummary.innerHTML=[[tr('pred'),rows.length,''],[tr('completed'),all.completed.length,''],[tr('won'),all.wins,'win'],[tr('lost'),all.losses,'loss'],[tr('inplay'),all.inPlay,''],[tr('up'),all.upcoming,''],[tr('accuracy'),pct(all.accuracy),''],[tr('struct'),pct(all.coverage),''],[tr('avg'),pct(all.avg),''],[tr('updated'),dt(payload.generated_at_utc),'']].map(([a,b,c])=>`<div class="stat-box ${c}"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('');
  els.leagueStatsHead.innerHTML=[tr('league'),tr('total'),tr('completed'),tr('won'),tr('lost'),tr('inplay'),tr('up'),tr('accuracy'),tr('struct'),tr('avg')].map(x=>`<th>${x}</th>`).join('');
  const leagues=[...new Set(rows.map(x=>x.league))].sort();
  const leagueRows=leagues.map(name=>{const r=rows.filter(x=>x.league===name), s=statsFor(r); return `<tr><td><strong>${name}</strong></td><td>${r.length}</td><td>${s.completed.length}</td><td>${s.wins}</td><td>${s.losses}</td><td>${s.inPlay}</td><td>${s.upcoming}</td><td>${pct(s.accuracy)}</td><td>${pct(s.coverage)}</td><td>${pct(s.avg)}</td></tr>`}).join('');
  const totalRow=`<tr class="total-row"><td>${tr('totalRow')}</td><td>${rows.length}</td><td>${all.completed.length}</td><td>${all.wins}</td><td>${all.losses}</td><td>${all.inPlay}</td><td>${all.upcoming}</td><td>${pct(all.accuracy)}</td><td>${pct(all.coverage)}</td><td>${pct(all.avg)}</td></tr>`;
  els.leagueStatsBody.innerHTML=leagueRows+totalRow;
  renderOos(rows);
  const picks={H:0,D:0,A:0}; rows.forEach(x=>{if(Object.prototype.hasOwnProperty.call(picks,x.market?.pick))picks[x.market.pick]++}); els.marketStats.innerHTML=[[tr('home'),picks.H],[tr('draw'),picks.D],[tr('away'),picks.A]].map(([a,b])=>`<div class="stat-box"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('');
}
async function load(){els.error.innerHTML='';els.statsError.innerHTML=''; try{const r=await fetch('/api/research-viewer',{cache:'no-store'}); if(!r.ok)throw new Error(await r.text()); payload=await r.json(); const current=els.leagueSelect.value; els.leagueSelect.innerHTML=`<option value="ALL">${tr('allL')}</option>`+payload.active_leagues.map(x=>`<option value="${x}">${x}</option>`).join(''); els.leagueSelect.value=[...els.leagueSelect.options].some(o=>o.value===current)?current:'ALL'; renderMatches(); renderStats()}catch(e){const html=`<div class="error">${tr('loadError')}: ${e.message}</div>`; els.error.innerHTML=html; els.statsError.innerHTML=html}}
els.leagueSelect.addEventListener('change',renderMatches); els.statusSelect.addEventListener('change',renderMatches); els.refreshButton.addEventListener('click',load); els.langRu.addEventListener('click',()=>setLang('ru')); els.langEn.addEventListener('click',()=>setLang('en')); els.tabMatches.addEventListener('click',()=>switchTab('matches')); els.tabStats.addEventListener('click',()=>switchTab('stats'));
setLang('ru'); load(); setInterval(load,60000);
</script>
</body>
</html>
