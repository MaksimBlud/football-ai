name: Prospective Availability PR Validation

on:
  pull_request:
    paths:
      - "prospective_availability_*.py"
      - "tests/test_prospective_availability_*.py"
      - "docs/PROSPECTIVE_AVAILABILITY_SIGNAL_LAB_*.md"
      - "research/prospective_availability_signal_lab_v*.json"
      - "supabase/migrations/202609030002_prospective_availability.sql"
      - ".github/workflows/prospective-availability-*.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest pandas requests scikit-learn

      - name: Compile research contour
        run: |
          python -m py_compile \
            prospective_availability_contract.py \
            prospective_availability_provider.py \
            prospective_availability_snapshot.py \
            prospective_availability_persistence.py \
            prospective_availability_features.py \
            prospective_availability_collector.py \
            prospective_availability_evaluation.py \
            prospective_availability_research_cycle.py \
            tests/test_prospective_availability_contract.py \
            tests/test_prospective_availability_operational.py \
            tests/test_prospective_availability_evaluation.py

      - name: Run focused availability tests
        run: |
          python -m pytest -q \
            tests/test_prospective_availability_contract.py \
            tests/test_prospective_availability_operational.py \
            tests/test_prospective_availability_evaluation.py

      - name: Verify production model artifacts are untouched by this PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production .pkl change detected in prospective availability research PR"
            exit 1
          fi
