name: Prospective Availability PR Validation

on:
  pull_request:
    paths:
      - "prospective_availability_contract.py"
      - "tests/test_prospective_availability_contract.py"
      - "docs/PROSPECTIVE_AVAILABILITY_SIGNAL_LAB_PROTOCOL.md"
      - "docs/PROSPECTIVE_AVAILABILITY_SIGNAL_LAB_STATUS.md"
      - "research/prospective_availability_signal_lab_v1.json"
      - ".github/workflows/prospective-availability-pr-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest pandas

      - name: Compile contract
        run: python -m py_compile prospective_availability_contract.py tests/test_prospective_availability_contract.py

      - name: Run focused contract tests
        run: python -m pytest -q tests/test_prospective_availability_contract.py

      - name: Verify production model artifacts are untouched by this PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production .pkl change detected in prospective availability research PR"
            exit 1
          fi
