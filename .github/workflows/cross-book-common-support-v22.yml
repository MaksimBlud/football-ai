name: Cross Book Common Support V22
on:
  pull_request:
    paths:
      - 'cross_book_common_support_v22.py'
      - 'cross_league_structural_break_v19.py'
      - 'tests/test_cross_book_common_support_v22.py'
      - '.github/workflows/cross-book-common-support-v22.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn pytest
      - run: python -m pytest -q tests/test_cross_book_common_support_v22.py
      - run: python cross_book_common_support_v22.py --output /tmp/v22.json
      - name: Enforce no production artifact changes
        run: git diff --exit-code -- '*.pkl'
