name: Prospective Market Path Settlement Lag

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "prospective_market_path_settlement_lag.py"
      - "prospective_market_path_settlement_lag_cycle.py"
      - ".github/workflows/prospective-market-path-settlement-lag.yml"

permissions:
  contents: read

concurrency:
  group: prospective-market-path-settlement-lag-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy 'scikit-learn==1.7.2' supabase python-dotenv
      - name: Verify read credentials
        run: |
          python - <<'PY'
          import os
          missing=[name for name in ('SUPABASE_URL','SUPABASE_KEY') if not os.getenv(name)]
          if missing:
              raise SystemExit('Missing research read credentials: '+', '.join(missing))
          print('PASS: read credentials available; values not printed')
          PY
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run settlement-lag audit
        run: python prospective_market_path_settlement_lag_cycle.py
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload settlement-lag diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-market-path-settlement-lag-v1
          path: artifacts/prospective_market_path_v1/settlement_lag_*.csv
          retention-days: 90
      - name: Enforce settlement-lag health
        run: |
          python - <<'PY'
          import pandas as pd
          frame=pd.read_csv('artifacts/prospective_market_path_v1/settlement_lag_monitor.csv')
          late=frame[frame['status'].astype(str).eq('SETTLEMENT_LATE')]
          if len(late):
              cols=['league','event_id','home_team','away_team','kickoff_utc','grace_deadline_utc','reason']
              print('FAIL: prospective market-path settlement identities are late:')
              print(late[cols].to_string(index=False))
              raise SystemExit(1)
          print('PASS: no late prospective market-path settlement identities')
          PY
