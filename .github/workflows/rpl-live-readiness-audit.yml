name: RPL Live Readiness Audit

on:
  push:
    branches:
      - phase-rpl-live-readiness-audit

permissions:
  contents: read

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase python-dotenv

      - name: Check read-only audit secrets
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_URL", "SUPABASE_KEY", "THE_ODDS_API_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))
          print("PASS: audit secrets available; values not printed")
          PY

      - name: Compile audits
        run: |
          python -m py_compile audit_rpl_live_readiness.py rpl_snapshot_readiness.py
          python -m py_compile audit_rpl_odds_provider.py the_odds_service.py

      - name: Audit current Supabase RPL state
        run: python audit_rpl_live_readiness.py

      - name: Audit RPL Odds API provider
        run: python audit_rpl_odds_provider.py

      - name: Enforce research-only diff
        run: |
          if git diff --name-only c570d50ea83f3738e151f4e1649d030fc03470c0...HEAD | grep -E '\.pkl$'; then
            echo "Production artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
