name: RPL Results Bootstrap

on:
  push:
    branches:
      - phase-rpl-operational-complete

permissions:
  contents: read

jobs:
  bootstrap-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pandas numpy requests supabase python-dotenv
      - name: Compile RPL results stack
        run: python -m py_compile rpl_scores_service.py update_rpl_results.py evaluate_rpl_predictions.py
      - name: Persist current completed RPL scores
        run: python update_rpl_results.py --write
      - name: Evaluate current RPL ledger
        run: python evaluate_rpl_predictions.py
      - name: Verify durable result state
        run: |
          python - <<'PY'
          from database import supabase
          response = (
              supabase.table("league_finished_results")
              .select("*", count="exact")
              .eq("league", "RPL")
              .execute()
          )
          print("RPL finished results:", int(response.count or 0))
          for row in response.data or []:
              print(row)
          if int(response.count or 0) < 1:
              raise SystemExit("No durable RPL finished results after bootstrap")
          print("PASS: RPL finished-results persistence is live")
          PY
