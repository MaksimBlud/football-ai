name: Eredivisie Operational Bootstrap

on:
  push:
    branches:
      - phase-eredivisie-operational-complete

concurrency:
  group: eredivisie-operational-bootstrap
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required=("SUPABASE_URL","SUPABASE_KEY","THE_ODDS_API_KEY")
          missing=[x for x in required if not os.getenv(x)]
          if missing: raise SystemExit("Missing Eredivisie bootstrap secrets: "+", ".join(missing))
          print("PASS: required secrets available; values not printed")
          PY
      - name: Compile Eredivisie stack
        run: |
          python -m py_compile eredivisie_runtime_config.py save_eredivisie_odds_snapshot.py export_eredivisie_upcoming_matches.py generate_eredivisie_market_shadow.py persist_eredivisie_market_observations.py persist_eredivisie_prediction_ledger.py eredivisie_live_cycle.py scheduled_eredivisie_odds_snapshot.py eredivisie_scores_service.py update_eredivisie_results.py evaluate_eredivisie_predictions.py
      - name: Run Eredivisie focused tests
        run: python -m pytest -q tests/test_eredivisie_operational.py
      - name: Verify MARKET_ONLY safety
        run: |
          python - <<'PY'
          from eredivisie_runtime_config import EREDIVISIE_RUNTIME_CONFIG
          s=EREDIVISIE_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status=="CALIBRATION_REQUIRED"
          assert s.structural_alpha is None and s.edge_threshold is None
          print("PASS: Eredivisie remains MARKET_ONLY")
          PY
      - name: Write first live Eredivisie odds snapshot
        run: python save_eredivisie_odds_snapshot.py
      - name: Run first durable Eredivisie live cycle
        run: python eredivisie_live_cycle.py
      - name: Replay durable Eredivisie live cycle
        run: python eredivisie_live_cycle.py
      - name: Sync current Eredivisie finished results
        run: python update_eredivisie_results.py --write
      - name: Evaluate current Eredivisie ledger
        run: python evaluate_eredivisie_predictions.py
      - name: Audit durable Eredivisie state
        run: |
          python - <<'PY'
          from database import supabase
          for table in ("odds_snapshots","league_structural_v2_observations","league_prediction_ledger","league_finished_results"):
              r=supabase.table(table).select("*",count="exact").eq("league","EREDIVISIE").limit(3).execute()
              print(table,int(r.count or 0))
          PY
      - name: Enforce no production artifact changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
