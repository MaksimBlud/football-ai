name: Serie A Frozen V2 Shadow Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "serie_a_v2_frozen_shadow_preview.py"
      - "market_anchor_1x2_v2_shadow.py"
      - "market_anchor_1x2_v1.py"
      - "serie_a_v2_asof_feature_manifest.py"
      - "serie_a_v2_live_diagnostic_report.py"
      - "serie_a_v2_prequote_source_archive_gate.py"
      - "tests/test_serie_a_v2_prequote_source_archive_gate.py"
      - "serie_a_v2_forward_capture.py"
      - "tests/test_serie_a_v2_forward_capture.py"
      - "serie_a_v2_attest_real_source.py"
      - "tests/test_serie_a_v2_attest_real_source.py"
      - "tests/test_serie_a_v2_manual_quote_trigger_contract.py"
      - "tests/test_serie_a_v2_live_diagnostic_report.py"
      - "tests/test_serie_a_v2_asof_feature_manifest.py"
      - "tests/test_serie_a_v2_atalanta_alias.py"
      - "tests/test_serie_a_v2_frozen_shadow_preview.py"
      - "serie_a_v2_current_form_source_capture.py"
      - "serie_a_v2_current_form_forward_capture.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_current_form_source_workflow_contract.py"
      - "tests/test_serie_a_v2_current_form_forward_capture.py"
      - "experiments/market_anchor_1x2_v2_current_form_policy.json"
      - "research/SERIE_A_V2_CURRENT_FORM_FORWARD_ONLY_CONTRACT_20261018.md"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - "research/models/market_anchor_v2_serie_a_frozen_candidate.json"
      - ".github/workflows/serie-a-frozen-v2-shadow-tests.yml"

permissions:
  contents: read

jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline model-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy scikit-learn requests supabase
      - name: Run actual restored V2 weights against strict synthetic fixture inputs
        run: |
          python -m py_compile serie_a_v2_frozen_shadow_preview.py serie_a_v2_asof_feature_manifest.py serie_a_v2_live_diagnostic_report.py serie_a_v2_prequote_source_archive_gate.py serie_a_v2_forward_capture.py serie_a_v2_attest_real_source.py serie_a_v2_current_form_source_capture.py serie_a_v2_current_form_forward_capture.py market_anchor_1x2_v2_shadow.py market_anchor_1x2_v1.py
          python -m pytest -q tests/test_serie_a_v2_frozen_shadow_preview.py tests/test_serie_a_v2_asof_feature_manifest.py tests/test_serie_a_v2_atalanta_alias.py tests/test_serie_a_v2_live_diagnostic_report.py tests/test_serie_a_v2_prequote_source_archive_gate.py tests/test_serie_a_v2_forward_capture.py tests/test_serie_a_v2_manual_quote_trigger_contract.py tests/test_serie_a_v2_attest_real_source.py tests/test_serie_a_v2_current_form_source_capture.py tests/test_serie_a_v2_current_form_forward_capture.py tests/test_serie_a_v2_current_form_source_workflow_contract.py tests/test_historical_football_signal_lab.py
      - name: Verify no production model hashes changed
        run: |
          test -f research/models/market_anchor_v2_serie_a_frozen_candidate.json
          git diff --exit-code -- '*.pkl'
