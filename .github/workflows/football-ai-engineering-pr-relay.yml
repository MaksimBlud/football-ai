name: Football AI Safe PR Relay (No AI API)

# Draft PR handoff only: no model, no commits, no auto-merge.
# GitHub's GITHUB_TOKEN-created PRs might not trigger pull_request CI.
on:
  schedule:
    - cron: '43 * * * *'
  # Immediate, limited live proof after this workflow's safe main merge.
  push:
    branches: [main]
    paths:
      - 'engineering_pr_relay.py'
      - '.github/workflows/football-ai-engineering-pr-relay.yml'
      - 'tests/test_engineering_pr_relay.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/football-ai-engineering-pr-relay.yml'
      - 'engineering_pr_relay.py'
      - 'tests/test_engineering_pr_relay.py'

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: python -m py_compile engineering_pr_relay.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_engineering_pr_relay.py
      - name: Enforce never auto-merge
        run: |
          ! grep -q 'gh pr merge' engineering_pr_relay.py
          ! grep -Eq '^[[:space:]]*contents: write([[:space:]]|$)' .github/workflows/football-ai-engineering-pr-relay.yml

  relay:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: write  # Only relay job may dispatch the six existing validation workflows
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: football-ai-safe-pr-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check relay code and guards
        run: |
          python -m pip install -q pytest
          python -m py_compile engineering_pr_relay.py
          PYTHONPATH=. python -m pytest -q tests/test_engineering_pr_relay.py
      - name: Relay eligible recent agent commits into draft PRs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python engineering_pr_relay.py
      - name: Record relay limitations
        if: always()
        run: |
          echo "## Agent branch to draft PR relay" >> "$GITHUB_STEP_SUMMARY"
          echo "- No AI/model API calls or additional model quota." >> "$GITHUB_STEP_SUMMARY"
          echo "- Draft PR only; never auto-merge or deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "- GITHUB_TOKEN PR creation may be disabled by repository settings." >> "$GITHUB_STEP_SUMMARY"
          echo "- Six pinned workflow_dispatch CI requests may be sent; verify all check results." >> "$GITHUB_STEP_SUMMARY"
          echo "- CI must be verified at exact PR head before merge." >> "$GITHUB_STEP_SUMMARY"
