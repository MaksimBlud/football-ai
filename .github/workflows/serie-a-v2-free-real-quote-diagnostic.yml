name: Serie A V2 Free Real-Quote Diagnostic

on:
  workflow_dispatch:
  # Independent public CSV source observations. ZERO paid API calls.
  schedule:
    - cron: "13 6 * * *"
  push:
    branches: [main]
    paths:
      - "serie_a_v2_live_diagnostic_report.py"
      - "serie_a_v2_asof_feature_manifest.py"
      - "serie_a_v2_frozen_shadow_preview.py"
      - "tests/test_serie_a_v2_live_diagnostic_report.py"
      - "tests/test_serie_a_v2_atalanta_alias.py"
      - "serie_a_v2_prequote_source_archive_gate.py"
      - "tests/test_serie_a_v2_prequote_source_archive_gate.py"
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"

concurrency:
  group: serie-a-v2-free-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

env:
  MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED: "false"

jobs:
  free-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install read-only diagnostic dependencies
        run: python -m pip install pandas numpy scipy scikit-learn requests supabase python-dotenv pytest
      - name: Offline regression tests
        run: |
          python -m py_compile serie_a_v2_live_diagnostic_report.py serie_a_v2_prequote_source_archive_gate.py
          python -m pytest -q tests/test_serie_a_v2_live_diagnostic_report.py tests/test_serie_a_v2_asof_feature_manifest.py tests/test_serie_a_v2_atalanta_alias.py tests/test_serie_a_v2_frozen_shadow_preview.py tests/test_serie_a_v2_prequote_source_archive_gate.py
      - name: Verify source access, no paid credentials
        run: |
          python - <<'PY'
          from serie_a_v2_live_diagnostic_report import PUBLIC_BASE, PAID_PROVIDER_REQUESTS
          assert PUBLIC_BASE == "https://www.football-data.co.uk/mmz4281"
          assert PAID_PROVIDER_REQUESTS == 0
          print("PASS: public-only source; no paid provider key in workflow")
          PY
      - name: Verify private repository storage before live V2 access
        id: private-storage
        if: ${{ env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          if [[ "$private" == "true" ]]; then
            echo "is_private=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_private=false" >> "$GITHUB_OUTPUT"
            echo "::warning::V2 live access is held because this repository is public; no source or quote data will be accessed or uploaded"
          fi
      - name: Fetch and SHA-archive public source, preview original frozen V2 diagnostics
        if: ${{ env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' && steps.private-storage.outputs.is_private == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          python serie_a_v2_live_diagnostic_report.py \
            --output artifacts/serie_a_v2_real_quote_diagnostic.json \
            --raw-source-dir artifacts/serie_a_v2_source_capture
      - name: Archive diagnostic and exact public CSV bytes for provenance
        if: ${{ success() && env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' && steps.private-storage.outputs.is_private == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: serie-a-v2-free-real-quote-diagnostic
          path: |
            artifacts/serie_a_v2_real_quote_diagnostic.json
            artifacts/serie_a_v2_source_capture/
          if-no-files-found: warn
          retention-days: 90
