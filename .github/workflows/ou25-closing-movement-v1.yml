name: OU25 Closing Movement V1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ou25_closing_movement_v1.py'
      - 'tests/test_ou25_closing_movement_v1.py'
      - '.github/workflows/ou25-closing-movement-v1.yml'
      - 'research/OU25_CLOSING_MOVEMENT_V1.md'
      - 'cross_league_direct_markets_transport.py'
      - 'cross_league_direct_markets_v1.py'
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run focused regression tests
        run: pytest -q tests/test_ou25_closing_movement_v1.py
      - name: Run frozen closing-movement V1
        id: frozen_run
        continue-on-error: true
        run: |
          set -o pipefail
          python ou25_closing_movement_v1.py --output artifacts/ou25_closing_movement_v1/report.json 2>&1 | tee /tmp/ou25-closing-movement-v1.log
      - name: Assert frozen contract
        if: steps.frozen_run.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/ou25_closing_movement_v1/report.json'))
          assert r['experiment_id']=='OU25_CLOSING_MOVEMENT_V1'
          assert r['evidence_class']=='HISTORICAL_MARKET_TEMPORAL_OOT'
          assert r['research_only'] and not r['production_promotion'] and not r['betting_enabled']
          assert r['result']=='NO_BET' and not r['opened_2026_27_data_used']
          assert r['validation_season']=='2024-2025' and r['test_season']=='2025-2026'
          assert r['target']=='CLOSING_OU25_DEVIG_PROBABILITY'
          assert r['baseline']=='OPENING_OU25_DEVIG_PROBABILITY_NO_MOVEMENT'
          assert len(r['league_reports'])==3
          assert {x['league'] for x in r['league_reports']}=={'EPL','LA_LIGA','SERIE_A'}
          for x in r['league_reports']:
              assert x['coverage']['train']>0 and x['coverage']['validation']>0 and x['coverage']['test']>0
              assert x['replication_status'] in {'PASS','FAIL'}
              assert x['final_active_mode'] in {'MOVEMENT_MODEL','NO_MOVEMENT_FALLBACK'}
              if not x['validation_admissible']:
                  assert x['final_active_mode']=='NO_MOVEMENT_FALLBACK'
          p=r['pooled']
          assert p['league_count']==3 and p['n']>0
          assert p['decision'] in {'PILOT','SKIP'}
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload result or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ou25-closing-movement-v1
          path: |
            artifacts/ou25_closing_movement_v1/report.json
            /tmp/ou25-closing-movement-v1.log
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if frozen runner failed
        if: steps.frozen_run.outcome != 'success'
        run: exit 1
