name: Research V4 Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  workflow_run:
    workflows:
      - Prospective Market Path Settlement Lag
      - Product Operational Automation
      - All Leagues V1.1 Sample Health
      - Multi-Market Probe Rollover Status
      - Multi-Market V2 Readiness Status
    types: [completed]

permissions:
  contents: read

concurrency:
  group: research-v4-heartbeat
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Wake quota-waiting research issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label research-v4-waiting \
            --limit 100 \
            --json number \
            --jq '.[].number' > /tmp/issues

          while read -r issue; do
            [ -n "$issue" ] || continue

            WAIT_PATH="research/agent_runs/issue_${issue}/QUOTA_WAIT.json"
            WAIT_BRANCH="agent/v4-issue-${issue}"
            WAIT_JSON=$(gh api -X GET -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/$WAIT_PATH" -f ref="$WAIT_BRANCH" 2>/dev/null || true)
            NOT_BEFORE=$(printf '%s' "$WAIT_JSON" | jq -r '.not_before_epoch // 0' 2>/dev/null || echo 0)
            case "$NOT_BEFORE" in
              ''|*[!0-9]*) NOT_BEFORE=0 ;;
            esac
            NOW=$(date -u +%s)
            if [ "$NOT_BEFORE" -gt "$NOW" ]; then
              echo "quota wait: skip issue #$issue until epoch $NOT_BEFORE"
              continue
            fi

            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
              --add-label research-v4-queued \
              --remove-label research-v4-waiting >/dev/null

            if gh workflow run research-orchestrator-v4.yml \
              --repo "$GITHUB_REPOSITORY" \
              -f issue_number="$issue" \
              -f source=schedule; then
              echo "redispatched issue #$issue"
            else
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
                --add-label research-v4-waiting \
                --remove-label research-v4-queued >/dev/null 2>&1 || true
              exit 1
            fi
          done < /tmp/issues
