name: Research PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: research-pr-validation-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas requests supabase python-dotenv

      - name: Compile research modules
        run: |
          python -m py_compile league_runtime_config.py
          python -m py_compile evaluate_league_predictions.py
          python -m py_compile build_league_calibration_dataset.py
          python -m py_compile report_league_calibration_coverage.py
          python -m py_compile audit_league_canonical_data_quality.py
          python -m py_compile report_multi_league_health.py
          python -m py_compile historical_strategy_lab.py
          python -m py_compile historical_strategy_runner.py
          python -m py_compile historical_strategy_stability.py
          python -m py_compile historical_strategy_walk_forward.py
          python -m py_compile historical_strategy_frozen_validation.py
          python -m py_compile historical_frozen_uncertainty.py
          python -m py_compile historical_frozen_market_expectation.py
          python -m py_compile historical_frozen_selection_null.py
          python -m py_compile historical_frozen_team_concentration.py
          python -m py_compile historical_frozen_team_season_stress.py
          python -m py_compile historical_market_timing_audit.py
          python -m py_compile historical_frozen_closing_comparison.py
          python -m py_compile historical_cross_bookmaker_validation.py
          python -m py_compile historical_paired_bookmaker_validation.py
          python -m py_compile scheduled_epl_live_cycle.py
          python -m py_compile scheduled_la_liga_live_cycle.py
          python -m py_compile normalize_la_liga_history.py
          python -m py_compile persist_la_liga_prediction_ledger.py
          python -m py_compile persist_la_liga_finished_results.py
          python -m py_compile rpl_source_contract.py
          python -m py_compile export_rpl_upcoming_matches.py
          python -m py_compile generate_rpl_market_shadow.py
          python -m py_compile rpl_snapshot_readiness.py
          python -m py_compile persist_rpl_market_observations.py
          python -m py_compile persist_rpl_prediction_ledger.py
          python -m py_compile save_rpl_odds_snapshot.py
          python -m py_compile rpl_live_cycle.py
          python -m py_compile rpl_scores_service.py
          python -m py_compile scheduled_rpl_odds_snapshot.py
          python -m py_compile update_rpl_results.py
          python -m py_compile evaluate_rpl_predictions.py

      - name: Run historical strategy lab tests
        run: |
          python -m pytest -q tests/test_historical_strategy_lab.py tests/test_historical_strategy_runner.py
          python -m pytest -q tests/test_historical_strategy_stability.py
          python -m pytest -q tests/test_historical_strategy_walk_forward.py
          python -m pytest -q tests/test_historical_strategy_frozen_validation.py
          python -m pytest -q tests/test_historical_frozen_uncertainty.py
          python -m pytest -q tests/test_historical_frozen_market_expectation.py
          python -m pytest -q tests/test_historical_frozen_selection_null.py
          python -m pytest -q tests/test_historical_frozen_team_concentration.py
          python -m pytest -q tests/test_historical_frozen_team_season_stress.py
          python -m pytest -q tests/test_historical_market_timing_audit.py
          python -m pytest -q tests/test_historical_frozen_closing_comparison.py
          python -m pytest -q tests/test_historical_cross_bookmaker_validation.py
          python -m pytest -q tests/test_historical_paired_bookmaker_validation.py
          python -m pytest -q tests/test_la_liga_market_candidate_spec.py

      - name: Run canonical evaluator tests
        run: |
          python -m pytest -q tests/test_evaluate_league_predictions.py
          python -m pytest -q tests/test_multi_league_evaluator_safety.py

      - name: Run canonical data quality audit tests
        run: python -m pytest -q tests/test_audit_league_canonical_data_quality.py

      - name: Run calibration coverage report tests
        run: python -m pytest -q tests/test_report_league_calibration_coverage.py

      - name: Run multi-league health report tests
        run: python -m pytest -q tests/test_report_multi_league_health.py

      - name: Run operational schedule grid tests
        run: python -m pytest -q tests/test_operational_workflow_schedule_grid.py

      - name: Run EPL live-cycle safety tests
        run: |
          python -m pytest -q tests/test_epl_live_cycle.py
          python -m pytest -q tests/test_scheduled_epl_live_cycle.py

      - name: Run La Liga scheduled collection tests
        run: python -m pytest -q tests/test_scheduled_la_liga_live_cycle.py tests/test_la_liga_live_workflow.py

      - name: Run La Liga canonical alias tests
        run: python -m pytest -q tests/test_normalize_la_liga_history.py

      - name: Run La Liga canonical state tests
        run: |
          python -m pytest -q tests/test_league_prediction_ledger.py
          python -m pytest -q tests/test_persist_la_liga_prediction_ledger.py
          python -m pytest -q tests/test_persist_la_liga_finished_results.py

      - name: Run EPL odds workflow contract tests
        run: python -m pytest -q tests/test_epl_odds_workflow_contract.py

      - name: Run calibration dataset tests
        run: python -m pytest -q tests/test_build_league_calibration_dataset.py

      - name: Run RPL runtime configuration tests
        run: python -m pytest -q tests/test_rpl_runtime_config.py

      - name: Run RPL market-only live foundation tests
        run: python -m pytest -q tests/test_rpl_market_only_live.py

      - name: Run RPL durable market tests
        run: python -m pytest -q tests/test_rpl_durable_market.py

      - name: Run RPL snapshot collector tests
        run: python -m pytest -q tests/test_rpl_odds_snapshot.py

      - name: Run RPL operational cycle tests
        run: python -m pytest -q tests/test_rpl_operational_cycle.py

      - name: Run RPL results contract tests
        run: python -m pytest -q tests/test_rpl_results_persistence_contract.py

      - name: Run RPL live-cycle source contract tests
        run: python -m pytest -q tests/test_rpl_live_cycle_source_contract.py

      - name: Run RPL workflow contract tests
        run: python -m pytest -q tests/test_rpl_workflow_contract.py

      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
