name: Free Corners Signal Screen V1

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'free_corners_signal_screen_v1.py'
      - 'tests/test_free_corners_signal_screen_v1.py'
      - 'research/FREE_CORNERS_SIGNAL_SCREEN_V1.md'
      - '.github/workflows/free-corners-signal-screen-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  offline-contract-tests:
    if: github.event.action != 'edited' || contains(github.event.pull_request.body || '', '[run-free-corners-screen]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2 pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Compile free screen
        run: python -m py_compile free_corners_signal_screen_v1.py
      - name: Run regression tests
        run: pytest -q tests/test_free_corners_signal_screen_v1.py
      - name: Assert frozen constants
        run: |
          python - <<'PY'
          import free_corners_signal_screen_v1 as s
          assert s.EXPERIMENT_ID == 'FREE_CORNERS_SIGNAL_SCREEN_V1'
          assert len(s.LEAGUES) == 5
          assert s.FIXTURES_PER_LEAGUE == 11
          assert s.MAX_PROVIDER_REQUESTS == 60
          assert s.MIN_POOLED_ROWS == 40
          assert s.BLEND_WEIGHT_FOOTBALL == 0.25
          assert s.REQUEST_INTERVAL_SECONDS >= 3.0
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  live-free-screen:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', '[run-free-corners-screen]')
    needs: offline-contract-tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2
      - name: Require free API key without printing it
        run: test -n "$FIVE_DOLLAR_FOOTBALL_API_KEY"
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Reuse immutable 15-match source-pilot market cache
        run: |
          mkdir -p /tmp/five-dollar-pilot
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10503575942/zip > /tmp/five-dollar-pilot.zip
          unzip -q /tmp/five-dollar-pilot.zip -d /tmp/five-dollar-pilot
          CACHE=$(find /tmp/five-dollar-pilot -name bet365_corner_opening_closing.jsonl -type f | head -n 1)
          test -n "$CACHE"
          echo "CACHE_PATH=$CACHE" >> "$GITHUB_ENV"
          echo "Reusing prior source-pilot cache; API key and cached prices are not printed"
      - name: Run frozen free-only OOT screen
        run: |
          python free_corners_signal_screen_v1.py \
            --cached-market-jsonl "$CACHE_PATH" \
            --output-dir artifacts/free_corners_signal_screen_v1 \
            > /tmp/free-corners-screen.log
      - name: Assert free-only result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/free_corners_signal_screen_v1/report.json').read_text())
          assert r['experiment_id']=='FREE_CORNERS_SIGNAL_SCREEN_V1'
          assert r['research_only'] is True
          assert r['betting_enabled'] is False
          assert r['paid_subscription_used'] is False
          assert r['provider_requests'] <= 60
          assert r['provider_request_budget'] == 60
          assert r['selected_fixtures'] == 55
          assert r['pooled']['verdict'] in {'STRONG_SIGNAL_SCREEN','INDICATIVE_SIGNAL_SCREEN','NO_CLEAR_SIGNAL_SCREEN','SAMPLE_TOO_SMALL'}
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload free screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-corners-signal-screen-v1
          path: |
            artifacts/free_corners_signal_screen_v1
            /tmp/free-corners-screen.log
          if-no-files-found: warn
          retention-days: 90
