name: Serie A PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  serie-a-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: serie-a-pr-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas requests supabase python-dotenv
      - name: Compile Serie A operational modules
        run: |
          python -m py_compile serie_a_runtime_config.py
          python -m py_compile save_serie_a_odds_snapshot.py
          python -m py_compile export_serie_a_upcoming_matches.py
          python -m py_compile generate_serie_a_market_shadow.py
          python -m py_compile persist_serie_a_market_observations.py
          python -m py_compile persist_serie_a_prediction_ledger.py
          python -m py_compile serie_a_live_cycle.py
          python -m py_compile scheduled_serie_a_odds_snapshot.py
          python -m py_compile serie_a_scores_service.py
          python -m py_compile update_serie_a_results.py
          python -m py_compile evaluate_serie_a_predictions.py
      - name: Run Serie A operational tests
        run: python -m pytest -q tests/test_serie_a_operational.py
      - name: Run shared prediction-ledger tests
        run: python -m pytest -q tests/test_league_prediction_ledger.py tests/test_evaluate_league_predictions.py
      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in Serie A PR"
