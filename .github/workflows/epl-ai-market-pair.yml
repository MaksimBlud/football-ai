name: EPL AI Market Pair Prospective

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [main]
    paths:
      - "epl_ai_market_pair_collector.py"
      - "epl_ai_market_pair_cycle.py"
      - "research/epl_ai_market_pair_v1.json"
      - ".github/workflows/epl-ai-market-pair.yml"

permissions:
  contents: read

concurrency:
  group: epl-ai-market-pair-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check required credentials
        run: |
          python - <<'PY'
          import os
          missing=[name for name in ("SUPABASE_URL","SUPABASE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing research credentials: "+", ".join(missing))
          print("PASS: research credentials available; values not printed")
          PY
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before
      - name: Run outcome-free point-in-time collector
        run: python epl_ai_market_pair_cycle.py
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after
          diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload research-only audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-ai-market-pair-v1-${{ github.run_id }}
          path: artifacts/epl_ai_market_pair_v1/
          if-no-files-found: warn
          retention-days: 90
