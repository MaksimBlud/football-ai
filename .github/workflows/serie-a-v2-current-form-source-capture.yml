name: Serie A V2 Current-Form Source Capture

on:
  workflow_dispatch:
  schedule:
    - cron: "50 5 * * *"
  push:
    branches: [main]
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "market_anchor_1x2_v2_shadow.py"
      - "market_anchor_v2_direct_access.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "research/source_rights/football_data_co_uk.json"
      - "experiments/market_anchor_1x2_v2_protocol.json"
      - "experiments/market_anchor_1x2_v2_current_form_policy.json"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"

concurrency:
  group: serie-a-v2-current-form-source-capture
  cancel-in-progress: false

permissions:
  contents: read

env:
  MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED: "false"

jobs:
  capture-current-form:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install read-only V2 source dependencies
        run: python -m pip install pandas numpy scipy scikit-learn requests supabase python-dotenv pytest
      - name: Validate feature-input gate and source integrity rules
        run: |
          python -m py_compile market_anchor_v2_direct_access.py market_anchor_v2_source_capture_rights.py market_anchor_v2_artifact_privacy.py serie_a_v2_current_form_source_capture.py
          python -m pytest -q tests/test_serie_a_v2_current_form_source_capture.py tests/test_serie_a_v2_asof_feature_manifest.py tests/test_serie_a_v2_atalanta_alias.py
      - name: Verify private repository storage before live V2 access
        id: private-storage
        if: ${{ env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          if [[ "$private" == "true" ]]; then
            echo "is_private=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_private=false" >> "$GITHUB_OUTPUT"
            echo "::warning::V2 live access is held because this repository is public; no source or quote data will be accessed or uploaded"
          fi
      - name: Capture frozen historical seasons plus gated current-form source
        if: ${{ env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' && steps.private-storage.outputs.is_private == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          python serie_a_v2_current_form_source_capture.py \
            --output-dir artifacts/serie_a_v2_current_form_source_capture
      - name: Archive source bytes and gate manifest for future quotes only
        if: ${{ success() && env.MARKET_ANCHOR_V2_LIVE_ACCESS_ALLOWED == 'true' && steps.private-storage.outputs.is_private == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: serie-a-v2-current-form-source-capture
          path: artifacts/serie_a_v2_current_form_source_capture/
          if-no-files-found: warn
          retention-days: 90
