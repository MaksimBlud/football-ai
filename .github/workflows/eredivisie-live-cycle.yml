name: Eredivisie Live Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "58 */2 * * *"

concurrency:
  group: eredivisie-live-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("SUPABASE_URL", "SUPABASE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Eredivisie live-cycle secrets: " + ", ".join(missing))
          print("PASS: Eredivisie live-cycle secrets available; values not printed")
          PY
      - name: Verify Eredivisie MARKET_ONLY safety
        run: |
          python - <<'PY'
          from eredivisie_runtime_config import EREDIVISIE_RUNTIME_CONFIG
          s = EREDIVISIE_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: Eredivisie remains MARKET_ONLY")
          PY
      - name: Run durable Eredivisie live cycle
        run: python eredivisie_live_cycle.py
