name: Point-in-Time Cross-League Replay V1

on:
  pull_request:
    paths:
      - 'point_in_time_cross_league_replay_v1.py'
      - 'point_in_time_cross_league_replay_v1_freeze_guard.py'
      - 'tests/test_point_in_time_cross_league_replay_v1.py'
      - 'tests/test_point_in_time_cross_league_replay_v1_freeze_guard.py'
      - 'research/POINT_IN_TIME_CROSS_LEAGUE_REPLAY_V1.md'
      - 'experiments/point_in_time_cross_league_replay_v1_predictions.json'
      - '.github/workflows/point-in-time-cross-league-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-blind-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile and run replay regression tests
        run: |
          python -m py_compile point_in_time_cross_league_replay_v1.py point_in_time_cross_league_replay_v1_freeze_guard.py
          python -m pytest -q \
            tests/test_point_in_time_cross_league_replay_v1.py \
            tests/test_point_in_time_cross_league_replay_v1_freeze_guard.py
          python point_in_time_cross_league_replay_v1_freeze_guard.py
      - name: Reconstruct exact frozen 47-event AI replay
        run: |
          python point_in_time_cross_league_replay_v1.py \
            --output artifacts/point_in_time_cross_league_replay_v1.csv \
            --manifest artifacts/point_in_time_cross_league_replay_v1_manifest.json
      - name: Verify replay is byte-for-byte frozen
        run: |
          python point_in_time_cross_league_replay_v1_freeze_guard.py \
            --csv artifacts/point_in_time_cross_league_replay_v1.csv \
            --manifest artifacts/point_in_time_cross_league_replay_v1_manifest.json
      - name: Production artifacts unchanged
        run: |
          git diff --exit-code -- '*.pkl'
          test -z "$(git status --porcelain -- '*.pkl')"
      - name: Upload outcome-blind replay proof
        uses: actions/upload-artifact@v4
        with:
          name: point-in-time-cross-league-replay-v1
          path: |
            artifacts/point_in_time_cross_league_replay_v1.csv
            artifacts/point_in_time_cross_league_replay_v1_manifest.json
          if-no-files-found: error
