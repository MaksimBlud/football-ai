name: Research Agent V3 Gemini Free

on:
  push:
    branches: [feature/research-agent-v3-gemini-free]
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - '.github/workflows/research-agent-v3-gemini.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_gemini: ${{ steps.eligibility.outputs.run_gemini }}
    steps:
      - id: eligibility
        run: echo 'run_gemini=false' >> "$GITHUB_OUTPUT"

  gemini-research:
    needs: preflight
    if: needs.preflight.outputs.run_gemini == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      PYTHONPATH: .
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify Gemini API key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'GEMINI_API_KEY is missing. Add it under Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/gemini-pkl-before || true
      - name: Run sandboxed Gemini edit pass
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 30
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "list_directory",
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            Read AGENTS.md and GEMINI.md first and obey both.

            Work only on GitHub Issue #${{ github.event.issue.number }}.
            The deterministic intake decision is READY_FOR_PREREGISTRATION.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            You have no shell, GitHub, web, Supabase, deployment, or paid-API tool access.
            You may edit only these issue-specific paths:
            - research/agent_runs/issue_${{ github.event.issue.number }}/
            - tests/agent_runs/issue_${{ github.event.issue.number }}/
            - docs/agent_runs/issue_${{ github.event.issue.number }}/

            Create a frozen preregistration first. Then implement only zero-cost historical/read-only
            research possible from data and helpers already present in this repository.
            Do not edit any file outside the three issue-specific directories.
            If the full evaluation cannot be completed safely, document the blocker instead.
      - name: Capture Gemini changes
        id: changed
        run: |
          git status --porcelain=v1 --untracked-files=all > /tmp/gemini-status
          cat /tmp/gemini-status
          if [ -s /tmp/gemini-status ]; then
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate issue sandbox
        if: steps.changed.outputs.has_changes == 'true'
        run: python research_agent_gemini.py validate-status --issue-number "$ISSUE_NUMBER" --status-file /tmp/gemini-status
      - name: Install zero-cost research test dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: pip install pytest pandas numpy requests scikit-learn xgboost joblib
      - name: Syntax-check generated Python without bytecode artifacts
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          issue = os.environ['ISSUE_NUMBER']
          roots = [
              Path('research/agent_runs') / f'issue_{issue}',
              Path('tests/agent_runs') / f'issue_{issue}',
          ]
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.rglob('*.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
                  print(f'PASS syntax: {path}')
          PY
      - name: Run generated focused tests
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          if [ -d "tests/agent_runs/issue_${ISSUE_NUMBER}" ]; then
            PYTHONDONTWRITEBYTECODE=1 pytest -q -p no:cacheprovider "tests/agent_runs/issue_${ISSUE_NUMBER}"
          fi
      - name: Revalidate final working tree
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git status --porcelain=v1 --untracked-files=all > /tmp/gemini-status-final
          python research_agent_gemini.py validate-status --issue-number "$ISSUE_NUMBER" --status-file /tmp/gemini-status-final
          git diff --check
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/gemini-pkl-after || true
          diff -u /tmp/gemini-pkl-before /tmp/gemini-pkl-after
      - name: Report no-change completion
        if: steps.changed.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body 'Gemini Research Agent V3 completed safely but produced no repository changes.'
      - name: Create validated research branch
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          BRANCH="agent/gemini-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"
          python research_agent_gemini.py stage-status --issue-number "$ISSUE_NUMBER" --status-file /tmp/gemini-status-final
          git config user.name 'football-ai-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Research agent: issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
      - name: Open research pull request
        if: steps.changed.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Automated zero-cost research implementation for Issue #${ISSUE_NUMBER}." \
            "" \
            "Safety properties:" \
            "- deterministic READY_FOR_PREREGISTRATION gate" \
            "- issue-specific file sandbox" \
            "- no production .pkl changes" \
            "- no Supabase writes" \
            "- no paid Odds API requests" \
            "- no automatic merge or production promotion" \
            "" \
            "Note: PR checks created by GITHUB_TOKEN may require repository-owner approval in GitHub." \
            > /tmp/pr-body.md
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Research Agent: ${ISSUE_TITLE}" --body-file /tmp/pr-body.md)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
      - name: Link pull request from issue
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Gemini Research Agent V3 created a validated research PR: $PR_URL"
