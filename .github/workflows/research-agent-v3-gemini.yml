name: Research Agent V3 Gemini Free

on:
  push:
    branches: [feature/research-agent-v3-gemini-free]
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - 'research_agent_gemini.py'
      - 'GEMINI.md'
      - 'tests/test_research_agent_gemini.py'
      - 'tests/test_research_agent_gemini_workflow.py'
      - 'docs/RESEARCH_AGENT_V3_GEMINI_FREE.md'
      - '.github/workflows/research-agent-v3-gemini.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo V3_PREFLIGHT_PARSER_OK
