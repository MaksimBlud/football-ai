name: EPL Odds Snapshots

on:
  workflow_dispatch:

  schedule:
    # Проверяем каждые 4 часа.
    # Сам Python-скрипт решает, нужен ли API-запрос.
    - cron: "17 */4 * * *"

permissions:
  contents: read

jobs:
  collect-odds:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install snapshot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase python-dotenv

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "THE_ODDS_API_KEY",
              "SUPABASE_URL",
              "SUPABASE_KEY",
          ]

          missing = [
              name
              for name in required
              if not os.getenv(name)
          ]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: "
                  + ", ".join(missing)
              )

          print("Все необходимые secrets доступны.")
          print("Значения secrets НЕ выводились.")
          PY

      - name: Run smart odds scheduler
        run: python scheduled_odds_snapshot.py
