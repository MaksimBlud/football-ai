name: Historical Closing Comparison PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - historical_frozen_closing_comparison.py
      - tests/test_historical_frozen_closing_comparison.py
      - .github/workflows/historical-strategy-lab.yml
      - .github/workflows/historical-closing-pr-validation.yml

permissions:
  contents: read

jobs:
  comparison-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas
      - run: python -m py_compile historical_frozen_closing_comparison.py
      - run: python -m pytest -q tests/test_historical_frozen_closing_comparison.py
      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then exit 1; fi
          echo "PASS: no .pkl changes in PR"
