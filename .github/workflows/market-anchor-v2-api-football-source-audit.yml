name: MARKET_ANCHOR V2 API-Football Source Audit

on:
  pull_request:
    paths:
      - "research/SERIE_A_V2_API_FOOTBALL_SOURCE_AUDIT_20261119.md"
      - "research/source_rights/api_football.json"
      - "tests/test_serie_a_v2_api_football_source_audit.py"
      - ".github/workflows/market-anchor-v2-api-football-source-audit.yml"
  push:
    branches:
      - research/v2-api-football-source-rights-audit-20261119-run11
    paths:
      - "research/SERIE_A_V2_API_FOOTBALL_SOURCE_AUDIT_20261119.md"
      - "research/source_rights/api_football.json"
      - "tests/test_serie_a_v2_api_football_source_audit.py"
      - ".github/workflows/market-anchor-v2-api-football-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run offline rights and safety contract tests
        run: python -m pytest -q tests/test_serie_a_v2_api_football_source_audit.py
