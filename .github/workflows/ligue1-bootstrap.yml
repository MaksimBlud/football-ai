name: Ligue 1 Operational Bootstrap
on:
  push:
    branches: [phase-ligue1-operational-complete]
concurrency:
  group: ligue1-operational-bootstrap
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pytest numpy pandas requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          missing=[x for x in ("SUPABASE_URL","SUPABASE_KEY","THE_ODDS_API_KEY") if not os.getenv(x)]
          if missing: raise SystemExit("Missing Ligue 1 bootstrap secrets: "+", ".join(missing))
          print("PASS: required secrets available; values not printed")
          PY
      - name: Compile and test Ligue 1 stack
        run: |
          python -m py_compile ligue1_runtime_config.py save_ligue1_odds_snapshot.py export_ligue1_upcoming_matches.py generate_ligue1_market_shadow.py persist_ligue1_market_observations.py persist_ligue1_prediction_ledger.py ligue1_live_cycle.py scheduled_ligue1_odds_snapshot.py ligue1_scores_service.py update_ligue1_results.py evaluate_ligue1_predictions.py
          python -m pytest -q tests/test_ligue1_operational.py
      - name: Verify MARKET_ONLY safety
        run: |
          python - <<'PY'
          from ligue1_runtime_config import LIGUE1_RUNTIME_CONFIG
          s=LIGUE1_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status=="CALIBRATION_REQUIRED"
          assert s.structural_alpha is None and s.edge_threshold is None
          print("PASS: Ligue 1 remains MARKET_ONLY")
          PY
      - name: Write first live Ligue 1 odds snapshot
        run: python save_ligue1_odds_snapshot.py
      - name: Run first durable Ligue 1 live cycle
        run: python ligue1_live_cycle.py
      - name: Replay durable Ligue 1 live cycle
        run: python ligue1_live_cycle.py
      - name: Sync current Ligue 1 finished results
        run: python update_ligue1_results.py --write
      - name: Evaluate current Ligue 1 ledger
        run: python evaluate_ligue1_predictions.py
      - name: Audit durable Ligue 1 state
        run: |
          python - <<'PY'
          from database import supabase
          for table in ("odds_snapshots","league_structural_v2_observations","league_prediction_ledger","league_finished_results"):
              r=supabase.table(table).select("*",count="exact").eq("league","LIGUE_1").limit(3).execute()
              print(table,int(r.count or 0))
          PY
      - name: Enforce no production artifact changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
