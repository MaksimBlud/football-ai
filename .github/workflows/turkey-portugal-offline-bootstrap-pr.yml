name: Turkey Portugal Offline Bootstrap PR Validation

on:
  pull_request:
    paths:
      - 'league_offline_history.py'
      - 'football_data_history_source.py'
      - 'build_configured_offline_foundation.py'
      - 'bootstrap_turkey_portugal_offline.py'
      - 'tests/test_turkey_portugal_offline_bootstrap.py'
      - '.github/workflows/turkey-portugal-offline-bootstrap-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pytest requests
      - name: Compile offline bootstrap modules
        run: |
          python -m py_compile league_offline_history.py
          python -m py_compile football_data_history_source.py
          python -m py_compile build_configured_offline_foundation.py
          python -m py_compile bootstrap_turkey_portugal_offline.py
          python -m py_compile tests/test_turkey_portugal_offline_bootstrap.py
      - name: Run offline bootstrap tests
        run: pytest -q tests/test_turkey_portugal_offline_bootstrap.py test_league_offline_history_completeness.py
      - name: Guard production model artifacts
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$' && exit 1 || true
