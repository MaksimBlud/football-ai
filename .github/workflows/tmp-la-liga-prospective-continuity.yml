name: Temporary La Liga Prospective Continuity Append

on:
  push:
    branches:
      - docs/la-liga-prospective-20260915-continuity
    paths:
      - ".github/workflows/tmp-la-liga-prospective-continuity.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/la-liga-prospective-20260915-continuity
          fetch-depth: 0
      - name: Append frozen prospective checkpoint
        shell: bash
        env:
          APPENDIX_B64: ""
        run: |
          set -euo pipefail
          marker='LA_LIGA_MARKET_ANCHOR_PROSPECTIVE_20260915_V1'
          if grep -Fq "$marker" PROJECT_CONTINUITY.md; then
            echo 'marker already exists; refusing duplicate append'
            exit 1
          fi
          printf '%s' "$APPENDIX_B64" | base64 -d >> PROJECT_CONTINUITY.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_CONTINUITY.md
          git commit -m 'Record La Liga prospective freeze continuity'
          git push origin HEAD:refs/heads/docs/la-liga-prospective-20260915-continuity
