name: Multi-League Observation Ledger Parity

on:
  pull_request:
    paths:
      - 'audit_multi_league_observation_ledger_parity.py'
      - 'tests/test_multi_league_observation_ledger_parity.py'
      - '.github/workflows/multi-league-observation-ledger-parity.yml'
  push:
    branches: [main]
    paths:
      - 'audit_multi_league_observation_ledger_parity.py'
      - 'tests/test_multi_league_observation_ledger_parity.py'
      - '.github/workflows/multi-league-observation-ledger-parity.yml'
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: multi-league-parity-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pytest pandas requests supabase python-dotenv
      - name: Compile parity audit
        run: python -m py_compile audit_multi_league_observation_ledger_parity.py
      - name: Run parity audit tests
        run: PYTHONPATH=. pytest -q tests/test_multi_league_observation_ledger_parity.py
      - name: Guard production model artifacts
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"

  live-read-only-audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pandas requests supabase python-dotenv
      - name: Check required Supabase secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("SUPABASE_URL", "SUPABASE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing required secrets: " + ", ".join(missing))
          print("PASS: required Supabase secrets configured; values not printed")
          PY
      - name: Run live read-only parity audit
        run: python audit_multi_league_observation_ledger_parity.py
