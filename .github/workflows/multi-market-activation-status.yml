name: Multi-Market V2 Readiness Status

on:
  schedule:
    - cron: '12 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'multi_market_activation_status.py'
      - 'test_multi_market_activation_status.py'
      - 'test_multi_market_readiness_workflow.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_collector.py'
      - 'multi_market_odds.py'
      - 'multi_market_policy.py'
      - 'multi_market_sampling_plan.py'
      - 'test_multi_market_sampling_plan.py'
      - 'multi_market_corner_capability_probe.py'
      - 'test_multi_market_corner_capability_probe.py'
      - 'multi_market_provider_capability_attestation.py'
      - 'test_multi_market_provider_capability_attestation.py'
      - 'test_multi_market_capability_attestation_readiness.py'
      - 'research/multi_market_provider_corner_capability_attestation.json'
      - '.github/workflows/multi-market-corner-capability-probe.yml'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-activation-status.yml'
  push:
    branches: [main]
    paths:
      - 'multi_market_activation_status.py'
      - 'test_multi_market_activation_status.py'
      - 'test_multi_market_readiness_workflow.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_collector.py'
      - 'multi_market_odds.py'
      - 'multi_market_policy.py'
      - 'multi_market_sampling_plan.py'
      - 'test_multi_market_sampling_plan.py'
      - 'multi_market_corner_capability_probe.py'
      - 'test_multi_market_corner_capability_probe.py'
      - 'multi_market_provider_capability_attestation.py'
      - 'test_multi_market_provider_capability_attestation.py'
      - 'test_multi_market_capability_attestation_readiness.py'
      - 'research/multi_market_provider_corner_capability_attestation.json'
      - '.github/workflows/multi-market-corner-capability-probe.yml'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-activation-status.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Compile readiness modules
        run: >-
          python -m py_compile multi_market_activation_status.py
          multi_market_schema_probe.py multi_market_sampling_plan.py
          multi_market_provider_capability_attestation.py
      - name: Run mocked readiness tests
        run: >-
          pytest -q test_multi_market_activation_status.py
          test_multi_market_readiness_workflow.py
          test_multi_market_schema_probe.py test_multi_market_sampling_plan.py
          test_multi_market_provider_capability_attestation.py
          test_multi_market_capability_attestation_readiness.py
      - name: Guard production model artifacts
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  live-read-only-status:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Check exact schema, zero-cost quota, and reviewed/stored provider capability
        run: python multi_market_activation_status.py
      - name: Build zero-cost reserve-preserving sampling plan
        run: python multi_market_sampling_plan.py
      - name: Verify zero-cost/read-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/multi_market_activation_status.json').read_text())
          plan=json.loads(Path('artifacts/multi_market_sampling_plan.json').read_text())
          assert p['schema_version']=='MULTI_MARKET_V2_READINESS_STATUS_V1'
          assert p['research_only'] is True
          assert p['read_only'] is True
          assert p['writes_performed'] is False
          assert p['paid_provider_requests']==0
          assert p['paid_provider_credits']==0
          assert p['prospective_oos_evaluation_active'] is False
          stored=p['provider_corner_capability']
          att=p['provider_corner_capability_attestation']
          sources=p['provider_corner_capability_sources']
          assert stored['read_only'] is True
          assert int(stored['page_size']) > 0
          assert int(stored['pages_inspected']) >= 0
          assert int(stored['rows_inspected']) >= 0
          assert isinstance(stored['scan_complete'], bool)
          if stored['rows_inspected'] > 0:
              assert stored['pages_inspected'] >= 1
          assert att['read_only'] is True
          assert sources['stored_snapshot_evidence'] == stored['capability_ready']
          assert sources['reviewed_attestation'] == bool(att['valid'] and att['capability_ready'])
          assert p['provider_corner_capability_ready'] == any(sources.values())
          assert p['collection_ready'] == (
              p['infrastructure_collection_ready'] and p['provider_corner_capability_ready']
          )
          assert p['activation_ready'] == p['collection_ready']
          if p['infrastructure_collection_ready'] and not p['provider_corner_capability_ready']:
              assert 'PROVIDER_CORNER_CAPABILITY_UNPROVEN' in p['blockers']
          assert plan['schema_version']=='MULTI_MARKET_SAMPLING_PLAN_V1'
          assert plan['research_only'] is True
          assert plan['read_only'] is True
          assert plan['writes_performed'] is False
          assert plan['paid_provider_requests']==0
          assert plan['paid_provider_credits']==0
          assert plan['hard_reserve_preserved'] is True
          assert int(plan['remaining_credits']) == int(p['quota']['remaining'])
          print('status=',p['status'])
          print('quota_ready=',p['quota_ready'])
          print('infrastructure_collection_ready=',p['infrastructure_collection_ready'])
          print('provider_corner_capability_ready=',p['provider_corner_capability_ready'])
          print('provider_corner_capability_sources=',sources)
          print('provider_corner_capability_attestation=',att)
          print('collection_ready=',p['collection_ready'])
          print('planned_events=',plan['planned_events'])
          print('planned_credits_worst_case=',plan['planned_credits_worst_case'])
          print('worst_case_remaining_credits=',plan['worst_case_remaining_credits'])
          print('blockers=',p['blockers'])
          PY
      - name: Verify production model unchanged
        if: always()
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload readiness status and sampling plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-v2-readiness-status
          path: |
            artifacts/multi_market_activation_status.json
            artifacts/multi_market_sampling_plan.json
          if-no-files-found: error
