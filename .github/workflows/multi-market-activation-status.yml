name: Multi-Market V2 Readiness Status

on:
  schedule:
    - cron: '12 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'multi_market_activation_status.py'
      - 'test_multi_market_activation_status.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_collector.py'
      - 'multi_market_odds.py'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-activation-status.yml'
  push:
    branches: [main]
    paths:
      - 'multi_market_activation_status.py'
      - 'test_multi_market_activation_status.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_collector.py'
      - 'multi_market_odds.py'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-activation-status.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Compile readiness modules
        run: python -m py_compile multi_market_activation_status.py multi_market_schema_probe.py
      - name: Run mocked readiness tests
        run: pytest -q test_multi_market_activation_status.py test_multi_market_schema_probe.py
      - name: Guard production model artifacts
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  live-read-only-status:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Check exact schema and zero-cost quota readiness
        run: python multi_market_activation_status.py
      - name: Verify zero-cost/read-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/multi_market_activation_status.json').read_text())
          assert p['schema_version']=='MULTI_MARKET_V2_READINESS_STATUS_V1'
          assert p['research_only'] is True
          assert p['read_only'] is True
          assert p['writes_performed'] is False
          assert p['paid_provider_requests']==0
          assert p['prospective_oos_evaluation_active'] is False
          print('status=',p['status'])
          print('quota_ready=',p['quota_ready'])
          print('collection_ready=',p['collection_ready'])
          print('blockers=',p['blockers'])
          PY
      - name: Verify production model unchanged
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload readiness status
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-v2-readiness-status
          path: artifacts/multi_market_activation_status.json
          if-no-files-found: error
