name: MARKET_ANCHOR V2 Checkout Credential Isolation

on:
  push:
    branches:
      - research/v2-current-form-identity-audit-restack-on-958-20261125-run11
      - research/v2-held-workflow-checkout-credential-isolation-on-955-20261124-run11
      - research/v2-frozen-shadow-setup-python-pin-restack-on-970-20261125-run11
      - research/v2-frozen-shadow-checkout-isolation-restack-on-966-20261125-run11
      - research/v2-shadow-test-checkout-token-isolation-on-956-20261125-run11
    paths:
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/recover-market-anchor-v2-candidate.yml"
      - ".github/workflows/serie-a-frozen-v2-shadow-tests.yml"
      - "tests/test_serie_a_v2_workflow_checkout_credentials.py"
      - "tests/test_serie_a_frozen_v2_action_pins.py"
      - ".github/workflows/market-anchor-v2-checkout-credential-isolation.yml"
  pull_request:
    branches:
      - research/v2-frozen-shadow-checkout-isolation-restack-on-966-20261125-run11
      - research/v2-current-form-atomic-redirect-clock-guards-on-954-20261124-run11
      - research/v2-held-workflow-checkout-credential-isolation-on-955-20261124-run11
    paths:
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/recover-market-anchor-v2-candidate.yml"
      - ".github/workflows/serie-a-frozen-v2-shadow-tests.yml"
      - "tests/test_serie_a_v2_workflow_checkout_credentials.py"
      - "tests/test_serie_a_frozen_v2_action_pins.py"
      - ".github/workflows/market-anchor-v2-checkout-credential-isolation.yml"

permissions:
  contents: read

concurrency:
  group: v2-checkout-credential-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Assert checkout credentials are absent from local Git configuration
        shell: bash
        run: |
          set -euo pipefail
          if git config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
            echo "::error::checkout left a GitHub HTTP authorization header in local Git config"
            exit 1
          fi
          if git config --local --get-regexp '^includeIf\.gitdir:' >/dev/null 2>&1; then
            echo "::error::checkout left a credential includeIf entry in local Git config"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install pinned offline test runner
        run: python -m pip install pytest==9.2.0
      - name: Verify held V2 checkout credentials are not persisted
        run: python -m pytest -q tests/test_serie_a_v2_workflow_checkout_credentials.py tests/test_serie_a_frozen_v2_action_pins.py
