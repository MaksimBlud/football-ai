name: La Liga Standard-to-Close Signal V6

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'la_liga_standard_to_close_signal_v6.py'
      - 'tests/test_la_liga_standard_to_close_signal_v6.py'
      - 'research/LA_LIGA_STANDARD_TO_CLOSE_SIGNAL_V6.md'
      - '.github/workflows/la-liga-standard-to-close-signal-v6.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Regression tests
        run: pytest -q tests/test_la_liga_standard_to_close_signal_v6.py
      - name: Run frozen historical V6
        run: python la_liga_standard_to_close_signal_v6.py
      - name: Assert research-only contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/la_liga_standard_to_close_signal_v6/report.json'))
          assert r['experiment_id']=='LA_LIGA_STANDARD_TO_CLOSE_SIGNAL_V6'
          assert r['league']=='LA_LIGA'
          assert r['research_only'] and not r['production_promotion'] and not r['betting_enabled']
          assert r['result']=='NO_BET'
          assert not r['opened_2026_27_outcomes_used']
          assert not r['match_outcome_used_as_target']
          assert not r['standard_is_labeled_opening']
          assert r['baseline']=='ZERO_MOVEMENT'
          assert r['validation_season']=='2024-2025'
          assert r['untouched_test_season']=='2025-2026'
          assert r['coverage']['paired_valid_rows'] >= r['train_n'] + r['validation_n'] + r['test_n']
          if not r['movement_signal_accepted']:
              assert r['active_mode']=='ZERO_MOVEMENT_FALLBACK'
          PY
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: la-liga-standard-to-close-signal-v6
          path: artifacts/la_liga_standard_to_close_signal_v6/report.json
          retention-days: 30
