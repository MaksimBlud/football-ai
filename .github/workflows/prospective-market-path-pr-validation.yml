name: Prospective Market Path PR Validation

on:
  pull_request:
    paths:
      - 'prospective_market_path.py'
      - 'prospective_market_path_cycle.py'
      - 'research/prospective_market_path_v1.json'
      - 'tests/test_prospective_market_path.py'
      - '.github/workflows/prospective-market-path-pr-validation.yml'
      - '.github/workflows/prospective-market-path-cycle.yml'
      - 'docs/PROSPECTIVE_MARKET_PATH_V1_STATUS.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Compile prospective market path modules
        run: python -m py_compile prospective_market_path.py prospective_market_path_cycle.py
      - name: Run focused contract tests
        run: pytest -q tests/test_prospective_market_path.py
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
