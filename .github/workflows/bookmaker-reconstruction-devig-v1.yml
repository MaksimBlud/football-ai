name: BOOKMAKER_RECONSTRUCTION_DEVIG_V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bookmaker_reconstruction_devig_v1.py'
      - 'tests/test_bookmaker_reconstruction_devig_v1.py'
      - 'research/BOOKMAKER_RECONSTRUCTION_DEVIG_V1.md'
      - '.github/workflows/bookmaker-reconstruction-devig-v1.yml'
  push:
    branches: [main]
    paths:
      - 'bookmaker_reconstruction_devig_v1.py'
      - 'tests/test_bookmaker_reconstruction_devig_v1.py'
      - 'research/BOOKMAKER_RECONSTRUCTION_DEVIG_V1.md'
      - '.github/workflows/bookmaker-reconstruction-devig-v1.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Regression tests
        run: pytest -q tests/test_bookmaker_reconstruction_devig_v1.py
      - name: Run frozen de-vig benchmark
        run: python bookmaker_reconstruction_devig_v1.py
      - name: Assert research-only temporal contract
        run: |
          python - <<'PY'
          import json
          p='artifacts/bookmaker_reconstruction_devig_v1/report.json'
          r=json.load(open(p))
          assert r['experiment_id'] == 'BOOKMAKER_RECONSTRUCTION_DEVIG_V1'
          assert r['research_only'] is True
          assert r['production_promotion'] is False
          assert r['betting_enabled'] is False
          assert r['result'] == 'NO_BET'
          assert r['opened_2026_27_outcomes_used'] is False
          assert r['validation_season'] == '2024-2025'
          assert r['untouched_test_season'] == '2025-2026'
          assert set(r['methods']) == {'PROPORTIONAL','POWER','SHIN'}
          assert r['pooled_validation_n'] > 0
          assert r['pooled_test_n'] > 0
          PY
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: bookmaker-reconstruction-devig-v1
          path: artifacts/bookmaker_reconstruction_devig_v1/report.json
          retention-days: 30
