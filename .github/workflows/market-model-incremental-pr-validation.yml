name: Market Model Incremental PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "market_model_incremental_audit.py"
      - "tests/test_market_model_incremental_audit.py"
      - ".github/workflows/market-model-incremental-pr-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas
      - name: Compile and test paired incremental audit
        run: |
          python -m py_compile market_model_incremental_audit.py
          python -m pytest -q tests/test_market_model_incremental_audit.py
      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
