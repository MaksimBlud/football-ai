name: MARKET_ANCHOR V2 Footiqo Manual Intake

on:
  pull_request:
    branches:
      - main
    paths:
      - "serie_a_v2_footiqo_manual_intake.py"
      - "tests/test_serie_a_v2_footiqo_manual_intake.py"
      - "research/source_rights/footiqo.json"
      - "research/models/market_anchor_v2_serie_a_frozen_candidate.json"
      - "historical_football_signal_lab.py"
      - "serie_a_runtime_config.py"
      - ".github/workflows/market-anchor-v2-footiqo-manual-intake.yml"
  push:
    branches:
      - research/v2-footiqo-manual-intake-20261117-run11
    paths:
      - "serie_a_v2_footiqo_manual_intake.py"
      - "tests/test_serie_a_v2_footiqo_manual_intake.py"
      - "research/source_rights/footiqo.json"
      - "research/models/market_anchor_v2_serie_a_frozen_candidate.json"
      - "historical_football_signal_lab.py"
      - "serie_a_runtime_config.py"
      - ".github/workflows/market-anchor-v2-footiqo-manual-intake.yml"

permissions:
  contents: read

jobs:
  offline-manual-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline feature-test dependencies
        run: python -m pip install pytest numpy pandas scikit-learn
      - name: Compile manual-only original V2 adapter
        run: python -m py_compile serie_a_v2_footiqo_manual_intake.py
      - name: Run manual-only source gate, SHA and original-feature parity regressions
        run: python -m pytest -q tests/test_serie_a_v2_footiqo_manual_intake.py
