name: MARKET_ANCHOR V2 11footy Source Rights Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/source_rights/11footy.json"
      - "research/SERIE_A_V2_11FOOTY_SOURCE_AUDIT_20261119.md"
      - "tests/test_serie_a_v2_11footy_source_audit.py"
      - "research/models/market_anchor_v2_serie_a_frozen_candidate.json"
      - ".github/workflows/market-anchor-v2-11footy-source-audit.yml"
  push:
    branches:
      - research/v2-11footy-source-audit-20261119-run11
    paths:
      - "research/source_rights/11footy.json"
      - "research/SERIE_A_V2_11FOOTY_SOURCE_AUDIT_20261119.md"
      - "tests/test_serie_a_v2_11footy_source_audit.py"
      - "research/models/market_anchor_v2_serie_a_frozen_candidate.json"
      - ".github/workflows/market-anchor-v2-11footy-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-source-rights-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test runner
        run: python -m pip install pytest==8.4.2
      - name: Run 11footy HOLD and frozen V2 invariants
        run: python -m pytest -q tests/test_serie_a_v2_11footy_source_audit.py
