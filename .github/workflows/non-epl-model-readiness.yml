name: Non-EPL Model Readiness

on:
  pull_request:
    paths:
      - 'non_epl_model_readiness.py'
      - 'train_la_liga_1x2_candidate.py'
      - 'tests/test_non_epl_model_readiness.py'
      - 'tests/test_train_la_liga_1x2_candidate.py'
      - 'research/NON_EPL_MODEL_READINESS_V1.md'
      - '.github/workflows/non-epl-model-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'non_epl_model_readiness.py'
      - 'train_la_liga_1x2_candidate.py'
      - 'tests/test_non_epl_model_readiness.py'
      - 'tests/test_train_la_liga_1x2_candidate.py'
      - 'research/NON_EPL_MODEL_READINESS_V1.md'
      - '.github/workflows/non-epl-model-readiness.yml'

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python non_epl_model_readiness.py --json
      - run: pytest -q tests/test_non_epl_model_readiness.py tests/test_train_la_liga_1x2_candidate.py
      - name: Production artifacts unchanged
        run: git diff --exit-code -- '*.pkl'

  la-liga-historical-candidate-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build completed La Liga historical/OOS inputs
        run: python league_model_pipeline.py --league LA_LIGA
      - name: Evaluate candidate artifact gate
        run: python train_la_liga_1x2_candidate.py
      - name: Record research result
        if: always()
        run: |
          if [ -f experiments/la_liga_candidate_artifact/latest.json ]; then
            cat experiments/la_liga_candidate_artifact/latest.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'production promotion: false' >> "$GITHUB_STEP_SUMMARY"
      - name: Production artifacts unchanged
        run: git diff --exit-code -- '*.pkl'
      - name: Upload research-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-liga-historical-candidate-proof
          path: |
            experiments/la_liga_candidate_artifact/latest.json
            artifacts/candidates/la_liga/manifest.json
          if-no-files-found: ignore
