name: Original V2 Current-Form Artifact Redirect Validation

on:
  push:
    branches:
      - research/v2-current-form-artifact-redirect-guard-on-923-20261123-run11
    paths:
      - "serie_a_v2_current_form_forward_capture.py"
      - "tests/test_serie_a_v2_current_form_forward_capture.py"
      - ".github/workflows/market-anchor-v2-current-form-artifact-redirect-validation.yml"
  pull_request:
    branches:
      - research/v2-atomic-current-form-source-capture-on-922-20261122-run11
    paths:
      - "serie_a_v2_current_form_forward_capture.py"
      - "tests/test_serie_a_v2_current_form_forward_capture.py"
      - ".github/workflows/market-anchor-v2-current-form-artifact-redirect-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-current-form-artifact-redirect-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline original V2 dependencies
        run: python -m pip install pandas numpy scipy scikit-learn requests supabase python-dotenv pytest
      - name: Compile current-form forward capture
        run: python -m py_compile serie_a_v2_current_form_forward_capture.py
      - name: Run current-form source, quote-order, and artifact transport regressions
        run: python -m pytest -q tests/test_serie_a_v2_current_form_forward_capture.py tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- '*.pkl'
