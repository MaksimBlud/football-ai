name: Serie A Operational Bootstrap

on:
  push:
    branches:
      - phase-serie-a-operational-complete

concurrency:
  group: serie-a-operational-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_URL", "SUPABASE_KEY", "THE_ODDS_API_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Serie A bootstrap secrets: " + ", ".join(missing))
          print("PASS: required secrets available; values not printed")
          PY
      - name: Compile Serie A stack
        run: |
          python -m py_compile serie_a_runtime_config.py
          python -m py_compile save_serie_a_odds_snapshot.py
          python -m py_compile export_serie_a_upcoming_matches.py
          python -m py_compile generate_serie_a_market_shadow.py
          python -m py_compile persist_serie_a_market_observations.py
          python -m py_compile persist_serie_a_prediction_ledger.py
          python -m py_compile serie_a_live_cycle.py
          python -m py_compile scheduled_serie_a_odds_snapshot.py
          python -m py_compile serie_a_scores_service.py
          python -m py_compile update_serie_a_results.py
          python -m py_compile evaluate_serie_a_predictions.py
      - name: Verify MARKET_ONLY safety
        run: |
          python - <<'PY'
          from serie_a_runtime_config import SERIE_A_RUNTIME_CONFIG
          s = SERIE_A_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: Serie A remains MARKET_ONLY")
          PY
      - name: Write first live Serie A odds snapshot
        run: python save_serie_a_odds_snapshot.py
      - name: Run first durable Serie A live cycle
        run: python serie_a_live_cycle.py
      - name: Replay durable Serie A live cycle
        run: python serie_a_live_cycle.py
      - name: Sync current Serie A finished results
        run: python update_serie_a_results.py --write
      - name: Evaluate current Serie A ledger
        run: python evaluate_serie_a_predictions.py
      - name: Audit durable Serie A state
        run: |
          python - <<'PY'
          from database import supabase
          for table in (
              "odds_snapshots",
              "league_structural_v2_observations",
              "league_prediction_ledger",
              "league_finished_results",
          ):
              response = (
                  supabase.table(table)
                  .select("*", count="exact")
                  .eq("league", "SERIE_A")
                  .limit(3)
                  .execute()
              )
              print(table, int(response.count or 0))
          print("PASS: Serie A durable state query complete")
          PY
      - name: Enforce no production artifact changes
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
