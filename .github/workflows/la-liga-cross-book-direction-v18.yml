name: La Liga Cross Book Direction V18
on:
  workflow_dispatch:
  pull_request:
    paths: ['la_liga_cross_book_direction_v18.py','tests/test_la_liga_cross_book_direction_v18.py','.github/workflows/la-liga-cross-book-direction-v18.yml']
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: pytest -q tests/test_la_liga_cross_book_direction_v18.py
      - run: python la_liga_cross_book_direction_v18.py
      - run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/la_liga_cross_book_direction_v18/report.json'))
          assert r['research_only'] and r['result']=='NO_BET' and r['parameters_transferred_without_la_liga_tuning']
          assert not r['production_promotion'] and not r['betting_enabled'] and not r['match_outcome_used'] and not r['standard_is_labeled_opening']
          assert r['features']==['disagree_home','disagree_draw','disagree_away'] and r['fold_count']>=3
          PY
      - run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with: {name: la-liga-cross-book-direction-v18, path: artifacts/la_liga_cross_book_direction_v18/report.json, retention-days: 30}
