name: MARKET_ANCHOR V2 OpenFootAPI Source Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/source_rights/openfootapi.json"
      - "research/SERIE_A_V2_OPENFOOTAPI_SOURCE_AUDIT_20261125.md"
      - "tests/test_serie_a_v2_openfootapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-openfootapi-source-audit.yml"
  push:
    branches:
      - research/v2-openfootapi-source-rights-audit-20261125-run11
    paths:
      - "research/source_rights/openfootapi.json"
      - "research/SERIE_A_V2_OPENFOOTAPI_SOURCE_AUDIT_20261125.md"
      - "tests/test_serie_a_v2_openfootapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-openfootapi-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned pytest
        run: python -m pip install pytest==9.2.0
      - name: Run offline OpenFootAPI source-rights and frozen V2 contract tests
        run: python -m pytest -q tests/test_serie_a_v2_openfootapi_source_audit.py
