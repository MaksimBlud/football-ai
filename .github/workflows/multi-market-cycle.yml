name: Multi-Market V2 Cycle

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      allow_paid_collection:
        description: 'Explicitly allow this manual run to enter the paid collection path after schema+quota gates pass'
        required: true
        default: false
        type: boolean
      max_paid_requests:
        description: 'Maximum paid provider requests for this controlled manual run'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '5']
  pull_request:
    paths:
      - 'multi_market_activation_status.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_card.py'
      - 'multi_market_collector.py'
      - 'multi_market_cycle.py'
      - 'test_multi_market_cycle.py'
      - 'test_multi_market_collector.py'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'multi_market_activation_status.py'
      - 'multi_market_schema_probe.py'
      - 'multi_market_card.py'
      - 'multi_market_collector.py'
      - 'multi_market_cycle.py'
      - 'test_multi_market_cycle.py'
      - 'test_multi_market_collector.py'
      - 'supabase/migrations/20260905000*.sql'
      - '.github/workflows/multi-market-cycle.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Compile cycle modules
        run: python -m py_compile multi_market_cycle.py multi_market_activation_status.py multi_market_schema_probe.py multi_market_collector.py
      - name: Run fail-closed cycle tests
        run: pytest -q test_multi_market_cycle.py test_multi_market_collector.py test_multi_market_activation_status.py test_multi_market_schema_probe.py test_multi_market_card.py test_multi_market_odds.py
      - name: Production artifact guard
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  live-cycle:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      MULTI_MARKET_COLLECTION_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_paid_collection && '1' || '0' }}
      MULTI_MARKET_MAX_PAID_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_paid_requests || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Run fail-closed Multi-Market V2 cycle
        run: python multi_market_cycle.py
      - name: Verify cycle safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/multi_market_cycle_status.json').read_text())
          assert p['schema_version']=='MULTI_MARKET_V2_CYCLE_STATUS_V1'
          assert p['research_only'] is True
          assert p['prospective_oos_evaluation_active'] is False
          if p['action'] in {'NOOP_BLOCKED','NOOP_ACTIVATION_REQUIRED'}:
              assert p['collection_called'] is False
              assert p['paid_provider_requests']==0
          if p['action']=='COLLECTION_ATTEMPTED':
              assert p['collection_activation_enabled'] is True
              cap=p['collection'].get('max_paid_requests')
              if cap is not None:
                  assert p['paid_provider_requests'] <= int(cap)
          print('action=',p['action'])
          print('activation_enabled=',p.get('collection_activation_enabled'))
          print('collection_called=',p['collection_called'])
          print('paid_provider_requests=',p['paid_provider_requests'])
          print('blockers=',p['readiness'].get('blockers'))
          PY
      - name: Verify production model unchanged
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload cycle status
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-v2-cycle-status
          path: artifacts/multi_market_cycle_status.json
          if-no-files-found: error
