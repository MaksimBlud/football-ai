name: Multi-Market V1 Cycle

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'multi_market_card.py'
      - 'multi_market_collector.py'
      - 'multi_market_cycle.py'
      - 'supabase/migrations/202609050001_league_multi_market_snapshots.sql'
      - '.github/workflows/multi-market-cycle.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Focused normalization tests
        run: pytest -q test_multi_market_card.py test_multi_market_odds.py
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Run fail-closed multi-market cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python multi_market_cycle.py
      - name: Verify production model unchanged
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
