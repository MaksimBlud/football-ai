name: RPL Odds Snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"

concurrency:
  group: rpl-odds-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("THE_ODDS_API_KEY", "SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing RPL snapshot secrets: " + ", ".join(missing))
          print("PASS: RPL snapshot secrets available; values not printed")
          PY
      - name: Verify RPL MARKET_ONLY safety
        run: |
          python - <<'PY'
          from league_runtime_config import RPL_RUNTIME_CONFIG
          s = RPL_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: RPL remains MARKET_ONLY")
          PY
      - name: Run adaptive RPL snapshot check
        run: python scheduled_rpl_odds_snapshot.py
