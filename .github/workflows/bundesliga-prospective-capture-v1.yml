name: Bundesliga Prospective Capture V1

on:
  pull_request:
    paths:
      - "bundesliga_prospective_capture.py"
      - "tests/test_bundesliga_prospective_capture.py"
      - "research/BUNDESLIGA_PROSPECTIVE_CAPTURE_V1.md"
      - "experiments/bundesliga_market_only_v1.csv"
      - "PROJECT_CONTINUITY_ADDENDUM_20260911_BUNDESLIGA_CAPTURE_READY.md"
      - ".github/workflows/bundesliga-prospective-capture-v1.yml"
  push:
    branches: [main]
    paths:
      - "bundesliga_prospective_capture.py"
      - "tests/test_bundesliga_prospective_capture.py"
      - "research/BUNDESLIGA_PROSPECTIVE_CAPTURE_V1.md"
      - "experiments/bundesliga_market_only_v1.csv"
      - "PROJECT_CONTINUITY_ADDENDUM_20260911_BUNDESLIGA_CAPTURE_READY.md"
      - ".github/workflows/bundesliga-prospective-capture-v1.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile capture tool
        run: python -m py_compile bundesliga_prospective_capture.py
      - name: Run frozen fail-closed capture tests
        run: python -m pytest -q tests/test_bundesliga_prospective_capture.py
      - name: Prove no production artifacts changed
        run: |
          git diff --exit-code -- '*.pkl'
          test -z "$(git status --porcelain -- '*.pkl')"
