name: Research Last 120 Seconds — Season 2026/27
on:
  push:
    branches:
      - research/last120-season-20261020
    paths:
      - research/last120_season_20261020/analyze.py
      - .github/workflows/research-last120-season-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Calculate season snapshot
        run: python research/last120_season_20261020/analyze.py | tee season-output.log
      - name: Upload match-level audit and candidate goals
        uses: actions/upload-artifact@v4
        with:
          name: last120-season-2026-27-through-2026-10-19
          path: |
            research/last120_season_20261020/results/matches.csv
            research/last120_season_20261020/results/late_goal_candidates.csv
            research/last120_season_20261020/results/summary.json
            season-output.log
          retention-days: 10
