name: Serie A Corners Prospective V1

on:
  pull_request:
    paths:
      - 'serie_a_corners_prospective_v1.py'
      - 'tests/test_serie_a_corners_prospective_v1.py'
      - 'research/SERIE_A_CORNERS_PROSPECTIVE_V1.md'
      - '.github/workflows/serie-a-corners-prospective-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2 pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Compile prospective module
        run: python -m py_compile serie_a_corners_prospective_v1.py
      - name: Run prospective regression tests
        run: pytest -q tests/test_serie_a_corners_prospective_v1.py
      - name: Assert frozen constants
        run: |
          python - <<'PY'
          import serie_a_corners_prospective_v1 as s
          assert s.EXPERIMENT_ID == 'SERIE_A_CORNERS_PROSPECTIVE_V1'
          assert s.LEAGUE == 'SERIE_A'
          assert s.TARGET_ELIGIBLE_ROWS == 30
          assert s.BLEND_WEIGHT_FOOTBALL == 0.25
          assert s.MAX_PROVIDER_REQUESTS == 20
          assert s.REQUEST_INTERVAL_SECONDS >= 3.0
          assert s.MIN_PREMATCH_LEAD_HOURS == 6
          assert s.CAPTURE_HORIZON_DAYS == 14
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  prospective-collection:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2
      - name: Require free provider key without printing it
        run: test -n "$FIVE_DOLLAR_FOOTBALL_API_KEY"
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true

      - name: Restore latest rolling prospective artifact
        run: |
          mkdir -p /tmp/serie-a-corners-previous
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=serie-a-corners-prospective-v1-ledger&per_page=100"             --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/serie-a-corners-previous.zip
            unzip -q /tmp/serie-a-corners-previous.zip -d /tmp/serie-a-corners-previous
            LEDGER_IN=$(find /tmp/serie-a-corners-previous -name ledger.jsonl -type f | head -n 1)
            STATE_IN=$(find /tmp/serie-a-corners-previous -name state.json -type f | head -n 1)
            [ -n "$LEDGER_IN" ] && echo "LEDGER_IN=$LEDGER_IN" >> "$GITHUB_ENV"
            [ -n "$STATE_IN" ] && echo "STATE_IN=$STATE_IN" >> "$GITHUB_ENV"
            echo "Restored prior prospective state from artifact id $ARTIFACT_ID"
          else
            echo "No prior prospective artifact; starting a new frozen ledger"
          fi

      - name: Collect new pre-match openings and settle finished rows
        run: |
          ARGS=()
          [ -n "${LEDGER_IN:-}" ] && ARGS+=(--ledger-in "$LEDGER_IN")
          [ -n "${STATE_IN:-}" ] && ARGS+=(--state-in "$STATE_IN")
          python serie_a_corners_prospective_v1.py             --output-dir artifacts/serie_a_corners_prospective_v1             "${ARGS[@]}" > /tmp/serie-a-corners-collect.log

      - name: Check whether eligibility evaluation can run
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('artifacts/serie_a_corners_prospective_v1/report.json')
          r = json.loads(p.read_text())
          assert r['experiment_id'] == 'SERIE_A_CORNERS_PROSPECTIVE_V1'
          assert r['research_only'] is True
          assert r['betting_enabled'] is False
          assert r['paid_subscription_used'] is False
          assert r['provider_requests'] <= 20
          ready = r.get('status') == 'COLLECTING' and r.get('finished_market_rows', 0) >= 30
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f"EVAL_READY={'1' if ready else '0'}\n")
          print(json.dumps({
              'status': r.get('status'),
              'captured_market_rows': r.get('captured_market_rows'),
              'finished_market_rows': r.get('finished_market_rows'),
              'provider_requests': r.get('provider_requests'),
              'confirmatory_metrics_opened': r.get('confirmatory_metrics_opened', False),
          }, indent=2, sort_keys=True))
          PY

      - name: Materialize frozen free Serie A corner history
        if: env.EVAL_READY == '1'
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          from urllib.parse import quote

          import pandas as pd
          import requests

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          target = Path('/tmp/serie-a-corners-history/SERIE_A')
          target.mkdir(parents=True, exist_ok=True)
          old = [
              ('1617', 9), ('1718', 8), ('1819', 7), ('1920', 6),
              ('2021', 5), ('2122', 4), ('2223', 3), ('2324', 2),
          ]

          def fetch(repo, ref, path):
              encoded = quote(path, safe='/')
              url = f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={ref}'
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              payload = response.json()
              return base64.b64decode(payload['content'])

          for code, idx in old:
              raw = fetch(
                  'simonsoj90/football-corners',
                  '9446a5e82e7a3e6d00ea92402549e03212f6011b',
                  f'data/raw/I1 ({idx + 1}).csv',
              )
              path = target / f'{code}.csv'
              path.write_bytes(raw)

          (target / '2425.csv').write_bytes(
              fetch(
                  'Mentat-Uran/ScoutFootball_for_World_Cup',
                  'bc1c474bb74984638ddb1b196678ff0fe9d79896',
                  'data/raw/football_data/2425/I1.csv',
              )
          )
          (target / '2526.csv').write_bytes(
              fetch(
                  'devaskswhy/Ball_Knowledge',
                  '8800a55381d84d0cf8845c6613a71e6f82fd9580',
                  'data/2526/I1.csv',
              )
          )

          for path in sorted(target.glob('*.csv')):
              frame = pd.read_csv(path)
              if not {'Date', 'HomeTeam', 'AwayTeam', 'HC', 'AC'} <= set(frame.columns):
                  raise SystemExit(f'{path.name}: missing required corner columns')
              if len(frame) < 250:
                  raise SystemExit(f'{path.name}: incomplete history ({len(frame)} rows)')
          print('Materialized pinned 2016-17..2025-26 Serie A corner history')
          PY

      - name: Open confirmatory metrics only after frozen sample gate
        if: env.EVAL_READY == '1'
        run: |
          python serie_a_corners_prospective_v1.py             --evaluate             --ledger-in artifacts/serie_a_corners_prospective_v1/ledger.jsonl             --history-dir /tmp/serie-a-corners-history             --current-fixtures-json artifacts/serie_a_corners_prospective_v1/raw/finished_fixtures.json             --output-dir artifacts/serie_a_corners_prospective_v1             > /tmp/serie-a-corners-evaluate.log

      - name: Assert prospective disclosure contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/serie_a_corners_prospective_v1')
          collection = json.loads((root / 'report.json').read_text())
          evaluation_path = root / 'evaluation_report.json'
          if evaluation_path.exists():
              result = json.loads(evaluation_path.read_text())
              if result['confirmatory_metrics_opened']:
                  assert result['confirmatory_rows'] == 30
                  assert result['status'] in {
                      'REPLICATED_SIGNAL_SCREEN',
                      'INDICATIVE_NOT_CONFIRMED',
                      'NOT_REPLICATED',
                  }
                  assert len(result['cohort_fixture_ids']) == 30
                  state = json.loads((root / 'state.json').read_text())
                  assert state['sealed'] is True
              else:
                  assert result['status'] == 'COLLECTING'
                  assert result['eligible_finished_rows'] < 30
                  assert 'market' not in result
                  assert 'blend25' not in result
          else:
              assert collection['status'] in {'COLLECTING', 'SEALED'}
              assert collection.get('confirmatory_metrics_opened', False) is False
          PY

      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

      - name: Upload rolling prospective ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-corners-prospective-v1-ledger
          path: |
            artifacts/serie_a_corners_prospective_v1
            /tmp/serie-a-corners-collect.log
            /tmp/serie-a-corners-evaluate.log
          if-no-files-found: warn
          retention-days: 90
