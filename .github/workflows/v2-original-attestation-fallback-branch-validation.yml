name: Original V2 Attestation Fallback Branch Validation

on:
  push:
    branches:
      - research/v2-original-attestation-fallback-negative-tests-20261118-run11
    paths:
      - "serie_a_v2_attest_real_source.py"
      - "tests/test_serie_a_v2_attest_real_source.py"
      - ".github/workflows/v2-original-attestation-fallback-branch-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-attestation-fallback-validation
  cancel-in-progress: false

jobs:
  offline-v2-regression:
    name: offline-v2-regression-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-suffix: py311
          - python-version: "3.12"
            lock-suffix: py312
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-v2-research-${{ matrix.lock-suffix }}.lock
      - name: Install pinned original V2 research dependencies
        run: python -m pip install -r requirements-v2-research-${{ matrix.lock-suffix }}.lock
      - name: Compile original source attestor
        run: python -m py_compile serie_a_v2_attest_real_source.py
      - name: Run source archive attestation regressions
        run: python -m pytest -q tests/test_serie_a_v2_attest_real_source.py
      - name: Prove candidate and production pickles are unchanged
        run: |
          git fetch --no-tags origin \
            refs/heads/research/v2-original-attestation-skip-invalid-newer-artifacts-20261118-run11:refs/remotes/origin/research/v2-original-attestation-skip-invalid-newer-artifacts-20261118-run11
          git diff --exit-code \
            origin/research/v2-original-attestation-skip-invalid-newer-artifacts-20261118-run11...HEAD \
            -- '*.pkl' research/models/market_anchor_v2_serie_a_frozen_candidate.json
