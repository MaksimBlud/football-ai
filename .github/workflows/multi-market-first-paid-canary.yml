name: Multi-Market First Paid Canary

on:
  pull_request:
    paths:
      - 'multi_market_first_paid_canary.py'
      - 'multi_market_collector.py'
      - 'test_multi_market_first_paid_canary.py'
      - 'test_multi_market_empty_corner_payload.py'
      - '.github/workflows/multi-market-first-paid-canary.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/multi-market-first-paid-canary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv pytest
      - name: Compile canary modules
        run: python -m py_compile multi_market_first_paid_canary.py multi_market_sampling_plan.py multi_market_collector.py multi_market_odds.py
      - name: Run first-paid canary regressions
        run: pytest -q test_multi_market_first_paid_canary.py test_multi_market_empty_corner_payload.py test_multi_market_collector.py test_multi_market_sampling_plan.py
      - name: Guard production model artifacts
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  live-first-paid-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests supabase python-dotenv
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Prove retired canary has immutable two-row evidence before postmortem
        run: |
          python - <<'PY'
          from database import supabase
          r=(supabase.table('league_multi_market_snapshots')
             .select('snapshot_key',count='exact').limit(0).execute())
          assert int(r.count)==2, f'retired first canary requires exactly two immutable evidence rows, found {r.count}'
          print('snapshot_count=',r.count)
          print('provider_credentials_present=',False)
          PY
      - name: Run retired read-only canary postmortem
        run: python multi_market_first_paid_canary.py
      - name: Verify retired canary postmortem contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/multi_market_first_paid_canary.json').read_text())
          assert p['schema_version']=='MULTI_MARKET_FIRST_PAID_CANARY_V1'
          assert p['research_only'] is True
          assert p['production_promotion'] is False
          assert p['prospective_oos_evaluation_active'] is False
          assert p['status']=='BLOCKED_NO_CORNER_MARKET'
          assert p['blocker']=='FIRST_PAID_CANARY_NO_CORNER_MARKET'
          assert p['snapshot_count_before']==2
          assert p['snapshot_count_after']==2
          assert p['provider_recheck_performed'] is False
          assert p['preflight'] is None
          assert p['collection'] is None
          assert p['quota_after'] is None
          assert p['post_collection']['unique_events']==2
          assert p['post_collection']['unique_snapshot_keys']==2
          assert len(p['post_collection']['missing_corner_event_ids'])==2
          assert p['post_collection']['event_last_costs']==[0,0]
          assert all(cost==2 for cost in p['post_collection']['featured_last_costs'])
          assert int(p['post_collection']['observed_remaining_credits']) >= int(p['hard_reserve_credits'])
          print('status=',p['status'])
          print('provider_recheck_performed=',p['provider_recheck_performed'])
          print('missing_corner_event_ids=',p['post_collection']['missing_corner_event_ids'])
          print('market_keys=',p['post_collection']['provider_market_keys'])
          print('bookmakers=',p['post_collection']['bookmaker_keys'])
          PY
      - name: Verify production model unchanged
        if: always()
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload first paid canary postmortem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-first-paid-canary
          path: artifacts/multi_market_first_paid_canary.json
          if-no-files-found: warn
