name: Eredivisie PR Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: eredivisie-pr-placeholder
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pytest pandas numpy requests supabase python-dotenv
      - name: Compile Eredivisie modules
        run: python -m py_compile eredivisie_runtime_config.py save_eredivisie_odds_snapshot.py export_eredivisie_upcoming_matches.py generate_eredivisie_market_shadow.py persist_eredivisie_market_observations.py persist_eredivisie_prediction_ledger.py eredivisie_live_cycle.py scheduled_eredivisie_odds_snapshot.py eredivisie_scores_service.py update_eredivisie_results.py evaluate_eredivisie_predictions.py
      - run: python -m pytest -q tests/test_eredivisie_operational.py
      - run: python -m pytest -q tests/test_league_prediction_ledger.py tests/test_evaluate_league_predictions.py
      - name: Enforce no production artifact changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in Eredivisie PR"
