name: BOOKMAKER_RECONSTRUCTION_CONSENSUS_V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bookmaker_reconstruction_consensus_v1.py'
      - 'tests/test_bookmaker_reconstruction_consensus_v1.py'
      - 'research/BOOKMAKER_RECONSTRUCTION_CONSENSUS_V1.md'
      - '.github/workflows/bookmaker-reconstruction-consensus-v1.yml'
  push:
    branches: [main]
    paths:
      - 'bookmaker_reconstruction_consensus_v1.py'
      - 'tests/test_bookmaker_reconstruction_consensus_v1.py'
      - 'research/BOOKMAKER_RECONSTRUCTION_CONSENSUS_V1.md'
      - '.github/workflows/bookmaker-reconstruction-consensus-v1.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Consensus contract tests
        run: pytest -q tests/test_bookmaker_reconstruction_consensus_v1.py
      - name: Run frozen consensus benchmark
        run: python bookmaker_reconstruction_consensus_v1.py
      - name: Assert temporal, coverage and safety contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/bookmaker_reconstruction_consensus_v1/report.json'))
          assert r['experiment_id'] == 'BOOKMAKER_RECONSTRUCTION_CONSENSUS_V1'
          assert r['baseline_source'] == 'B365'
          assert r['devig_method_fixed'] == 'PROPORTIONAL'
          assert r['validation_season'] == '2024-2025'
          assert r['untouched_test_season'] == '2025-2026'
          assert r['opened_2026_27_outcomes_used'] is False
          assert r['research_only'] is True
          assert r['production_promotion'] is False
          assert r['betting_enabled'] is False
          assert r['result'] == 'NO_BET'
          assert r['full_validation_n'] >= r['common_source_validation_n'] > 0
          assert r['full_test_n'] >= r['common_source_test_n'] > 0
          assert abs(r['common_source_test_fraction'] - r['common_source_test_n'] / r['full_test_n']) <= 1e-12
          assert 'pooled_by_season' in r['coverage']
          assert 'league_season' in r['coverage']
          assert 'test_monthly' in r['coverage']
          assert r['common_source_test_is_full_cohort'] == (r['common_source_test_n'] == r['full_test_n'])
          PY
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: bookmaker-reconstruction-consensus-v1
          path: artifacts/bookmaker_reconstruction_consensus_v1/report.json
          retention-days: 30
