name: Original V2 Source Rights Guard Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "serie_a_v2_source_rights.py"
      - "research/market_anchor_1x2_v2_source_rights.json"
      - "research/FOOTBALL_DATA_SOURCE_RIGHTS_AUDIT_20261104.md"
      - "serie_a_v2_current_form_source_capture.py"
      - "serie_a_v2_current_form_forward_capture.py"
      - "serie_a_v2_live_diagnostic_report.py"
      - "serie_a_v2_forward_capture.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - "tests/test_serie_a_v2_source_rights_gate.py"
      - ".github/workflows/serie-a-v2-source-rights-gate-tests.yml"
  push:
    branches: [main]
    paths:
      - "serie_a_v2_source_rights.py"
      - "research/market_anchor_1x2_v2_source_rights.json"
      - "research/FOOTBALL_DATA_SOURCE_RIGHTS_AUDIT_20261104.md"
      - "serie_a_v2_current_form_source_capture.py"
      - "serie_a_v2_current_form_forward_capture.py"
      - "serie_a_v2_live_diagnostic_report.py"
      - "serie_a_v2_forward_capture.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - "tests/test_serie_a_v2_source_rights_gate.py"
      - ".github/workflows/serie-a-v2-source-rights-gate-tests.yml"

permissions:
  contents: read

jobs:
  offline-rights-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependency
        run: python -m pip install pytest
      - name: Compile V2 rights gate and live entrypoints
        run: |
          python -m py_compile serie_a_v2_source_rights.py
          python -m py_compile serie_a_v2_current_form_source_capture.py
          python -m py_compile serie_a_v2_current_form_forward_capture.py
          python -m py_compile serie_a_v2_live_diagnostic_report.py
          python -m py_compile serie_a_v2_forward_capture.py
      - name: Run fail-closed rights and workflow contract regressions
        run: python -m pytest -q tests/test_serie_a_v2_source_rights_gate.py
