name: Corner Combined Discriminator V4
on:
  pull_request:
    paths:
      - 'corner_combined_discriminator_v4.py'
      - 'research/CORNER_COMBINED_DISCRIMINATOR_V4.md'
      - 'research/CORNER_COMBINED_DISCRIMINATOR_V4_RESULTS.md'
      - 'research/reference/CORNER_COMBINED_DISCRIMINATOR_V4_EPL.csv'
      - 'tests/test_corner_combined_discriminator_v4.py'
      - '.github/workflows/corner-combined-discriminator-v4.yml'
  push:
    branches: [main]
    paths:
      - 'corner_combined_discriminator_v4.py'
      - 'research/CORNER_COMBINED_DISCRIMINATOR_V4.md'
      - 'research/CORNER_COMBINED_DISCRIMINATOR_V4_RESULTS.md'
      - 'research/reference/CORNER_COMBINED_DISCRIMINATOR_V4_EPL.csv'
      - 'tests/test_corner_combined_discriminator_v4.py'
      - '.github/workflows/corner-combined-discriminator-v4.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Verify pinned historical evidence digest
        run: echo '62ed4c50a60a9583b907586bb3b14337532e06125759081f96f1f1ddfe76e48d  research/reference/CORNER_COMBINED_DISCRIMINATOR_V4_EPL.csv' | sha256sum -c -
      - name: Run regression tests
        run: pytest -q tests/test_corner_combined_discriminator_v4.py
      - name: Run deterministic final audit
        run: python corner_combined_discriminator_v4.py --reference research/reference/CORNER_COMBINED_DISCRIMINATOR_V4_EPL.csv
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: corner-combined-discriminator-v4
          path: artifacts/corner_combined_discriminator_v4/
          retention-days: 30
