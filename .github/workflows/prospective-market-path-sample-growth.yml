name: Prospective Market Path Sample Growth

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches: [main]
    paths:
      - "prospective_market_path_sample_growth.py"
      - "prospective_market_path_sample_growth_cycle.py"
      - ".github/workflows/prospective-market-path-sample-growth.yml"

permissions:
  contents: read

concurrency:
  group: prospective-market-path-sample-growth-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy 'scikit-learn==1.7.2' supabase python-dotenv
      - name: Verify read credentials
        run: |
          python - <<'PY'
          import os
          missing=[name for name in ('SUPABASE_URL','SUPABASE_KEY') if not os.getenv(name)]
          if missing:
              raise SystemExit('Missing research read credentials: '+', '.join(missing))
          print('PASS: read credentials available; values not printed')
          PY
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run sample-growth audit
        run: python prospective_market_path_sample_growth_cycle.py
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload sample-growth diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-market-path-sample-growth-v1
          path: artifacts/prospective_market_path_v1/sample_growth_*.csv
          retention-days: 90
      - name: Report readiness only
        run: |
          python - <<'PY'
          import pandas as pd
          frame=pd.read_csv('artifacts/prospective_market_path_v1/sample_growth_readiness.csv')
          ready=frame[frame['ready'].astype(str).str.lower().eq('true')]
          if len(ready):
              print('READINESS_REACHED (evaluation remains a separate preregistered action):')
              print(ready[['league','settled_fixtures','calendar_months','valid_test_blocks']].to_string(index=False))
          else:
              print('WAIT: preregistered sample readiness not reached; no outcome evaluation performed')
          PY
