name: Prospective Availability External Gate Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prospective-availability-external-gate-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - name: Report credential availability without values
        run: |
          python - <<'PY'
          import os
          names = (
              "SUPABASE_ACCESS_TOKEN",
              "SUPABASE_DB_PASSWORD",
              "SUPABASE_PROJECT_REF",
              "SUPABASE_DB_URL",
              "DATABASE_URL",
              "SPORTMONKS_API_KEY",
              "RAPIDAPI_KEY",
          )
          for name in names:
              state = "PRESENT" if os.getenv(name) else "MISSING"
              print(f"{name}={state}")
          PY
      - name: Inspect read-only PostgREST RPC surface
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.getenv("SUPABASE_URL", "").rstrip("/") + "/rest/v1/"
          key = os.getenv("SUPABASE_KEY", "")
          if not url or not key:
              print("RPC_AUDIT=SKIPPED missing SUPABASE_URL/SUPABASE_KEY")
              raise SystemExit(0)
          request = urllib.request.Request(
              url,
              headers={
                  "apikey": key,
                  "Authorization": "Bearer " + key,
                  "Accept": "application/openapi+json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except Exception as exc:
              print(f"RPC_AUDIT=ERROR {type(exc).__name__}")
              raise SystemExit(0)

          paths = payload.get("paths") or {}
          rpc_names = sorted(
              path.removeprefix("/rpc/")
              for path in paths
              if path.startswith("/rpc/")
          )
          candidates = [
              name for name in rpc_names
              if any(token in name.lower() for token in ("sql", "exec", "query", "migrat", "ddl"))
          ]
          print(f"RPC_TOTAL={len(rpc_names)}")
          print("RPC_DDL_CANDIDATES=" + (",".join(candidates) if candidates else "NONE"))
          PY
