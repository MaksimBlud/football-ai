name: MARKET_ANCHOR V2 SportAPI Free Source Audit

on:
  pull_request:
    paths:
      - "research/SERIE_A_V2_SPORTAPI_FREE_SOURCE_AUDIT_20261128.md"
      - "research/source_rights/sportapi_ai_20261128.json"
      - "tests/test_serie_a_v2_sportapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-sportapi-source-audit.yml"
  push:
    branches:
      - research/v2-sportapi-free-source-audit-20261128-run11
    paths:
      - "research/SERIE_A_V2_SPORTAPI_FREE_SOURCE_AUDIT_20261128.md"
      - "research/source_rights/sportapi_ai_20261128.json"
      - "tests/test_serie_a_v2_sportapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-sportapi-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12"
      - name: Install pinned offline test runner
        run: python -m pip install pytest==8.4.2
      - name: Run offline rights and frozen-feature coverage tests
        run: python -m pytest -q tests/test_serie_a_v2_sportapi_source_audit.py
