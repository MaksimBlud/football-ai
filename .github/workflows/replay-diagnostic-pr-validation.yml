name: Replay Diagnostic PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'replay_diagnostic_v1.py'
      - 'tests/test_replay_diagnostic_v1.py'
      - 'research/REPLAY_DIAGNOSTIC_V1.md'
      - '.github/workflows/replay-diagnostic-pr-validation.yml'

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile replay contract
        run: python -m py_compile replay_diagnostic_v1.py

      - name: Run replay regression tests
        run: python -m pytest -q tests/test_replay_diagnostic_v1.py

      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
