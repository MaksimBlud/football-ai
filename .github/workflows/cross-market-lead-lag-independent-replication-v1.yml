name: Cross-Market Lead-Lag Independent Replication V1

on:
  push:
    branches:
      - research/market-lead-lag-v1-20261004
    paths:
      - 'cross_market_lead_lag_independent_replication_v1.py'
      - 'cross_market_lead_lag_independent_replication_transport.py'
      - 'tests/test_cross_market_lead_lag_independent_replication_v1.py'
      - 'research/CROSS_MARKET_LEAD_LAG_INDEPENDENT_REPLICATION_V1.md'
      - 'research/CROSS_MARKET_LEAD_LAG_INDEPENDENT_REPLICATION_V1_RESULTS.md'
      - 'experiments/cross_market_lead_lag_independent_replication_v1_report.json'
      - '.github/workflows/cross-market-lead-lag-independent-replication-v1.yml'
  pull_request:
    paths:
      - 'cross_market_lead_lag_independent_replication_v1.py'
      - 'cross_market_lead_lag_independent_replication_transport.py'
      - 'tests/test_cross_market_lead_lag_independent_replication_v1.py'
      - 'research/CROSS_MARKET_LEAD_LAG_INDEPENDENT_REPLICATION_V1.md'
      - 'research/CROSS_MARKET_LEAD_LAG_INDEPENDENT_REPLICATION_V1_RESULTS.md'
      - 'experiments/cross_market_lead_lag_independent_replication_v1_report.json'
      - '.github/workflows/cross-market-lead-lag-independent-replication-v1.yml'

permissions:
  contents: read

concurrency:
  group: cross-market-lead-lag-independent-replication-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'scipy==1.18.1' 'scikit-learn==1.7.2' 'requests==2.32.5' pytest
      - name: Compile research code
        run: python -m py_compile cross_market_lead_lag_independent_replication_v1.py cross_market_lead_lag_independent_replication_transport.py
      - name: Run frozen contract tests
        run: pytest -q tests/test_cross_market_lead_lag_independent_replication_v1.py
      - name: Production artifact diff guard
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  independent-replication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/market-lead-lag-v1-20261004'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'scipy==1.18.1' 'scikit-learn==1.7.2' 'requests==2.32.5'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run preregistered independent replication
        run: python cross_market_lead_lag_independent_replication_transport.py
      - name: Assert frozen research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  'artifacts/cross_market_lead_lag_independent_replication_v1/report.json'
              ).read_text()
          )
          assert report['experiment_id'] == 'CROSS_MARKET_LEAD_LAG_INDEPENDENT_REPLICATION_V1'
          assert report['parent_experiment_id'] == 'CROSS_MARKET_LEAD_LAG_V1'
          assert report['research_only'] is True
          assert report['betting_enabled'] is False
          assert report['production_promotion'] is False
          assert report['match_outcomes_used'] is False
          assert report['opened_2026_27_data_used'] is False
          assert report['paid_odds_api_calls'] == 0
          assert report['supabase_reads'] == 0
          assert report['supabase_writes'] == 0
          assert report['same_bookmaker'] == 'BET365'
          assert report['replication_leagues'] == ['BUNDESLIGA', 'LIGUE_1']
          assert report['primary_statistic'] == 'alignment_dot'
          assert report['result'] == 'NO_BET'
          print('reference=', report['reference_feature_only'])
          print('validation=', report['validation'])
          print('validation_admissible=', report['validation_admissible'])
          print('test=', report['test'])
          print('test_gate=', report['test_gate'])
          print('decision=', report['decision'])
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-market-lead-lag-independent-replication-v1-${{ github.run_id }}
          path: artifacts/cross_market_lead_lag_independent_replication_v1/report.json
          if-no-files-found: error
          retention-days: 90
