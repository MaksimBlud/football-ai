name: Market Anchor 1X2 V2 Shadow Validation

on:
  pull_request:
    paths:
      - "market_anchor_1x2_v2_shadow.py"
      - "experiments/market_anchor_1x2_v2_protocol.json"
      - "tests/test_market_anchor_1x2_v2_shadow.py"
      - "tests/test_market_anchor_1x2_v2_shadow_workflow_security.py"
      - "PROJECT_CONTINUITY.md"
      - ".github/workflows/market-anchor-1x2-v2-shadow-validation.yml"
      - "market_anchor_1x2_v1.py"
      - "historical_football_signal_lab.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy pandas scipy scikit-learn requests pytest
      - name: Compile frozen V2 contract
        run: python -m py_compile market_anchor_1x2_v2_shadow.py tests/test_market_anchor_1x2_v2_shadow.py
      - name: Run V2 regression and workflow security tests
        run: pytest -q tests/test_market_anchor_1x2_v2_shadow.py tests/test_market_anchor_1x2_v2_shadow_workflow_security.py
      - name: Assert no production model artifact changed
        shell: bash
        run: |
          # fetch-depth: 0 already populated origin/main; avoid network after credentials are removed.
          changed="$(git diff --name-only origin/main...HEAD -- '*.pkl')"
          if [ -n "$changed" ]; then
            echo "Production/model pickle changes are forbidden in this research block:"
            echo "$changed"
            exit 1
          fi
