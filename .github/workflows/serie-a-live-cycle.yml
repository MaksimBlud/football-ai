name: Serie A Live Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "42 */2 * * *"

concurrency:
  group: serie-a-live-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("SUPABASE_URL", "SUPABASE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Serie A live-cycle secrets: " + ", ".join(missing))
          print("PASS: Serie A live-cycle secrets available; values not printed")
          PY
      - name: Verify Serie A MARKET_ONLY safety
        run: |
          python - <<'PY'
          from serie_a_runtime_config import SERIE_A_RUNTIME_CONFIG
          s = SERIE_A_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: Serie A remains MARKET_ONLY")
          PY
      - name: Run durable Serie A live cycle
        run: python serie_a_live_cycle.py
