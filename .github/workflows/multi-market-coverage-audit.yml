name: Multi-Market Coverage Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pytest python-dotenv
      - name: Focused tests
        run: pytest -q test_multi_market_odds.py test_multi_market_card.py
      - name: Protect provider hard reserve
        # Current audit worst case: 9 leagues * (3 featured + 4 event markets) = 63 credits.
        run: python odds_api_budget_guard.py --max-cost 63
      - name: Live read-only coverage and normalization audit
        run: python audit_multi_market_coverage.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-coverage
          path: artifacts/multi_market_coverage.json
