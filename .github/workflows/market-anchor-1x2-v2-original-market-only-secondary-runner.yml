name: Original V2 Market-Only Secondary Runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - research/v2-original-market-only-secondary-eval-20261106-run11
    paths:
      - "market_anchor_1x2_v2_original_market_only_runner.py"
      - "tests/test_market_anchor_1x2_v2_original_market_only_runner.py"
      - "tests/test_market_anchor_1x2_v2_original_market_only_runner_workflow.py"
      - "research/MARKET_ANCHOR_1X2_V2_ORIGINAL_MARKET_ONLY_SECONDARY_RUNNER_20261106.md"
      - ".github/workflows/market-anchor-1x2-v2-original-market-only-secondary-runner.yml"
  push:
    branches:
      - research/v2-original-market-only-runner-20261106-run11
    paths:
      - "market_anchor_1x2_v2_original_market_only_runner.py"
      - "tests/test_market_anchor_1x2_v2_original_market_only_runner.py"
      - "tests/test_market_anchor_1x2_v2_original_market_only_runner_workflow.py"
      - "research/MARKET_ANCHOR_1X2_V2_ORIGINAL_MARKET_ONLY_SECONDARY_RUNNER_20261106.md"
      - ".github/workflows/market-anchor-1x2-v2-original-market-only-secondary-runner.yml"

permissions:
  actions: read
  contents: read

jobs:
  offline-runner-tests:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only V2 test dependencies
        run: python -m pip install pandas numpy scipy scikit-learn requests supabase pytest
      - name: Compile and run runner/evaluator regressions
        run: |
          python -m py_compile market_anchor_1x2_v2_original_market_only_runner.py
          python -m pytest -q \
            tests/test_market_anchor_1x2_v2_original_market_only_runner.py \
            tests/test_market_anchor_1x2_v2_original_market_only_runner_workflow.py \
            tests/test_market_anchor_1x2_v2_original_market_only_evaluator.py

  live-read-only-runner:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only runner dependencies
        run: python -m pip install pandas numpy scipy scikit-learn requests supabase
      - name: Run original V2 secondary evaluator (manual, read-only, fail-closed)
        run: |
          python market_anchor_1x2_v2_original_market_only_runner.py \
            --output artifacts/market_anchor_v2_original_secondary_evaluation.json
      - name: Archive aggregate research report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-anchor-v2-original-secondary-evaluation
          path: artifacts/market_anchor_v2_original_secondary_evaluation.json
          if-no-files-found: warn
          retention-days: 90
