name: Serie A Results Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "2 */12 * * *"

concurrency:
  group: serie-a-results-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Serie A results secrets: " + ", ".join(missing))
          print("PASS: zero-cost Serie A results secrets available; values not printed")
          PY
      - name: Sync immutable Serie A finished results from Football-Data
        run: python update_football_data_results.py SERIE_A --write
      - name: Evaluate settled Serie A predictions
        run: python evaluate_serie_a_predictions.py
