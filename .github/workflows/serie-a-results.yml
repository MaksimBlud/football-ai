name: Serie A Results Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "2 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/serie-a-results.yml"
      - "update_serie_a_results.py"
      - "espn_current_results_fallback.py"
      - "test_espn_current_results_fallback.py"
      - "tests/test_serie_a_results_source_availability.py"

concurrency:
  group: serie-a-results-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests supabase python-dotenv pytest
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Serie A results secrets: " + ", ".join(missing))
          print("PASS: Serie A results Supabase secrets available; values not printed")
          PY
      - name: Compile provider-free results sync
        run: python -m py_compile update_serie_a_results.py espn_current_results_fallback.py
      - name: Run provider-free results regressions
        run: pytest -q tests/test_serie_a_results_source_availability.py test_espn_current_results_fallback.py
      - name: Sync immutable Serie A finished results from public sources
        run: python update_serie_a_results.py --write --status-json artifacts/serie_a_results_status.json
      - name: Verify explicit provider-free result status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('artifacts/serie_a_results_status.json')
          if not path.exists():
              raise SystemExit('missing Serie A results status artifact')
          p=json.loads(path.read_text())
          assert p['league']=='SERIE_A'
          assert p['paid_provider_requests']==0
          assert p['status'] in {'WRITTEN','SOURCE_UNAVAILABLE'}
          if p['status']=='SOURCE_UNAVAILABLE':
              assert p['fallback_used'] is True
              assert int(p['primary_public_http_requests'])==3
              assert 1 <= int(p['fallback_public_http_requests']) <= 3
              assert int(p['inserted'])==0
              assert int(p['conflicts'])==0
          if p['status']=='WRITTEN':
              assert int(p['conflicts'])==0
              if p['fallback_used']:
                  assert p['source_provider']=='ESPN_SCOREBOARD_FALLBACK'
                  assert int(p['primary_public_http_requests'])==3
                  assert 1 <= int(p['fallback_public_http_requests']) <= 3
              else:
                  assert p['source_provider']=='FOOTBALL_DATA_CSV'
                  assert int(p['fallback_public_http_requests'])==0
          print('status=',p['status'])
          print('source_provider=',p.get('source_provider'))
          print('fallback_used=',p.get('fallback_used'))
          print('public_http_requests=',p.get('public_http_requests'))
          print('inserted=',p.get('inserted'))
          print('unchanged=',p.get('unchanged'))
          print('conflicts=',p.get('conflicts'))
          PY
      - name: Evaluate settled Serie A predictions only after successful result sync
        if: success()
        run: |
          status="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('artifacts/serie_a_results_status.json').read_text())['status'])
          PY
          )"
          if [ "$status" != "WRITTEN" ]; then
            echo "SKIP evaluator: result status=$status"
            exit 0
          fi
          python evaluate_serie_a_predictions.py
      - name: Upload public results status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-results-status
          path: artifacts/serie_a_results_status.json
          if-no-files-found: error
