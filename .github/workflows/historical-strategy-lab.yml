name: Historical Strategy Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Record production artifact hashes
        run: |
          find . -maxdepth 1 -name '*.pkl' -print0 | sort -z | xargs -0 sha256sum > /tmp/pkl-before.sha256
          cat /tmp/pkl-before.sha256

      - name: Run EPL and La Liga historical strategy lab
        run: |
          python historical_strategy_runner.py \
            --leagues EPL LA_LIGA \
            --work-dir artifacts/historical_strategy_work \
            --output-dir artifacts/historical_strategy_lab

      - name: Verify production artifacts unchanged
        run: |
          find . -maxdepth 1 -name '*.pkl' -print0 | sort -z | xargs -0 sha256sum > /tmp/pkl-after.sha256
          diff -u /tmp/pkl-before.sha256 /tmp/pkl-after.sha256
          echo "PASS: production .pkl hashes unchanged"

      - name: Show historical summary
        run: |
          echo "Overall"
          cat artifacts/historical_strategy_lab/overall.csv
          echo "League-season"
          cat artifacts/historical_strategy_lab/league_season.csv
          echo "Confidence buckets"
          cat artifacts/historical_strategy_lab/confidence_buckets.csv
          echo "Odds buckets"
          cat artifacts/historical_strategy_lab/odds_buckets.csv

      - name: Upload historical strategy artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-strategy-lab-${{ github.run_number }}
          path: |
            artifacts/historical_strategy_lab/*.csv
            artifacts/historical_strategy_work/normalized/*.csv
          if-no-files-found: error
          retention-days: 30
