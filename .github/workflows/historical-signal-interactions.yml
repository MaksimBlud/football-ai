name: Historical Signal Interactions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'historical_signal_interactions.py'
      - 'historical_signal_interactions_runner.py'
      - 'historical_team_strength_trajectory.py'
      - 'historical_shot_quality_profile.py'
      - 'historical_football_signal_runner.py'
      - 'tests/test_historical_signal_interactions.py'
      - 'tests/test_historical_team_strength_trajectory.py'
      - 'tests/test_historical_shot_quality_profile.py'
      - '.github/workflows/historical-signal-interactions.yml'
  pull_request:
    paths:
      - 'historical_signal_interactions.py'
      - 'historical_signal_interactions_runner.py'
      - 'historical_team_strength_trajectory.py'
      - 'historical_shot_quality_profile.py'
      - 'historical_football_signal_runner.py'
      - 'tests/test_historical_signal_interactions.py'
      - 'tests/test_historical_team_strength_trajectory.py'
      - 'tests/test_historical_shot_quality_profile.py'
      - '.github/workflows/historical-signal-interactions.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run interaction and dependency regressions
        run: pytest -q tests/test_historical_signal_interactions.py tests/test_historical_team_strength_trajectory.py tests/test_historical_shot_quality_profile.py
      - name: Run fixed interaction research
        run: python historical_signal_interactions_runner.py
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: historical-signal-interactions
          path: artifacts/historical_signal_interactions/
          retention-days: 30
