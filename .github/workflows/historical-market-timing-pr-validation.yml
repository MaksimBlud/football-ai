name: Historical Market Timing PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - historical_market_timing_audit.py
      - tests/test_historical_market_timing_audit.py
      - .github/workflows/historical-strategy-lab.yml
      - .github/workflows/historical-market-timing-pr-validation.yml

permissions:
  contents: read

jobs:
  timing-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas
      - run: python -m py_compile historical_market_timing_audit.py
      - run: python -m pytest -q tests/test_historical_market_timing_audit.py
      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
