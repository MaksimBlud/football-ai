name: Corner Regime-Adjusted Direction V2B

on:
  pull_request:
    paths:
      - 'corner_regime_adjusted_direction_v2b.py'
      - 'corner_regime_adjusted_direction_v2b_lock.py'
      - 'tests/test_corner_regime_adjusted_direction_v2b.py'
      - 'research/CORNER_REGIME_ADJUSTED_DIRECTION_V2B.md'
      - '.github/workflows/corner-regime-adjusted-direction-v2b.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2 pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Compile V2B modules
        run: |
          python -m py_compile corner_regime_adjusted_direction_v2b.py
          python -m py_compile corner_regime_adjusted_direction_v2b_lock.py
      - name: Run V2B regression tests
        run: |
          pytest -q             tests/test_corner_regime_adjusted_direction_v2b.py             tests/test_corner_regime_adjusted_direction_v2.py             tests/test_corner_regime_adjusted_direction_v1.py
      - name: Assert V2B operational/statistical gates
        run: |
          python - <<'PY'
          import corner_regime_adjusted_direction_v2 as v2
          import corner_regime_adjusted_direction_v2b as v2b
          assert v2b.EXPERIMENT_ID == 'CORNER_REGIME_ADJUSTED_DIRECTION_V2B'
          assert v2b.MIN_BLOCKS_PER_LEAGUE == 2
          assert v2b.MIN_TOTAL_BLOCKS == 10
          assert v2b.MIN_METADATA_POTENTIAL_PAIRS == 74
          assert v2.MIN_TOTAL_BLOCKS == 12
          assert v2.MIN_METADATA_POTENTIAL_PAIRS == 80
          assert v2b.MIN_COMPARABLE_PAIRS == v2.MIN_COMPARABLE_PAIRS == 40
          assert v2b.MIN_CONCORDANCE == v2.MIN_CONCORDANCE == 0.60
          assert v2b.PERMUTATIONS == v2.PERMUTATIONS == 20_000
          assert v2b.PERMUTATION_SEED == v2.PERMUTATION_SEED == 20_260_918
          assert v2b.MAX_PVALUE == v2.MAX_PVALUE == 0.10
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
