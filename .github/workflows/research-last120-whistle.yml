name: Research Last 120 Seconds 2026-27
on:
  push:
    branches:
      - research/last120-whistle-20261015
    paths:
      - .github/workflows/research-last120-whistle.yml
      - research/last120_20261015/audit.py
      - research/last120_20261015/opta_probe.py
      - research/last120_20261015/whistle_probe.py
      - research/last120_20261015/full_opta_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector
        run: python3 -m py_compile research/last120_20261015/audit.py
      - name: Fetch and classify last 120 seconds (read only)
        run: python3 -u research/last120_20261015/audit.py
      - name: Probe public Opta event-second dataset
        run: |
          python3 -m pip install -q pyarrow==21.0.0
          python3 -u research/last120_20261015/opta_probe.py
      - name: Check final whistle and goal seconds from same Opta provider
        run: python3 -u research/last120_20261015/whistle_probe.py
      - name: Replay all matches with single-source Opta clocks
        run: python3 -u research/last120_20261015/full_opta_audit.py
      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last120-202627-evidence
          path: |
            research/last120_20261015/summary.json
            research/last120_20261015/matches.json
            research/last120_20261015/opta_resolution.json
            research/last120_20261015/combined_matches.json
            research/last120_20261015/combined_summary.json
            research/last120_20261015/same_provider_whistle.json
            research/last120_20261015/final_matches.json
            research/last120_20261015/all_opta_matches.json
            research/last120_20261015/all_opta_summary.json
          if-no-files-found: warn
          retention-days: 7
