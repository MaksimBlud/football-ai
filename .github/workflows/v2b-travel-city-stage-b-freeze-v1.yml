name: V2B Travel-City Stage-B Freeze V1

on:
  push:
    branches:
      - research/v2b-travel-city-stageb-freeze-v1
    paths:
      - 'v2b_travel_city_stage_b_freeze_v1.py'
      - 'tests/test_v2b_travel_city_stage_b_freeze_v1.py'
      - 'research/V2B_TRAVEL_CITY_STAGE_B_FREEZE_V1.md'
      - 'research/V2B_TRAVEL_CITY_STAGE_B_FREEZE_V1_RESULTS.md'
      - '.github/workflows/v2b-travel-city-stage-b-freeze-v1.yml'
  pull_request:
    paths:
      - 'v2b_travel_city_stage_b_freeze_v1.py'
      - 'tests/test_v2b_travel_city_stage_b_freeze_v1.py'
      - 'research/V2B_TRAVEL_CITY_STAGE_B_FREEZE_V1.md'
      - 'research/V2B_TRAVEL_CITY_STAGE_B_FREEZE_V1_RESULTS.md'
      - '.github/workflows/v2b-travel-city-stage-b-freeze-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: v2b-travel-city-stage-b-freeze-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Compile feature freeze
        run: python -m py_compile v2b_travel_city_stage_b_freeze_v1.py
      - name: Run feature-freeze regression tests
        run: pytest -q tests/test_v2b_travel_city_stage_b_freeze_v1.py
      - name: Production artifact diff guard
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  feature-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/v2b-travel-city-stageb-freeze-v1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable travel-city source artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11044402420/zip > /tmp/travel.zip
          echo "24eaa543e51f1d19ec34d5b348fa091b91d31e7eca2ceeac270338dbaab3ab04  /tmp/travel.zip" | sha256sum -c -
          mkdir -p /tmp/travel
          unzip -q /tmp/travel.zip -d /tmp/travel
          SOURCE=$(find /tmp/travel -name report.json -type f | head -n 1)
          test -n "$SOURCE"
          cp "$SOURCE" /tmp/travel_report.json
      - name: Freeze travel-city Stage B without market direction
        run: |
          python v2b_travel_city_stage_b_freeze_v1.py \
            --travel-report /tmp/travel_report.json \
            --output artifacts/v2b_travel_city_stage_b_freeze_v1/report.json
      - name: Assert feature-only safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_travel_city_stage_b_freeze_v1/report.json').read_text())
          assert r['experiment_id']=='V2B_TRAVEL_CITY_STAGE_B_FREEZE_V1'
          assert r['research_only'] is True
          assert r['feature_freeze_only'] is True
          assert r['primary_mapping_id']=='JOINT_TRAVEL_CITY_COHORT_MEDIAN_SIGN_V1'
          assert r['locked_fixture_count']==43
          assert r['team_side_count']==86
          assert r['stage_b_calls']=={'UP':21,'DOWN':21,'NO_CALL':1}
          assert abs(r['cohort_median_joint_travel_city_km']-600.4646884282998)<1e-9
          for key in (
              'market_rows_read','v2b_odds_read','opening_lambda_read',
              'fair_centre_read','centre_delta_read','direction_test_performed',
              'match_outcome_target_used','threshold_fitted_to_outcomes',
              'rest_feature_used','travel_rest_interaction_used',
              'league_specific_threshold_used'
          ):
              assert r[key] is False, key
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print('calls=',r['stage_b_calls'])
          print('median_joint_travel_km=',r['cohort_median_joint_travel_city_km'])
          print('eligible_fixture_sha256=',r['eligible_fixture_sha256'])
          print('frozen_feature_sha256=',r['frozen_feature_sha256'])
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-travel-city-stage-b-freeze-v1-${{ github.run_id }}
          path: artifacts/v2b_travel_city_stage_b_freeze_v1/report.json
          if-no-files-found: error
          retention-days: 90
