name: V2B Deep Stage-B Freeze V1

on:
  pull_request:
    paths:
      - 'v2b_deep_stage_b_freeze_v1.py'
      - 'tests/test_v2b_deep_stage_b_freeze_v1.py'
      - 'research/V2B_DEEP_STAGE_B_FREEZE_V1.md'
      - '.github/workflows/v2b-deep-stage-b-freeze-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: python -m py_compile v2b_deep_stage_b_freeze_v1.py
      - run: pytest -q tests/test_v2b_deep_stage_b_freeze_v1.py
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  zero-cost-feature-freeze:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable tactical feasibility artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10981596648/zip > /tmp/tactical.zip
          echo "e686e483e375b59484bb493904870f8942e1df70d4553ad5928596476d9054c5  /tmp/tactical.zip" | sha256sum -c -
          mkdir -p /tmp/tactical
          unzip -q /tmp/tactical.zip -d /tmp/tactical
          F=$(find /tmp/tactical -name v2b_understat_tactical_pressure5_feasibility_v1.json -type f | head -n1)
          test -n "$F"
          cp "$F" /tmp/tactical_feasibility.json
      - name: Freeze deep mapping without market outcomes
        run: |
          python v2b_deep_stage_b_freeze_v1.py \
            --feasibility-report /tmp/tactical_feasibility.json \
            --output artifacts/v2b_deep_stage_b_freeze_v1.json
      - name: Assert feature-only safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_deep_stage_b_freeze_v1.json').read_text())
          assert r['experiment_id']=='V2B_DEEP_STAGE_B_FREEZE_V1'
          assert r['primary_mapping_id']=='POOLED_2025_DEEP_ENVIRONMENT_SIGN_V1'
          assert r['eligible_fixture_count']==34
          assert r['ppda_used_in_primary_mapping'] is False
          assert r['baseline_summary']['season_start']==2025
          assert r['market_rows_read'] is False
          assert r['centre_delta_read'] is False
          assert r['direction_test_performed'] is False
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print(json.dumps({
            'baseline':r['baseline_summary']['pooled_total_deep_environment'],
            'calls':r['stage_b_calls'],
            'cohort_hash':r['eligible_fixture_sha256'],
            'feature_hash':r['frozen_feature_sha256'],
          },indent=2,sort_keys=True))
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-deep-stage-b-freeze-v1
          path: artifacts/v2b_deep_stage_b_freeze_v1.json
          if-no-files-found: error
          retention-days: 90
