name: Ligue 1 PR Validation
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact 40-character branch head for autonomous draft PR CI'
        required: true
        type: string
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ligue1-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ligue1-pr-placeholder
    steps:
      - name: Require exact head SHA for bot draft validation
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          ACTION_HEAD: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ || "$EXPECTED_HEAD" != "$ACTION_HEAD" ]]; then
            echo 'FAIL_CLOSED: expected PR head does not match workflow_dispatch SHA'
            exit 1
          fi
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pytest numpy pandas requests supabase python-dotenv
      - name: Compile Ligue 1 modules
        run: |
          python -m py_compile ligue1_runtime_config.py save_ligue1_odds_snapshot.py export_ligue1_upcoming_matches.py generate_ligue1_market_shadow.py persist_ligue1_market_observations.py persist_ligue1_prediction_ledger.py ligue1_live_cycle.py scheduled_ligue1_odds_snapshot.py ligue1_scores_service.py update_ligue1_results.py evaluate_ligue1_predictions.py
      - name: Run Ligue 1 operational and result-source regressions
        run: python -m pytest -q tests/test_ligue1_operational.py tests/test_ligue1_results_source_unavailable.py tests/test_ligue1_results_workflow_contract.py
      - run: python -m pytest -q tests/test_league_prediction_ledger.py tests/test_evaluate_league_predictions.py
      - name: Enforce no production artifact changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
