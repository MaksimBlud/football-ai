name: Serie A Odds Snapshots

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/serie-a-odds-snapshots.yml"
      - "tests/test_serie_a_v2_manual_quote_trigger_contract.py"

env:
  THE_ODDS_API_ACCESS_ALLOWED: "false"

concurrency:
  group: serie-a-odds-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase python-dotenv pytest==9.2.0
      - name: Validate manual quote trigger and paid access hold
        run: python -m pytest -q tests/test_serie_a_v2_manual_quote_trigger_contract.py
      - name: Verify Serie A MARKET_ONLY safety
        run: |
          python - <<'PY'
          from serie_a_runtime_config import SERIE_A_RUNTIME_CONFIG
          s = SERIE_A_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: Serie A remains MARKET_ONLY")
          PY
      - name: Confirm paid provider access is held
        if: \${{ env.THE_ODDS_API_ACCESS_ALLOWED != 'true' }}
        run: echo "HOLD: no The Odds API quota preflight, odds request, or Supabase snapshot write is permitted"
      - name: Check required secrets
        if: \${{ env.THE_ODDS_API_ACCESS_ALLOWED == 'true' }}
        env:
          THE_ODDS_API_KEY: \${{ secrets.THE_ODDS_API_KEY }}
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: \${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          required = ("THE_ODDS_API_KEY", "SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Serie A snapshot secrets: " + ", ".join(missing))
          print("PASS: Serie A snapshot secrets available; values not printed")
          PY
      - name: Protect provider hard reserve
        if: \${{ env.THE_ODDS_API_ACCESS_ALLOWED == 'true' }}
        env:
          THE_ODDS_API_KEY: \${{ secrets.THE_ODDS_API_KEY }}
        run: python odds_api_budget_guard.py --max-cost 1
      - name: Run adaptive Serie A snapshot check
        if: \${{ env.THE_ODDS_API_ACCESS_ALLOWED == 'true' }}
        env:
          THE_ODDS_API_KEY: \${{ secrets.THE_ODDS_API_KEY }}
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: \${{ secrets.SUPABASE_KEY }}
        run: python scheduled_serie_a_odds_snapshot.py
