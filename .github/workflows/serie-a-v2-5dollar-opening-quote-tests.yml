name: Serie A V2 5Dollar Opening Quote Adapter Tests

on:
  push:
    branches:
      - "research/v2-5dollar-opening-quote-*"
    paths:
      - "serie_a_v2_5dollar_opening_quote_adapter.py"
      - "serie_a_v2_5dollar_source_adapter.py"
      - "serie_a_v2_asof_feature_manifest.py"
      - "serie_a_v2_frozen_shadow_preview.py"
      - "historical_football_signal_lab.py"
      - "market_anchor_1x2_v1.py"
      - "tests/test_serie_a_v2_asof_feature_manifest.py"
      - ".github/workflows/serie-a-v2-5dollar-opening-quote-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "serie_a_v2_5dollar_opening_quote_adapter.py"
      - "serie_a_v2_5dollar_source_adapter.py"
      - "serie_a_v2_asof_feature_manifest.py"
      - "serie_a_v2_asof_feature_manifest.py"
      - "serie_a_v2_frozen_shadow_preview.py"
      - "historical_football_signal_lab.py"
      - "market_anchor_1x2_v1.py"
      - "tests/test_serie_a_v2_asof_feature_manifest.py"
      - ".github/workflows/serie-a-v2-5dollar-opening-quote-tests.yml"

permissions:
  contents: read

jobs:
  offline-opening-quote-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy scikit-learn requests supabase
      - name: Compile original V2 and private source adapters
        run: |
          python -m py_compile serie_a_v2_5dollar_source_adapter.py
          python -m py_compile serie_a_v2_5dollar_opening_quote_adapter.py
          python -m py_compile serie_a_v2_asof_feature_manifest.py
          python -m py_compile serie_a_v2_frozen_shadow_preview.py
          python -m py_compile historical_football_signal_lab.py
          python -m py_compile market_anchor_1x2_v1.py
      - name: Run synthetic-only source and opening quote regressions
        run: |
          python -m pytest -q tests/test_serie_a_v2_asof_feature_manifest.py
      - name: Verify production artifacts remain untouched
        run: |
          git diff --exit-code origin/main...HEAD -- '*.pkl'
