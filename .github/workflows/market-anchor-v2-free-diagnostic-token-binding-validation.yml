name: Original V2 Free-Diagnostic Rights Token Validation

on:
  push:
    branches:
      - research/v2-free-diagnostic-token-binding-restacked-on-911-20261121-run11
    paths:
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - "serie_a_v2_live_diagnostic_report.py"
      - "market_anchor_v2_direct_access.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "tests/test_serie_a_v2_live_diagnostic_report.py"
      - "tests/test_serie_a_v2_original_diagnostic_direct_access.py"
      - "tests/test_market_anchor_v2_source_capture_rights.py"
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/market-anchor-v2-free-diagnostic-token-binding-validation.yml"
  pull_request:
    branches:
      - research/v2-original-v2-rights-chain-restacked-on-887-20261121-run11
    paths:
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - "serie_a_v2_live_diagnostic_report.py"
      - "market_anchor_v2_direct_access.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "tests/test_serie_a_v2_live_diagnostic_report.py"
      - "tests/test_serie_a_v2_original_diagnostic_direct_access.py"
      - "tests/test_market_anchor_v2_source_capture_rights.py"
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/market-anchor-v2-free-diagnostic-token-binding-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-free-diagnostic-token-binding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0 numpy pandas scipy scikit-learn requests supabase python-dotenv
          python -m pip check
      - name: Compile original V2 rights-gated diagnostic path
        run: |
          python -m py_compile \
            market_anchor_v2_direct_access.py \
            market_anchor_v2_source_capture_rights.py \
            market_anchor_v2_artifact_privacy.py \
            serie_a_v2_live_diagnostic_report.py
      - name: Run source-rights, direct-entrypoint, and workflow credential regressions
        run: |
          python -m pytest -q \
            tests/test_serie_a_v2_live_diagnostic_report.py \
            tests/test_serie_a_v2_frozen_shadow_preview.py \
            tests/test_serie_a_v2_original_diagnostic_direct_access.py \
            tests/test_market_anchor_v2_source_capture_rights.py \
            tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Guard production model binaries
        env:
          BASE_REF: ${{ github.base_ref || 'research/v2-original-v2-rights-chain-restacked-on-887-20261121-run11' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE_COMMIT="$(git merge-base "refs/remotes/origin/${BASE_REF}" HEAD)"
          git diff --exit-code "$BASE_COMMIT" HEAD -- '*.pkl'
