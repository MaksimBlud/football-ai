name: Product PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile product contract
        run: python -m py_compile product_markets.py

      - name: Run product contract tests
        run: python -m pytest -q tests/test_product_markets.py

      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
