name: Product PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile product modules
        run: |
          python -m py_compile product_decision.py
          python -m py_compile product_markets.py
          python -m py_compile product_web.py
          python -m py_compile product_snapshot_store.py
          python -m py_compile publish_product_predictions.py
          python -m py_compile bootstrap_product_predictions_from_pair_ledger.py
          python -m py_compile web_app.py

      - name: Validate web deployment config
        run: |
          python - <<'PY'
          import json
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              pyproject = tomllib.load(handle)
          assert pyproject["tool"]["vercel"]["entrypoint"] == "web_app:app"

          with open("vercel.json", encoding="utf-8") as handle:
              vercel = json.load(handle)
          assert "web_app.py" in vercel["functions"]
          PY

      - name: Validate immutable Supabase snapshot migration
        run: |
          python - <<'PY'
          from pathlib import Path

          sql = Path(
              "supabase/migrations/20260912071500_create_product_prediction_snapshots.sql"
          ).read_text(encoding="utf-8").lower()
          assert "create table if not exists public.product_prediction_snapshots" in sql
          assert "enable row level security" in sql
          assert "for insert" in sql
          assert "for select" in sql
          assert "for update" not in sql
          assert "for delete" not in sql
          PY

      - name: Validate public product read boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          sql = Path(
              "supabase/migrations/20260912091500_public_product_read_window.sql"
          ).read_text(encoding="utf-8").lower()
          assert "revoke all privileges" in sql
          assert "grant select (" in sql
          assert "to anon" in sql
          assert "for select" in sql
          assert "grant insert" not in sql
          assert "grant update" not in sql
          assert "grant delete" not in sql
          PY

      - name: Run product tests
        run: |
          python -m pytest -q tests/test_product_decision.py
          python -m pytest -q tests/test_product_markets.py
          python -m pytest -q tests/test_product_web.py
          python -m pytest -q tests/test_product_ui_contract.py
          python -m pytest -q tests/test_product_snapshot_store.py
          python -m pytest -q tests/test_publish_product_predictions.py
          python -m pytest -q tests/test_deployment_readiness.py
          python -m pytest -q tests/test_live_product_pipeline.py

      - name: Enforce no production artifact changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"
