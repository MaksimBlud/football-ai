name: RPL Operational Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pandas numpy supabase python-dotenv
      - name: Verify current durable RPL state without writes
        run: |
          python - <<'PY'
          from database import supabase
          for table in (
              "odds_snapshots",
              "league_structural_v2_observations",
              "league_prediction_ledger",
              "league_finished_results",
          ):
              r = supabase.table(table).select("*", count="exact").eq("league", "RPL").limit(1).execute()
              print(table, int(r.count or 0))
          PY
      - name: Read-only RPL evaluation
        run: python evaluate_rpl_predictions.py
