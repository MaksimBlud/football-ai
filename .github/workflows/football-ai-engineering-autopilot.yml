name: Football AI Engineering Checkpoint (No API)

# This GitHub job is a deterministic source-of-truth heartbeat, NOT an AI coder.
# ChatGPT works separately through its connected GitHub tools or scheduled tasks.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      role:
        type: choice
        required: true
        default: both
        options: [frontend, backend, both]
  pull_request:
    paths:
      - '.github/workflows/football-ai-engineering-autopilot.yml'
      - 'engineering_autopilot_guard.py'
      - 'tests/test_engineering_autopilot_guard.py'
      - 'tests/test_engineering_autopilot_workflow.py'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pyyaml
      - run: PYTHONPATH=. python -m pytest -q tests/test_engineering_autopilot_guard.py tests/test_engineering_autopilot_workflow.py
      - run: python -m py_compile engineering_autopilot_guard.py

  checkpoint:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: football-ai-engineering-checkpoint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and protected guard without third-party AI
        run: |
          set -euo pipefail
          python -m py_compile engineering_autopilot_guard.py
          git diff --check
          echo "## Football AI / no-API engineering checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- External AI calls: 0 (no model invoked)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code modifications: 0 (read-only checkpoint)" >> "$GITHUB_STEP_SUMMARY"
          echo "- This check is **not** proof of autonomous coding." >> "$GITHUB_STEP_SUMMARY"
      - name: Read open engineering tasks and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE_FILTER: ${{ inputs.role || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          for entry in frontend:582 backend:581; do
            ROLE="${entry%%:*}"
            ISSUE="${entry##*:}"
            if [[ "$ROLE_FILTER" != both && "$ROLE_FILTER" != "$ROLE" ]]; then
              continue
            fi
            DATA=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,state,url)
            STATE=$(jq -r '.state' <<< "$DATA")
            TITLE=$(jq -r '.title' <<< "$DATA")
            URL=$(jq -r '.url' <<< "$DATA")
            echo "- $ROLE: [$TITLE]($URL) — $STATE" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '### Open pull requests (read-only)' >> "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 15 --json number,title,url --jq '.[] | "- [#\(.number) \(.title)](\(.url))"' >> "$GITHUB_STEP_SUMMARY"
          echo "CHECKPOINT_COMPLETED — see GitHub job summary. No AI/paid API calls were made."
