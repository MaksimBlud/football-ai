name: RPL Results Sync

on:
  workflow_dispatch:

concurrency:
  group: rpl-results-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("THE_ODDS_API_KEY", "SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing RPL results secrets: " + ", ".join(missing))
          print("PASS: RPL results secrets available; values not printed")
          PY
      - name: Sync immutable RPL finished results
        run: python update_rpl_results.py --write
      - name: Evaluate settled RPL predictions
        run: python evaluate_rpl_predictions.py
