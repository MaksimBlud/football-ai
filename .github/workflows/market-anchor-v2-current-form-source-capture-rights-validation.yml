name: Original V2 Current-Form Source-Capture Rights Validation

on:
  push:
    branches:
      - research/v2-current-form-source-capture-rights-on-951-20261124-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "market_anchor_1x2_v2_shadow.py"
      - "market_anchor_v2_direct_access.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "research/source_rights/football_data_co_uk.json"
      - "experiments/market_anchor_1x2_v2_protocol.json"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_asof_feature_manifest.py"
      - "tests/test_serie_a_v2_atalanta_alias.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/market-anchor-v2-current-form-source-capture-rights-validation.yml"
  pull_request:
    branches:
      - research/v2-original-forward-persisted-quote-row-gate-on-950-20261124-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "market_anchor_1x2_v2_shadow.py"
      - "market_anchor_v2_direct_access.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "research/source_rights/football_data_co_uk.json"
      - "experiments/market_anchor_1x2_v2_protocol.json"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_asof_feature_manifest.py"
      - "tests/test_serie_a_v2_atalanta_alias.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/market-anchor-v2-current-form-source-capture-rights-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-current-form-source-capture-rights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0 numpy pandas scipy scikit-learn requests supabase python-dotenv
          python -m pip check
      - name: Compile original current-form V2 source-capture rights path
        run: |
          python -m py_compile \
            market_anchor_v2_direct_access.py \
            market_anchor_v2_source_capture_rights.py \
            market_anchor_v2_artifact_privacy.py \
            serie_a_v2_current_form_source_capture.py
      - name: Run current-form and frozen V2 regressions
        run: |
          python -m pytest -q \
            tests/test_serie_a_v2_current_form_source_capture.py \
            tests/test_serie_a_v2_asof_feature_manifest.py \
            tests/test_serie_a_v2_atalanta_alias.py \
            tests/test_serie_a_v2_manual_quote_trigger_contract.py
      - name: Guard production model binaries
        env:
          BASE_REF: ${{ github.base_ref || 'research/v2-original-forward-persisted-quote-row-gate-on-950-20261124-run11' }}
        run: |
          set -euo pipefail
          BASE_COMMIT="$(git merge-base "refs/remotes/origin/${BASE_REF}" HEAD)"
          git diff --exit-code "$BASE_COMMIT" HEAD -- '*.pkl'
