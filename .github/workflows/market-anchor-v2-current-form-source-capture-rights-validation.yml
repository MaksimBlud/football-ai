name: Original V2 Current-Form Source-Capture Rights Validation

on:
  push:
    branches:
      - research/v2-current-form-source-capture-rights-on-891-20261121-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/market-anchor-v2-current-form-source-capture-rights-validation.yml"
  pull_request:
    branches:
      - research/v2-original-diagnostic-direct-access-guard-on-890-20261119-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/market-anchor-v2-current-form-source-capture-rights-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-current-form-source-capture-rights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0 numpy pandas scipy scikit-learn requests supabase python-dotenv
          python -m pip check
      - name: Compile original V2 source-capture rights path
        run: |
          python -m py_compile \
            market_anchor_v2_direct_access.py \
            market_anchor_v2_source_capture_rights.py \
            market_anchor_v2_artifact_privacy.py \
            serie_a_v2_current_form_source_capture.py
      - name: Run source rights, preregistered gate, and direct-entrypoint regressions
        run: |
          python -m pytest -q \
            tests/test_serie_a_v2_current_form_source_capture.py \
            tests/test_serie_a_v2_original_diagnostic_direct_access.py
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- '*.pkl'
