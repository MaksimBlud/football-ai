name: Eredivisie Results
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pandas numpy requests supabase python-dotenv
      - run: python update_eredivisie_results.py --write
      - run: python evaluate_eredivisie_predictions.py
