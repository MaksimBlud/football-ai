name: Bundesliga Operational Bootstrap
on:
  push:
    branches: [phase-bundesliga-operational-complete]
concurrency:
  group: bundesliga-operational-bootstrap
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pytest numpy pandas requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          missing=[x for x in ("SUPABASE_URL","SUPABASE_KEY","THE_ODDS_API_KEY") if not os.getenv(x)]
          if missing: raise SystemExit("Missing Bundesliga bootstrap secrets: "+", ".join(missing))
          print("PASS: required secrets available; values not printed")
          PY
      - name: Compile and test Bundesliga stack
        run: |
          python -m py_compile bundesliga_runtime_config.py save_bundesliga_odds_snapshot.py export_bundesliga_upcoming_matches.py generate_bundesliga_market_shadow.py persist_bundesliga_market_observations.py persist_bundesliga_prediction_ledger.py bundesliga_live_cycle.py scheduled_bundesliga_odds_snapshot.py bundesliga_scores_service.py update_bundesliga_results.py evaluate_bundesliga_predictions.py
          python -m pytest -q tests/test_bundesliga_operational.py
      - name: Verify MARKET_ONLY safety
        run: |
          python - <<'PY'
          from bundesliga_runtime_config import BUNDESLIGA_RUNTIME_CONFIG
          s=BUNDESLIGA_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status=="CALIBRATION_REQUIRED"
          assert s.structural_alpha is None and s.edge_threshold is None
          print("PASS: Bundesliga remains MARKET_ONLY")
          PY
      - name: Write first live Bundesliga odds snapshot
        run: python save_bundesliga_odds_snapshot.py
      - name: Run first durable Bundesliga live cycle
        run: python bundesliga_live_cycle.py
      - name: Replay durable Bundesliga live cycle
        run: python bundesliga_live_cycle.py
      - name: Sync current Bundesliga finished results
        run: python update_bundesliga_results.py --write
      - name: Evaluate current Bundesliga ledger
        run: python evaluate_bundesliga_predictions.py
      - name: Audit durable Bundesliga state
        run: |
          python - <<'PY'
          from database import supabase
          for table in ("odds_snapshots","league_structural_v2_observations","league_prediction_ledger","league_finished_results"):
              r=supabase.table(table).select("*",count="exact").eq("league","BUNDESLIGA").limit(3).execute()
              print(table,int(r.count or 0))
          PY
      - name: Enforce no production artifact changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes"
