name: Corner Regime-Adjusted Direction V2

on:
  pull_request:
    paths:
      - 'corner_regime_adjusted_direction_v2.py'
      - 'tests/test_corner_regime_adjusted_direction_v2.py'
      - 'research/CORNER_REGIME_ADJUSTED_DIRECTION_V2.md'
      - '.github/workflows/corner-regime-adjusted-direction-v2.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy scipy scikit-learn==1.7.2 pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Compile V2 planner
        run: python -m py_compile corner_regime_adjusted_direction_v2.py
      - name: Run V2 regression tests
        run: pytest -q tests/test_corner_regime_adjusted_direction_v2.py tests/test_corner_regime_adjusted_direction_v1.py
      - name: Assert future-only metadata contract
        run: |
          python - <<'PY'
          import corner_regime_adjusted_direction_v2 as v
          assert v.EXPERIMENT_ID == 'CORNER_REGIME_ADJUSTED_DIRECTION_V2'
          assert v.FUTURE_CUTOFF_UTC == '2026-09-19T00:00:00Z'
          assert v.MIN_BLOCKS_PER_LEAGUE == 2
          assert v.MIN_TOTAL_BLOCKS == 12
          assert v.MIN_METADATA_POTENTIAL_PAIRS == 80
          assert v.MIN_COMPARABLE_PAIRS == 40
          assert v.MIN_CONCORDANCE == 0.60
          assert v.PERMUTATIONS == 20_000
          assert v.PERMUTATION_SEED == 20_260_918
          assert v.MAX_PVALUE == 0.10
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
