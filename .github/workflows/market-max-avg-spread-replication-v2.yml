name: MARKET_MAX_AVG_SPREAD_REPLICATION_V2

on:
  push:
    branches:
      - research/market-max-avg-spread-replication-v2
    paths:
      - 'market_max_avg_spread_replication_v2.py'
      - 'tests/test_market_max_avg_spread_replication_v2.py'
      - 'market_max_avg_spread_replication_v2_freeze_guard.py'
      - 'tests/test_market_max_avg_spread_replication_v2_freeze_guard.py'
      - 'research/MARKET_MAX_AVG_SPREAD_REPLICATION_V2.md'
      - 'experiments/market_max_avg_spread_replication_v2_report.json'
      - '.github/workflows/market-max-avg-spread-replication-v2.yml'
  pull_request:
    paths:
      - 'market_max_avg_spread_replication_v2.py'
      - 'tests/test_market_max_avg_spread_replication_v2.py'
      - 'market_max_avg_spread_replication_v2_freeze_guard.py'
      - 'tests/test_market_max_avg_spread_replication_v2_freeze_guard.py'
      - 'research/MARKET_MAX_AVG_SPREAD_REPLICATION_V2.md'
      - 'experiments/market_max_avg_spread_replication_v2_report.json'
      - '.github/workflows/market-max-avg-spread-replication-v2.yml'

permissions:
  contents: read

concurrency:
  group: market-max-avg-spread-replication-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'requests==2.32.5' pytest
      - name: Compile research code
        run: python -m py_compile market_max_avg_spread_replication_v2.py
      - name: Run contract tests
        run: pytest -q tests/test_market_max_avg_spread_replication_v2.py
      - name: Production artifact diff guard
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  historical-replication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/market-max-avg-spread-replication-v2'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'requests==2.32.5'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run zero-cost external cross-league replication
        run: python market_max_avg_spread_replication_v2.py
      - name: Verify replication safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/market_max_avg_spread_replication_v2/report.json').read_text())
          assert r['experiment_id']=='MARKET_MAX_AVG_SPREAD_REPLICATION_V2'
          assert r['research_only'] is True
          assert r['production_promotion'] is False
          assert r['epl_outcomes_used_in_support_statistics'] is False
          assert r['paid_odds_api_calls'] is False
          assert r['supabase_reads'] is False
          assert r['supabase_writes'] is False
          assert r['candidate_artifact_saved'] is False
          assert 'EPL' not in r['leagues']
          assert '2026/2027' not in r['season_codes']
          print('eligible_leagues=',r['result']['eligible_leagues'])
          print('matched_cells=',r['result']['matched_cell_count'])
          print('signals_supported=',r['result']['signals_supported'])
          print('interpretation=',r['result']['interpretation'])
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-max-avg-spread-replication-v2-${{ github.run_id }}
          path: artifacts/market_max_avg_spread_replication_v2/report.json
          if-no-files-found: error
          retention-days: 90
