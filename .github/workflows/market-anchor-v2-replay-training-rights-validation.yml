name: Original V2 Replay and Training Rights Hold Validation

on:
  push:
    branches:
      - research/v2-replay-training-rights-restacked-on-913-20261121-run11
    paths:
      - "market_anchor_v2_saved_cohort_replay.py"
      - "market_anchor_v2_source_rights.py"
      - "tests/test_market_anchor_v2_saved_cohort_replay.py"
      - "tests/test_market_anchor_v2_training_rights.py"
      - ".github/workflows/market-anchor-v2-replay-training-rights-validation.yml"
  pull_request:
    branches:
      - research/v2-current-form-forward-source-before-quote-restacked-on-912-20261121-run11
    paths:
      - "market_anchor_v2_saved_cohort_replay.py"
      - "market_anchor_v2_source_rights.py"
      - "tests/test_market_anchor_v2_saved_cohort_replay.py"
      - "tests/test_market_anchor_v2_training_rights.py"
      - ".github/workflows/market-anchor-v2-replay-training-rights-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-replay-training-rights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0
          python -m pip check
      - name: Compile replay script and rights validator without importing target data
        run: |
          python -m py_compile market_anchor_v2_saved_cohort_replay.py market_anchor_v2_source_rights.py
      - name: Run outcome-blind static and synthetic-rights tests
        run: |
          python -m pytest -q \
            tests/test_market_anchor_v2_saved_cohort_replay.py \
            tests/test_market_anchor_v2_training_rights.py
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- '*.pkl'
