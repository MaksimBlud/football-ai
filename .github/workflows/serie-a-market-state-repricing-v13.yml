name: Serie A Market State Repricing V13
on:
 workflow_dispatch:
 pull_request:
  paths: ['serie_a_market_state_repricing_v13.py','tests/test_serie_a_market_state_repricing_v13.py','.github/workflows/serie-a-market-state-repricing-v13.yml']
permissions: {contents: read}
jobs:
 research:
  runs-on: ubuntu-latest
  env: {PYTHONPATH: .}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.11'}
   - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
   - run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
   - run: pytest -q tests/test_serie_a_market_state_repricing_v13.py
   - run: python serie_a_market_state_repricing_v13.py
   - run: |
       python - <<'PY'
       import json
       r=json.load(open('artifacts/serie_a_market_state_repricing_v13/report.json'))
       assert r['experiment_id']=='SERIE_A_MARKET_STATE_REPRICING_V13' and r['research_only'] and r['result']=='NO_BET'
       assert r['la_liga_parameters_transferred_without_tuning'] and not r['production_promotion'] and not r['betting_enabled'] and not r['match_outcome_used'] and not r['standard_is_labeled_opening']
       assert r['fold_count']>=3 and r['coverage']['paired_valid_rows']>0
       PY
   - run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
   - uses: actions/upload-artifact@v4
     with: {name: serie-a-market-state-repricing-v13, path: artifacts/serie_a_market_state_repricing_v13/report.json, retention-days: 30}
