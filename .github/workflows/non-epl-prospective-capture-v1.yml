name: Non-EPL Prospective Capture V1

on:
  pull_request:
    paths:
      - "prospective_league_capture.py"
      - "tests/test_prospective_league_capture.py"
      - "research/SERIE_A_LA_LIGA_PROSPECTIVE_CAPTURE_V1.md"
      - ".github/workflows/non-epl-prospective-capture-v1.yml"
  push:
    branches: [main]
    paths:
      - "prospective_league_capture.py"
      - "tests/test_prospective_league_capture.py"
      - "research/SERIE_A_LA_LIGA_PROSPECTIVE_CAPTURE_V1.md"
      - ".github/workflows/non-epl-prospective-capture-v1.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile capture tool
        run: python -m py_compile prospective_league_capture.py
      - name: Run fail-closed capture tests
        run: python -m pytest -q tests/test_prospective_league_capture.py
      - name: Prove no production artifacts changed
        run: |
          git diff --exit-code -- '*.pkl'
          test -z "$(git status --porcelain -- '*.pkl')"
