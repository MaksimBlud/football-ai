name: Original V2 PitchAPI Source Rights Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/source_rights/pitchapi.json"
      - "research/PITCHAPI_SOURCE_RIGHTS_AUDIT_20261125.md"
      - "tests/test_serie_a_v2_pitchapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-pitchapi-source-audit.yml"
  push:
    branches:
      - research/v2-pitchapi-source-rights-audit-20261125-run11
    paths:
      - "research/source_rights/pitchapi.json"
      - "research/PITCHAPI_SOURCE_RIGHTS_AUDIT_20261125.md"
      - "tests/test_serie_a_v2_pitchapi_source_audit.py"
      - ".github/workflows/market-anchor-v2-pitchapi-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-source-rights-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact source audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test runner
        run: python -m pip install pytest==9.2.0
      - name: Run PitchAPI HOLD and frozen V2 invariants
        run: python -m pytest -q tests/test_serie_a_v2_pitchapi_source_audit.py
