name: Smarkets Late No Goal Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/smarkets-late-no-goal-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Scan public Smarkets 2026-27 live archive
        run: |
          python - <<'PY'
          import concurrent.futures as cf
          import datetime as dt
          import gzip, json, re, urllib.request
          from collections import defaultdict, Counter
          from pathlib import Path

          OWNER="BTConomista"
          REPO="Polymarket-oracle"
          START="2026-08-15"
          END="2026-09-19"
          TOP5={"premier_league","la_liga","bundesliga","serie_a","ligue_1"}
          CORE={"1x2","risultato_esatto","ou25","ggng"}
          score_re=re.compile(r"^(\d+)\s*-\s*(\d+)$")

          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"football-ai-research"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          tree=get_json(f"https://api.github.com/repos/{OWNER}/{REPO}/git/trees/main?recursive=1")
          files=[]
          for x in tree.get("tree",[]):
              p=x.get("path","")
              if not (p.startswith("data/smarkets_live/") and p.endswith(".json.gz")):
                  continue
              name=p.rsplit("/",1)[-1]
              day=name[:10]
              if START <= day <= END:
                  files.append(p)
          print("archive_files=",len(files))

          def fetch(path):
              url=f"https://raw.githubusercontent.com/{OWNER}/{REPO}/main/{path}"
              req=urllib.request.Request(url,headers={"User-Agent":"football-ai-research"})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read()
                  return path,json.loads(gzip.decompress(raw).decode("utf-8")),None
              except Exception as e:
                  return path,None,f"{type(e).__name__}: {e}"

          event_rows=defaultdict(list)
          failures=[]
          with cf.ThreadPoolExecutor(max_workers=12) as ex:
              for path,obj,err in ex.map(fetch,files):
                  if err:
                      failures.append((path,err)); continue
                  for r in obj.get("righe") or []:
                      if r.get("fascia")!="campionato": continue
                      if r.get("lega") not in TOP5: continue
                      if r.get("fase")!="live": continue
                      if r.get("mercato") not in CORE: continue
                      eid=str(r.get("event_id") or "")
                      if eid:
                          event_rows[eid].append(r)
          print("download_failures=",len(failures))
          print("top5_events=",len(event_rows))

          def parse_ts(s):
              return dt.datetime.fromisoformat(str(s).replace("Z","+00:00"))

          def tick_key(r):
              return r.get("giro_utc") or r.get("istante_utc")

          diagnostics=Counter()
          results=[]
          all_event_summaries=[]

          for eid,rows in event_rows.items():
              # De-duplicate overlapping collector sessions at contract/tick level.
              dedup={}
              for r in rows:
                  k=(tick_key(r),r.get("market_id"),r.get("contract_id"))
                  old=dedup.get(k)
                  if old is None or str(r.get("istante_utc")) > str(old.get("istante_utc")):
                      dedup[k]=r
              rows=list(dedup.values())
              sample=rows[0]
              league=sample.get("lega")
              match=sample.get("partita")
              try:
                  kickoff=parse_ts(sample.get("inizio"))
              except Exception:
                  diagnostics["bad_kickoff"]+=1; continue

              grouped=defaultdict(list)
              for r in rows:
                  grouped[tick_key(r)].append(r)

              ticks=[]
              for gts,rs in grouped.items():
                  try: ts=parse_ts(gts)
                  except Exception: continue
                  exact=[r for r in rs if r.get("mercato")=="risultato_esatto"]
                  nums=[]
                  for r in exact:
                      if r.get("stato_mercato")!="live": continue
                      m=score_re.match(str(r.get("contratto") or ""))
                      if not m: continue
                      nums.append((int(m.group(1)),int(m.group(2)),r))
                  cur=None
                  if nums:
                      h=min(x[0] for x in nums)
                      a=min(x[1] for x in nums)
                      cr=[r for hh,aa,r in nums if hh==h and aa==a]
                      if cr:
                          r=cr[0]
                          p=r.get("p_puntatore")
                          try: p=float(p) if p is not None else None
                          except Exception: p=None
                          cur={
                              "home":h,"away":a,
                              "p":p,
                              "odds":(1.0/p if p and p>0 else None),
                              "p_banco":r.get("p_banco"),
                              "p_mid":r.get("p_mid"),
                              "side":r.get("lato"),
                          }

                  # Halftime anchor: current-score price itself should freeze.
                  # Full order books can still change while play is stopped.
                  freeze_sig=None
                  if cur and cur.get("p") is not None:
                      freeze_sig=(cur["home"],cur["away"],round(float(cur["p"]),4))
                  ticks.append({"ts":ts,"current":cur,"freeze_sig":freeze_sig})

              ticks.sort(key=lambda x:x["ts"])
              if len(ticks)<8:
                  diagnostics["too_few_ticks"]+=1; continue

              # Detect the longest exact frozen-book run around halftime.
              window=[x for x in ticks if kickoff+dt.timedelta(minutes=42) <= x["ts"] <= kickoff+dt.timedelta(minutes=78)]
              runs=[]
              if window:
                  start=0
                  for i in range(1,len(window)+1):
                      if i==len(window) or window[i]["freeze_sig"]!=window[start]["freeze_sig"]:
                          part=window[start:i]
                          dur=(part[-1]["ts"]-part[0]["ts"]).total_seconds()
                          if part[0]["freeze_sig"] is not None and len(part)>=3 and dur>=360:
                              runs.append((dur,part))
                          start=i
              if not runs:
                  diagnostics["no_halftime_freeze"]+=1; continue
              runs.sort(key=lambda x:x[0],reverse=True)
              freeze=runs[0][1]
              freeze_end=freeze[-1]["ts"]
              next_ticks=[x for x in ticks if x["ts"]>freeze_end and x["freeze_sig"]!=freeze[-1]["freeze_sig"]]
              if not next_ticks:
                  diagnostics["no_restart_tick"]+=1; continue
              restart=next_ticks[0]["ts"]

              # Sanity gate for a normal second-half restart.
              restart_from_ko=(restart-kickoff).total_seconds()/60
              if not (55 <= restart_from_ko <= 75):
                  diagnostics["restart_outside_gate"]+=1; continue

              target=restart+dt.timedelta(minutes=48)  # 45+48 = minute 93
              candidates=[x for x in ticks if x["current"] and x["current"].get("odds") is not None]
              if not candidates:
                  diagnostics["no_current_score_ticks"]+=1; continue
              nearest=min(candidates,key=lambda x:abs((x["ts"]-target).total_seconds()))
              diff=abs((nearest["ts"]-target).total_seconds())
              if diff>180:
                  diagnostics["no_tick_within_3m"]+=1; continue

              cur=nearest["current"]
              odds=cur["odds"]
              signal=(1.03-1e-9 <= odds <= 1.05+1e-9)

              last_cur=[x for x in ticks if x["current"]]
              last=last_cur[-1] if last_cur else None
              summary={
                  "event_id":eid,"league":league,"match":match,
                  "kickoff_utc":kickoff.isoformat(),
                  "halftime_freeze_start":freeze[0]["ts"].isoformat(),
                  "halftime_freeze_end":freeze[-1]["ts"].isoformat(),
                  "second_half_restart":restart.isoformat(),
                  "restart_min_from_kickoff":round(restart_from_ko,2),
                  "target_93":target.isoformat(),
                  "signal_tick":nearest["ts"].isoformat(),
                  "target_diff_sec":round(diff,1),
                  "score_at_signal":f"{cur['home']}-{cur['away']}",
                  "p_puntatore":cur["p"],
                  "no_goal_odds":odds,
                  "signal_103_105":signal,
                  "last_tick":last["ts"].isoformat() if last else None,
                  "last_score":f"{last['current']['home']}-{last['current']['away']}" if last else None,
              }
              all_event_summaries.append(summary)
              if signal:
                  results.append(summary)

          print("diagnostics=",json.dumps(diagnostics,sort_keys=True))
          print("qualified_events=",len(all_event_summaries))
          print("signals_103_105=",len(results))
          for lg in sorted(TOP5):
              xs=[r for r in results if r["league"]==lg]
              print("LEAGUE",lg,"signals=",len(xs))
          for r in sorted(results,key=lambda x:(x["league"],x["kickoff_utc"],x["match"])):
              print("SIGNAL",json.dumps(r,ensure_ascii=False,sort_keys=True))

          artifact={
              "schema_version":"SMARKETS_LATE_NO_GOAL_93_V1",
              "source_repo":f"{OWNER}/{REPO}",
              "date_range":[START,END],
              "definition":"Current exact score back price as No Goal to FT; target minute 93 = inferred second-half restart + 48m",
              "price_side":"p_puntatore",
              "odds_band":[1.03,1.05],
              "archive_files":len(files),
              "download_failures":failures,
              "top5_events":len(event_rows),
              "diagnostics":dict(diagnostics),
              "qualified_events":len(all_event_summaries),
              "signals":results,
              "event_summaries":all_event_summaries,
          }
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/smarkets_late_no_goal_scan.json").write_text(
              json.dumps(artifact,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          PY
      - name: Verify production model unchanged
        if: always()
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarkets-late-no-goal-scan
          path: artifacts/smarkets_late_no_goal_scan.json
          if-no-files-found: error