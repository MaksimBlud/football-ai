name: Smarkets Late No Goal Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/smarkets-late-no-goal-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record production model hash before
        run: sha256sum football_model_xgboost_elo.pkl > /tmp/model.before
      - name: Reconstruct one match timeline from public Smarkets live session
        run: |
          python - <<'PY'
          import gzip, json, re, urllib.request
          from collections import defaultdict
          from pathlib import Path

          url = "https://raw.githubusercontent.com/BTConomista/Polymarket-oracle/main/data/smarkets_live/2026-08-21T18-53-14-g1.json.gz"
          raw = urllib.request.urlopen(url, timeout=30).read()
          obj = json.loads(gzip.decompress(raw).decode("utf-8"))
          rows = obj.get("righe") or []
          target = [r for r in rows if r.get("partita") == "Arsenal vs Coventry"]

          by_time = defaultdict(list)
          for r in target:
              by_time[r.get("istante_utc")].append(r)

          out=[]
          score_re = re.compile(r"^(\d+)\s*-\s*(\d+)$")
          for ts in sorted(by_time):
              rs=by_time[ts]
              exact=[r for r in rs if r.get("mercato")=="risultato_esatto"]
              nums=[]
              for r in exact:
                  m=score_re.match(str(r.get("contratto") or ""))
                  if m and r.get("stato_mercato")=="live":
                      nums.append((int(m.group(1)),int(m.group(2)),r))
              cur=None
              if nums:
                  mh=min(x[0] for x in nums)
                  ma=min(x[1] for x in nums)
                  candidates=[r for h,a,r in nums if h==mh and a==ma]
                  if candidates:
                      r=candidates[0]
                      p=r.get("p_puntatore")
                      cur={
                          "score":f"{mh}-{ma}",
                          "p_puntatore":p,
                          "odds":(1/float(p) if p not in (None,0) else None),
                          "p_banco":r.get("p_banco"),
                          "p_mid":r.get("p_mid"),
                          "side":r.get("lato"),
                      }
              states=sorted({(r.get("mercato"),r.get("stato_mercato")) for r in rs if r.get("mercato") in {"1x2","risultato_esatto","ou25","ggng"}})
              out.append({"ts":ts,"current":cur,"states":states})

          print("kickoff=2026-08-21T19:00:00Z")
          for x in out:
              print("TICK",json.dumps(x,ensure_ascii=False,sort_keys=True))

          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/smarkets_late_no_goal_probe.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )
          PY
      - name: Verify production model unchanged
        if: always()
        run: |
          sha256sum football_model_xgboost_elo.pkl > /tmp/model.after
          diff -u /tmp/model.before /tmp/model.after
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarkets-late-no-goal-probe
          path: artifacts/smarkets_late_no_goal_probe.json
          if-no-files-found: error
