name: MARKET_ANCHOR_1X2_V1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'market_anchor_1x2_v1.py'
      - 'tests/test_market_anchor_1x2_v1.py'
      - 'research/MARKET_ANCHOR_1X2_V1.md'
      - '.github/workflows/market-anchor-1x2-v1.yml'
      - 'historical_football_signal_lab.py'
      - 'historical_football_signal_runner.py'
  push:
    branches: [main]
    paths:
      - 'market_anchor_1x2_v1.py'
      - 'tests/test_market_anchor_1x2_v1.py'
      - 'research/MARKET_ANCHOR_1X2_V1.md'
      - '.github/workflows/market-anchor-1x2-v1.yml'
      - 'historical_football_signal_lab.py'
      - 'historical_football_signal_runner.py'
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Contract tests
        run: pytest -q tests/test_market_anchor_1x2_v1.py
      - name: Run untouched temporal OOT evaluation
        run: python market_anchor_1x2_v1.py
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Verify active mode cannot be worse than fallback market by contract
        run: |
          python - <<'PY'
          import json
          p='artifacts/market_anchor_1x2_v1/report.json'
          r=json.load(open(p))
          assert r['active_delta_brier'] <= 1e-15
          assert r['active_delta_log_loss'] <= 1e-15
          if not r['residual_accepted']:
              assert r['active_mode'] == 'MARKET_FALLBACK'
              assert abs(r['active_delta_brier']) <= 1e-15
              assert abs(r['active_delta_log_loss']) <= 1e-15
          PY
      - name: Publish OOT report to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### MARKET_ANCHOR_1X2_V1 OOT report'
            echo '```json'
            cat artifacts/market_anchor_1x2_v1/report.json
            echo '```'
          } > /tmp/market-anchor-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/market-anchor-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: market-anchor-1x2-v1
          path: artifacts/market_anchor_1x2_v1/report.json
          retention-days: 30
