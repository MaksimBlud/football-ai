name: La Liga Market Movement Regimes V7

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'la_liga_market_movement_regimes_v7.py'
      - 'tests/test_la_liga_market_movement_regimes_v7.py'
      - 'research/LA_LIGA_MARKET_MOVEMENT_REGIMES_V7.md'
      - '.github/workflows/la-liga-market-movement-regimes-v7.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Regression tests
        run: pytest -q tests/test_la_liga_market_movement_regimes_v7.py tests/test_la_liga_standard_to_close_signal_v6.py
      - name: Run frozen historical V7
        run: python la_liga_market_movement_regimes_v7.py
      - name: Assert research-only contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/la_liga_market_movement_regimes_v7/report.json'))
          assert r['experiment_id']=='LA_LIGA_MARKET_MOVEMENT_REGIMES_V7'
          assert r['league']=='LA_LIGA'
          assert r['research_only'] and not r['production_promotion'] and not r['betting_enabled']
          assert r['result']=='NO_BET'
          assert not r['match_outcome_used']
          assert not r['opened_2026_27_data_used']
          assert not r['standard_is_labeled_opening']
          assert r['movement_quantile']==0.75
          assert r['train_n'] > 0 and r['validation_n'] > 0 and r['test_n'] > 0
          if not r['regime_signal_accepted']:
              assert r['active_mode']=='CONSTANT_PREVALENCE_FALLBACK'
          PY
      - name: Verify production hashes unchanged
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with:
          name: la-liga-market-movement-regimes-v7
          path: artifacts/la_liga_market_movement_regimes_v7/report.json
          retention-days: 30
