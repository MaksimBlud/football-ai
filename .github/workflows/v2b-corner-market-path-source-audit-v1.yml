name: V2B Corner Market-Path Source Audit V1

on:
  pull_request:
    paths:
      - 'v2b_corner_market_path_source_audit_v1.py'
      - 'tests/test_v2b_corner_market_path_source_audit_v1.py'
      - 'research/V2B_CORNER_MARKET_PATH_SOURCE_AUDIT_V1.md'
      - '.github/workflows/v2b-corner-market-path-source-audit-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: python -m py_compile v2b_corner_market_path_source_audit_v1.py
      - run: pytest -q tests/test_v2b_corner_market_path_source_audit_v1.py
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  offline-source-audit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable V2B raw artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10899611444/zip > /tmp/raw.zip
          echo "c2f5313efad4afb8663d9980f5ea004f52fe02827a83b5c99a8b775c35498a57  /tmp/raw.zip" | sha256sum -c -
          mkdir -p /tmp/raw
          unzip -q /tmp/raw.zip -d /tmp/raw
          test "$(find /tmp/raw/raw/odds -name '*.json' -type f | wc -l)" -eq 43
      - name: Audit raw structural path support
        run: |
          python v2b_corner_market_path_source_audit_v1.py \
            --raw-dir /tmp/raw/raw/odds \
            --output artifacts/v2b_corner_market_path_source_audit_v1.json
      - name: Assert outcome-free source contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_corner_market_path_source_audit_v1.json').read_text())
          assert r['experiment_id']=='V2B_CORNER_MARKET_PATH_SOURCE_AUDIT_V1'
          assert r['research_only'] is True
          assert r['raw_fixture_count']==43
          assert r['market_direction_evaluated'] is False
          assert r['opening_closing_delta_computed'] is False
          assert r['outcomes_read'] is False
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print(json.dumps({
            'status':r['status'],
            'bookmaker_count_distribution':r['bookmaker_count_distribution'],
            'bookmaker_slug_counts':r['bookmaker_slug_counts'],
            'corner_state_presence':r['corner_state_presence'],
            'fixtures_with_time_like_fields':r['fixtures_with_time_like_fields'],
            'fixtures_with_history_like_fields':r['fixtures_with_history_like_fields'],
            'fixtures_with_multiple_bookmakers':r['fixtures_with_multiple_bookmakers'],
          },indent=2,sort_keys=True))
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-corner-market-path-source-audit-v1
          path: artifacts/v2b_corner_market_path_source_audit_v1.json
          if-no-files-found: error
          retention-days: 90
