name: All Leagues V1.1 Sample Health

on:
  pull_request:
    paths:
      - "all_leagues_market_only_v1_1_status.py"
      - "all_leagues_market_only_v1_1_gate.py"
      - "research/ALL_LEAGUES_MARKET_ONLY_V1_1_MANIFEST.json"
      - "tests/test_all_leagues_market_only_v1_1_status.py"
      - ".github/workflows/all-leagues-v1-1-sample-health.yml"
  push:
    branches: [main]
    paths:
      - "all_leagues_market_only_v1_1_status.py"
      - "all_leagues_market_only_v1_1_gate.py"
      - "research/ALL_LEAGUES_MARKET_ONLY_V1_1_MANIFEST.json"
      - "tests/test_all_leagues_market_only_v1_1_status.py"
      - ".github/workflows/all-leagues-v1-1-sample-health.yml"
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: all-leagues-v1-1-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest==9.1.1 supabase==2.31.0 python-dotenv==1.1.1
      - name: Compile outcome-blind sample-health monitor
        run: python -m py_compile all_leagues_market_only_v1_1_status.py all_leagues_market_only_v1_1_gate.py
      - name: Run sample-health regression suite
        run: python -m pytest -q tests/test_all_leagues_market_only_v1_1_status.py tests/test_all_leagues_prospective_protocol.py
      - name: Guard production model artifacts
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.pkl$'; then
            echo "Production model artifact change detected"
            exit 1
          fi
          echo "PASS: no .pkl changes in PR"

  live-outcome-blind-sample-health:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install supabase==2.31.0 python-dotenv==1.1.1
      - name: Check required Supabase secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("SUPABASE_URL", "SUPABASE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing required secrets: " + ", ".join(missing))
          print("PASS: required Supabase secrets configured; values not printed")
          PY
      - name: Run live read-only V1.1 sample health
        run: python all_leagues_market_only_v1_1_status.py
