name: Replay V1 Eval43 PR Validation

on:
  pull_request:
    paths:
      - 'experiments/point_in_time_cross_league_replay_v1_eval43_freeze.json'
      - 'experiments/point_in_time_cross_league_replay_v1_eval43_results.csv'
      - 'experiments/point_in_time_cross_league_replay_v1_eval43_report.json'
      - 'point_in_time_cross_league_replay_v1_eval43.py'
      - 'tests/test_point_in_time_cross_league_replay_v1_eval43.py'
      - 'tests/test_point_in_time_cross_league_replay_v1_eval43_results.py'
      - '.github/workflows/replay-v1-eval43-pr-validation.yml'

permissions:
  contents: read

jobs:
  eval43-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Eval43 modules
        run: python -m py_compile point_in_time_cross_league_replay_v1_eval43.py
      - name: Run Eval43 contract and result tests
        run: |
          python -m pytest -q \
            tests/test_point_in_time_cross_league_replay_v1_eval43.py \
            tests/test_point_in_time_cross_league_replay_v1_eval43_results.py
      - name: Production artifacts unchanged
        run: |
          git diff --exit-code -- '*.pkl'
          test -z "$(git status --porcelain -- '*.pkl')"
