name: Cross Book Source Drift V21
on:
  pull_request:
    paths:
      - 'cross_book_source_drift_v21.py'
      - 'cross_league_structural_break_v19.py'
      - 'tests/test_cross_book_source_drift_v21.py'
      - '.github/workflows/cross-book-source-drift-v21.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn pytest
      - run: python -m pytest -q tests/test_cross_book_source_drift_v21.py
      - run: python cross_book_source_drift_v21.py --output /tmp/v21.json
      - name: Enforce no production artifact changes
        run: git diff --exit-code -- '*.pkl'
