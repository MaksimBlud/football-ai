name: Prospective Availability Activation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "11 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prospective-availability-activation-monitor.yml"
      - "prospective_availability_activation_monitor.py"

permissions:
  contents: read

concurrency:
  group: prospective-availability-activation-monitor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Run read-only activation monitor
        run: python prospective_availability_activation_monitor.py
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - name: Upload activation readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-availability-activation-${{ github.run_id }}
          path: artifacts/prospective_availability_signal_lab/activation_readiness.json
          if-no-files-found: error
          retention-days: 30
