name: V2B Full-Calendar Rest Stage-B Freeze V1

on:
  pull_request:
    paths:
      - 'v2b_full_calendar_rest_stage_b_freeze_v1.py'
      - 'tests/test_v2b_full_calendar_rest_stage_b_freeze_v1.py'
      - 'research/V2B_FULL_CALENDAR_REST_STAGE_B_FREEZE_V1.md'
      - '.github/workflows/v2b-full-calendar-rest-stage-b-freeze-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: python -m py_compile v2b_full_calendar_rest_stage_b_freeze_v1.py
      - run: pytest -q tests/test_v2b_full_calendar_rest_stage_b_freeze_v1.py
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  zero-cost-feature-freeze:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable full-calendar feasibility artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11041563442/zip > /tmp/calendar.zip
          echo "93a2f808b7542a5f9c6429e2808e6f462f044404f3219adef5a1b80d880cf68c  /tmp/calendar.zip" | sha256sum -c -
          mkdir -p /tmp/calendar
          unzip -q /tmp/calendar.zip -d /tmp/calendar
          F=$(find /tmp/calendar -name v2b_full_calendar_load_feasibility_v1.json -type f | head -n1)
          test -n "$F"
          cp "$F" /tmp/full_calendar_feasibility.json
      - name: Freeze recovery mapping without market outcomes
        run: |
          python v2b_full_calendar_rest_stage_b_freeze_v1.py \
            --feasibility-report /tmp/full_calendar_feasibility.json \
            --output artifacts/v2b_full_calendar_rest_stage_b_freeze_v1.json
      - name: Assert feature-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_full_calendar_rest_stage_b_freeze_v1.json').read_text())
          assert r['experiment_id']=='V2B_FULL_CALENDAR_REST_STAGE_B_FREEZE_V1'
          assert r['primary_mapping_id']=='JOINT_FULL_REST_COHORT_MEDIAN_SIGN_V1'
          assert r['locked_fixture_count']==43
          assert r['cohort_median_joint_full_rest_days']==11.0
          assert r['stage_b_calls']=={'UP':17,'DOWN':19,'NO_CALL':7}
          assert r['market_rows_read'] is False
          assert r['v2b_odds_read'] is False
          assert r['opening_lambda_read'] is False
          assert r['fair_centre_read'] is False
          assert r['centre_delta_read'] is False
          assert r['direction_test_performed'] is False
          assert r['threshold_fitted_to_outcomes'] is False
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print(json.dumps({
            'baseline':r['cohort_median_joint_full_rest_days'],
            'calls':r['stage_b_calls'],
            'cohort_hash':r['eligible_fixture_sha256'],
            'feature_hash':r['frozen_feature_sha256'],
            'calls_by_league':r['calls_by_league'],
          },indent=2,sort_keys=True))
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-full-calendar-rest-stage-b-freeze-v1
          path: artifacts/v2b_full_calendar_rest_stage_b_freeze_v1.json
          if-no-files-found: error
          retention-days: 90
