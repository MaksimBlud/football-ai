name: V2B Travel Venue Feasibility V1

on:
  push:
    branches:
      - research/v2b-travel-venue-feasibility-v1
    paths:
      - 'v2b_travel_venue_feasibility_v1.py'
      - 'tests/test_v2b_travel_venue_feasibility_v1.py'
      - 'research/V2B_TRAVEL_VENUE_FEASIBILITY_V1.md'
      - 'research/V2B_TRAVEL_VENUE_FEASIBILITY_V1_RESULTS.md'
      - '.github/workflows/v2b-travel-venue-feasibility-v1.yml'
  pull_request:
    paths:
      - 'v2b_travel_venue_feasibility_v1.py'
      - 'tests/test_v2b_travel_venue_feasibility_v1.py'
      - 'research/V2B_TRAVEL_VENUE_FEASIBILITY_V1.md'
      - 'research/V2B_TRAVEL_VENUE_FEASIBILITY_V1_RESULTS.md'
      - '.github/workflows/v2b-travel-venue-feasibility-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: v2b-travel-venue-feasibility-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'requests==2.32.5' pytest
      - name: Compile source audit
        run: python -m py_compile v2b_travel_venue_feasibility_v1.py
      - name: Run source-audit regression tests
        run: pytest -q tests/test_v2b_travel_venue_feasibility_v1.py
      - name: Production artifact diff guard
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.pkl$' && exit 1 || true

  source-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/v2b-travel-venue-feasibility-v1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==3.0.6' 'numpy==2.5.3' 'requests==2.32.5'
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable full-calendar source artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11041563442/zip > /tmp/fullcal.zip
          echo "93a2f808b7542a5f9c6429e2808e6f462f044404f3219adef5a1b80d880cf68c  /tmp/fullcal.zip" | sha256sum -c -
          mkdir -p /tmp/fullcal
          unzip -q /tmp/fullcal.zip -d /tmp/fullcal
          SOURCE=$(find /tmp/fullcal -name v2b_full_calendar_load_feasibility_v1.json -type f | head -n 1)
          test -n "$SOURCE"
          cp "$SOURCE" /tmp/full_calendar.json
      - name: Run zero-cost travel/venue source audit
        run: |
          python v2b_travel_venue_feasibility_v1.py \
            --full-calendar-report /tmp/full_calendar.json \
            --output artifacts/v2b_travel_venue_feasibility_v1/report.json
      - name: Assert source-only safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_travel_venue_feasibility_v1/report.json').read_text())
          assert r['experiment_id']=='V2B_TRAVEL_VENUE_FEASIBILITY_V1'
          assert r['research_only'] is True
          assert r['source_feasibility_audit'] is True
          assert r['locked_fixture_count']==43
          assert r['team_side_count']==86
          for key in (
              'market_rows_read','v2b_odds_read','opening_lambda_read',
              'fair_centre_read','centre_delta_read','direction_test_performed',
              'match_outcome_target_used','threshold_fitted_to_outcomes'
          ):
              assert r[key] is False, key
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print('status=',r['status'])
          print('previous_host_identity_reconstructed=',r['previous_host_identity_reconstructed'])
          print('travel_distance_resolved_team_sides=',r['travel_distance_resolved_team_sides'])
          print('unresolved_clubs=',r['unresolved_clubs'])
          print('unresolved_cities=',r['unresolved_cities'])
          print('openfootball_archive_sha256=',r['openfootball_archive_sha256'])
          print('geonames_archive_sha256=',r['geonames_archive_sha256'])
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: |
          sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true
          diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-travel-venue-feasibility-v1-${{ github.run_id }}
          path: artifacts/v2b_travel_venue_feasibility_v1/report.json
          if-no-files-found: error
          retention-days: 90
