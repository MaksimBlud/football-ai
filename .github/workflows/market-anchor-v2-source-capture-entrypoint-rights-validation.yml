name: Original V2 Source Capture Entrypoint Rights Validation

on:
  pull_request:
    branches:
      - research/v2-market-only-outcome-reader-gate-stacked-on-730-20261108-run11
    paths:
      - "requirements-v2-research-py312.lock"
      - "serie_a_v2_current_form_source_capture.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - "tests/test_market_anchor_v2_source_capture_rights.py"
      - "tests/test_market_anchor_v2_artifact_privacy.py"
  push:
    branches:
      - research/v2-source-capture-entrypoint-rights-gate-stacked-on-731-20261108-run11
    paths:
      - "requirements-v2-research-py312.lock"
      - "serie_a_v2_current_form_source_capture.py"
      - "market_anchor_v2_source_capture_rights.py"
      - "market_anchor_v2_artifact_privacy.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - "tests/test_market_anchor_v2_source_capture_rights.py"
      - "tests/test_market_anchor_v2_artifact_privacy.py"
      - ".github/workflows/market-anchor-v2-source-capture-entrypoint-rights-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-source-capture-entrypoint-rights-validation
  cancel-in-progress: false

jobs:
  validate-source-capture-entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned offline V2 dependencies
        run: python -m pip install -r requirements-v2-research-py312.lock
      - name: Compile source-only capture entrypoint and rights gates
        run: python -m py_compile serie_a_v2_current_form_source_capture.py market_anchor_v2_source_capture_rights.py market_anchor_v2_artifact_privacy.py
      - name: Run offline source capture and rights regressions
        run: python -m pytest -q tests/test_serie_a_v2_current_form_source_capture.py tests/test_market_anchor_v2_source_capture_rights.py tests/test_market_anchor_v2_artifact_privacy.py
      - name: Verify no production pickle changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$PR_BASE_SHA"
          git diff --exit-code "$PR_BASE_SHA"...HEAD -- '*.pkl'
