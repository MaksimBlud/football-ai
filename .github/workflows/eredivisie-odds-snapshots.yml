name: Eredivisie Odds Snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "38 */2 * * *"

concurrency:
  group: eredivisie-odds-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase python-dotenv
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ("THE_ODDS_API_KEY", "SUPABASE_URL", "SUPABASE_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing Eredivisie snapshot secrets: " + ", ".join(missing))
          print("PASS: Eredivisie snapshot secrets available; values not printed")
          PY
      - name: Verify Eredivisie MARKET_ONLY safety
        run: |
          python - <<'PY'
          from eredivisie_runtime_config import EREDIVISIE_RUNTIME_CONFIG
          s = EREDIVISIE_RUNTIME_CONFIG.structural_v2
          assert s.calibration_status == "CALIBRATION_REQUIRED"
          assert s.structural_alpha is None
          assert s.edge_threshold is None
          print("PASS: Eredivisie remains MARKET_ONLY")
          PY
      - name: Run adaptive Eredivisie snapshot check
        run: python scheduled_eredivisie_odds_snapshot.py
