name: MARKET_ANCHOR V2 Private Artifact Gate Validation

on:
  push:
    branches:
      - research/v2-private-artifact-gate-restacked-on-781-20261127-run11
    paths:
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/recover-market-anchor-v2-candidate.yml"
      - ".github/workflows/market-anchor-v2-private-artifact-gate-validation.yml"
  pull_request:
    branches:
      - research/v2-workflow-live-access-hold-20261110-run11
    paths:
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/serie-a-v2-forward-preview.yml"
      - ".github/workflows/serie-a-v2-free-real-quote-diagnostic.yml"
      - ".github/workflows/serie-a-v2-current-form-source-capture.yml"
      - ".github/workflows/serie-a-v2-current-form-forward-preview.yml"
      - ".github/workflows/recover-market-anchor-v2-candidate.yml"
      - ".github/workflows/market-anchor-v2-private-artifact-gate-validation.yml"

permissions:
  contents: read

jobs:
  private-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact V2 research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned offline test runner
        run: python -m pip install pytest==9.2.0
      - name: Compile private artifact gate contract
        run: python -m py_compile tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Run five-workflow private artifact gate regressions
        run: python -m pytest -q tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Verify no production pickle changes
        run: git diff --exit-code -- '*.pkl'
