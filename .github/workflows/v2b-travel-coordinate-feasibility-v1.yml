name: V2B Travel Coordinate Feasibility V1

on:
  pull_request:
    paths:
      - 'v2b_travel_coordinate_feasibility_v1.py'
      - 'tests/test_v2b_travel_coordinate_feasibility_v1.py'
      - 'research/V2B_TRAVEL_COORDINATE_FEASIBILITY_V1.md'
      - '.github/workflows/v2b-travel-coordinate-feasibility-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: python -m py_compile v2b_travel_coordinate_feasibility_v1.py
      - run: pytest -q tests/test_v2b_travel_coordinate_feasibility_v1.py
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after

  zero-cost-coordinate-audit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - name: Download immutable route identity artifact
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11044111558/zip > /tmp/route.zip
          echo "8c895a500169760c1fe36fe5eeb40861d06d2aa23a4b26e15d3f580f3243837b  /tmp/route.zip" | sha256sum -c -
          mkdir -p /tmp/route
          unzip -q /tmp/route.zip -d /tmp/route
          ROUTE=$(find /tmp/route -name v2b_travel_venue_identity_feasibility_v1.json -type f | head -n1)
          test -n "$ROUTE"
          cp "$ROUTE" /tmp/route_identity.json
      - name: Audit Wikidata coordinate coverage
        run: |
          python v2b_travel_coordinate_feasibility_v1.py \
            --route-report /tmp/route_identity.json \
            --output artifacts/v2b_travel_coordinate_feasibility_v1.json
      - name: Assert no-distance/no-direction contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/v2b_travel_coordinate_feasibility_v1.json').read_text())
          assert r['experiment_id']=='V2B_TRAVEL_COORDINATE_FEASIBILITY_V1'
          assert r['research_only'] is True
          assert r['team_side_count']==86
          assert r['coordinate_layer_applied'] is True
          assert r['distance_km_computed'] is False
          assert r['market_rows_read'] is False
          assert r['v2b_odds_read'] is False
          assert r['centre_delta_read'] is False
          assert r['direction_test_performed'] is False
          assert r['match_outcome_target_used'] is False
          assert r['odds_api_requests']==0
          assert r['supabase_operations']==0
          assert r['production_model_operations']==0
          print(json.dumps({
            'status':r['status'],
            'unique_route_venue_labels':r['unique_route_venue_labels'],
            'coordinate_status_counts':r['coordinate_status_counts'],
            'stadium_route_team_sides':r['stadium_coordinate_route_team_sides'],
            'any_coordinate_route_team_sides':r['any_coordinate_route_team_sides'],
            'fixtures_stadium':r['fixtures_both_sides_stadium_coordinate_feasible'],
            'fixtures_any':r['fixtures_both_sides_any_coordinate_feasible'],
            'public_http_requests':r['public_http_requests'],
          },indent=2,sort_keys=True))
          PY
      - name: Verify production hashes unchanged
        if: always()
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2b-travel-coordinate-feasibility-v1
          path: artifacts/v2b_travel_coordinate_feasibility_v1.json
          if-no-files-found: error
          retention-days: 90
