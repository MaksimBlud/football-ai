name: MARKET_ANCHOR_1X2_V2 Soccer Data Source Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/source_rights/soccer_data_co.json"
      - "research/SERIE_A_V2_SOCCER_DATA_SOURCE_AUDIT_20261114.md"
      - "tests/test_market_anchor_v2_soccer_data_source_rights.py"
      - ".github/workflows/market-anchor-v2-soccer-data-source-audit.yml"
  push:
    branches:
      - research/v2-soccer-data-source-audit-20261114
    paths:
      - "research/source_rights/soccer_data_co.json"
      - "research/SERIE_A_V2_SOCCER_DATA_SOURCE_AUDIT_20261114.md"
      - "tests/test_market_anchor_v2_soccer_data_source_rights.py"
      - ".github/workflows/market-anchor-v2-soccer-data-source-audit.yml"

permissions:
  contents: read

jobs:
  offline-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile the offline audit test
        run: python -m py_compile tests/test_market_anchor_v2_soccer_data_source_rights.py
      - name: Run source-rights and frozen-model contract regressions
        run: python -m pytest -q tests/test_market_anchor_v2_soccer_data_source_rights.py
      - name: Verify no production model pickle changed
        run: |
          git fetch origin main
          git diff --exit-code FETCH_HEAD...HEAD -- '*.pkl'
