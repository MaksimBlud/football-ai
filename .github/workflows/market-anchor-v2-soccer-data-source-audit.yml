name: Original V2 Soccer Data Free Source Audit

on:
  push:
    branches:
      - research/v2-soccer-data-free-source-rights-audit-20261127-run11
    paths:
      - "research/source_rights/soccer_data_co_20261127.json"
      - "research/SOCCER_DATA_SOURCE_RIGHTS_AUDIT_20261127.md"
      - "tests/test_serie_a_v2_soccer_data_source_audit.py"
      - ".github/workflows/market-anchor-v2-soccer-data-source-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/source_rights/soccer_data_co_20261127.json"
      - "research/SOCCER_DATA_SOURCE_RIGHTS_AUDIT_20261127.md"
      - "tests/test_serie_a_v2_soccer_data_source_audit.py"
      - ".github/workflows/market-anchor-v2-soccer-data-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-soccer-data-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-source-rights-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact research branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile offline source audit tests
        run: python -m py_compile tests/test_serie_a_v2_soccer_data_source_audit.py
      - name: Run offline source-rights and frozen V2 regressions
        run: python -m unittest discover -s tests -p "test_serie_a_v2_soccer_data_source_audit.py" -v
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- "*.pkl"
