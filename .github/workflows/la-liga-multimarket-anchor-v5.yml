name: La Liga Multi-Market Anchor V5
on:
  workflow_dispatch:
  pull_request:
    paths: ['la_liga_multimarket_anchor_v5.py','tests/test_la_liga_multimarket_anchor_v5.py','.github/workflows/la-liga-multimarket-anchor-v5.yml','research/LA_LIGA_MULTIMARKET_ANCHOR_V5.md']
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests scipy 'scikit-learn==1.7.2' pytest
      - name: Snapshot production hashes
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-before || true
      - run: pytest -q tests/test_la_liga_multimarket_anchor_v5.py
      - name: Run frozen V5
        run: python la_liga_multimarket_anchor_v5.py
      - name: Assert contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/la_liga_multimarket_anchor_v5/report.json'))
          assert r['experiment_id']=='LA_LIGA_MULTIMARKET_ANCHOR_V5'
          assert r['research_only'] and not r['production_promotion'] and not r['betting_enabled']
          assert r['result']=='NO_BET' and not r['opened_2026_27_outcomes_used']
          assert r['test_n']==380
          if not r['multimarket_accepted']: assert r['active_mode']=='POWER_MARKET_FALLBACK'
          PY
      - name: Verify production hashes unchanged
        run: sha256sum *.pkl 2>/dev/null | sort > /tmp/pkl-after || true; diff -u /tmp/pkl-before /tmp/pkl-after
      - uses: actions/upload-artifact@v4
        with: {name: la-liga-multimarket-anchor-v5, path: artifacts/la_liga_multimarket_anchor_v5/report.json, retention-days: 30}
