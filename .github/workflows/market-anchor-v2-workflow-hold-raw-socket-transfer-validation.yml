name: Original V2 Workflow Hold Raw-Socket Transfer Validation

on:
  push:
    branches:
      - research/v2-workflow-hold-raw-socket-transfer-guard-on-781-20261120-run11
    paths:
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/market-anchor-v2-workflow-hold-raw-socket-transfer-validation.yml"
  pull_request:
    branches:
      - research/v2-workflow-live-access-hold-20261110-run11
    paths:
      - "tests/test_serie_a_v2_workflow_external_access_hold.py"
      - ".github/workflows/market-anchor-v2-workflow-hold-raw-socket-transfer-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-workflow-hold-raw-socket-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline regression dependency
        run: python -m pip install pytest==9.2.0
      - name: Compile workflow hold contract tests
        run: python -m py_compile tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Run workflow hold and external-I/O inventory regressions
        run: python -m pytest -q tests/test_serie_a_v2_workflow_external_access_hold.py
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- '*.pkl'
