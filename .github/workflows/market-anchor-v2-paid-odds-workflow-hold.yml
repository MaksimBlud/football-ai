name: MARKET_ANCHOR V2 Paid Odds Workflow Hold Guard

on:
  push:
    branches:
      - "research/v2-paid-odds-manual-workflow-default-deny-on-781-20261125-run11"
      - "research/v2-paid-odds-hold-checkout-token-isolation-on-960-20261125-run11"
    paths:
      - ".github/workflows/serie-a-odds-snapshots.yml"
      - ".github/workflows/market-anchor-v2-paid-odds-workflow-hold.yml"
      - "tests/test_serie_a_v2_manual_quote_trigger_contract.py"
  pull_request:
    branches:
      - main
      - research/v2-workflow-live-access-hold-20261110-run11
      - research/v2-paid-odds-manual-workflow-default-deny-on-781-20261125-run11
    paths:
      - ".github/workflows/serie-a-odds-snapshots.yml"
      - ".github/workflows/market-anchor-v2-paid-odds-workflow-hold.yml"
      - "tests/test_serie_a_v2_manual_quote_trigger_contract.py"

permissions:
  contents: read

jobs:
  offline-paid-odds-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned pytest
        run: python -m pip install pytest==9.2.0
      - name: Run paid-workflow default-deny and V2 trigger regressions
        run: python -m pytest -q tests/test_serie_a_v2_manual_quote_trigger_contract.py
