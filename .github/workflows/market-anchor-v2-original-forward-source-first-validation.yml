      - "tests/test_serie_a_v2_source_first_validation_workflow_contract.py"
      - ".github/workflows/market-anchor-v2-original-forward-source-first-validation.yml"

permissions:
  contents: read

concurrency:
  group: original-v2-forward-source-first-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0 numpy pandas scipy scikit-learn requests supabase python-dotenv
      - name: Compile original V2 source-first modules
        run: |
          python -m py_compile \
            serie_a_v2_forward_capture.py \
            serie_a_v2_attest_real_source.py \
            serie_a_v2_prequote_source_archive_gate.py \
            serie_a_v2_live_diagnostic_report.py \
            serie_a_v2_asof_feature_manifest.py \
            serie_a_v2_frozen_shadow_preview.py \
            market_anchor_1x2_v2_shadow.py \
            market_anchor_v2_source_rights.py \
            market_anchor_v2_source_capture_rights.py \
            market_anchor_v2_artifact_privacy.py \
            market_anchor_v2_direct_access.py \
            market_anchor_v2_saved_cohort_replay.py
      - name: Run original V2 source-first and frozen-contract regressions
        run: |
          python -m pytest -q \
            tests/test_serie_a_v2_forward_capture.py \
            tests/test_serie_a_v2_attest_real_source.py \
            tests/test_serie_a_v2_manual_quote_trigger_contract.py \
            tests/test_serie_a_v2_prequote_source_archive_gate.py \
            tests/test_serie_a_v2_live_diagnostic_report.py \
            tests/test_serie_a_v2_asof_feature_manifest.py \
            tests/test_serie_a_v2_atalanta_alias.py \
            tests/test_serie_a_v2_frozen_shadow_preview.py \
            tests/test_market_anchor_1x2_v2_shadow.py \
            tests/test_market_anchor_v2_source_rights.py \
            tests/test_market_anchor_v2_source_capture_rights.py \
            tests/test_serie_a_v2_original_diagnostic_direct_access.py \
            tests/test_serie_a_v2_forward_direct_access_rights.py \
            tests/test_market_anchor_v2_saved_cohort_replay.py \
            tests/test_market_anchor_v2_training_rights.py \
            tests/test_serie_a_v2_quote_persistence_timestamp_contract.py \\
            tests/test_serie_a_v2_source_first_validation_workflow_contract.py
      - name: Guard production model binaries
        run: git diff --exit-code origin/main...HEAD -- '*.pkl'
