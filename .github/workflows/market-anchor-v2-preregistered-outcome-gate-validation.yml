name: MARKET_ANCHOR V2 Preregistered Outcome-Read Gate Validation

on:
  pull_request:
    branches:
      - research/v2-workflow-live-access-hold-20261110-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - ".github/workflows/market-anchor-v2-preregistered-outcome-gate-validation.yml"
  push:
    branches:
      - research/v2-preregistered-outcome-gate-source-capture-20261118-run11
    paths:
      - "serie_a_v2_current_form_source_capture.py"
      - "tests/test_serie_a_v2_current_form_source_capture.py"
      - ".github/workflows/market-anchor-v2-preregistered-outcome-gate-validation.yml"

permissions:
  contents: read

jobs:
  preregistered-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            requirements: "requirements-v2-research-py311.lock"
          - python-version: "3.12"
            requirements: "requirements-v2-research-py312.lock"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned original V2 offline dependencies
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Verify preregistered gate, no pre-gate source access, and outcome scope
        run: |
          python -m py_compile serie_a_v2_current_form_source_capture.py
          python -m pytest -q tests/test_serie_a_v2_current_form_source_capture.py tests/test_market_anchor_1x2_v2_shadow.py
